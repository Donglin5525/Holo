      }
      function noteCard(n){return `<article class="note ${state.arrived===n.id?'arrived':''}" data-note="${n.id}"><button type="button" class="note-open" data-action="note" data-id="${n.id}" aria-label="阅读想法：${esc(n.text.slice(0,18))}"><div class="note-body">${esc(n.text)}</div>${n.photo?`<img class="note-photo" src="${photo}" alt="蓝天中舒展的白云，演示照片">`:''}</button><footer class="note-foot"><time>${n.time}</time><button type="button" class="note-tag" data-action="tag" data-tag="${esc(n.tag)}"># ${esc(n.tag)}</button></footer></article>`}
      function thoughts(){

        notes.forEach(n=>{if(lastDate!==n.date){list+=`${lastDate?'</section>':''}<section class="thought-day"><div class="day-heading">${n.date==='2026-10-23'?'<span class="today-dot"></span>':''}<b>${dateName(n.date)}</b><span>${shortDate(n.date)}</span></div>`;lastDate=n.date}list+=noteCard(n)});if(lastDate)list+='</section>';

      function openOverlay(title,body,{sheet=true,action='',kind='generic'}={}){

      function openNote(id){const n=state.notes.find(x=>x.id===id);if(!n){toast('这条记录已不在当前演示状态中');return}openOverlay('想法',`<div class="reading-date">${n.date.replaceAll('-',' / ')}　${n.time}</div><div class="reading-body">${esc(n.text)}</div>${n.photo?`<img class="reading-photo" src="${photo}" alt="蓝天与白云的演示照片">`:''}<div class="line"></div><button class="note-tag" data-action="tag" data-tag="${esc(n.tag)}"># ${esc(n.tag)}</button>`,{sheet:false,kind:'note',action:`<button class="header-action" style="color:var(--orange)" data-action="edit-note" data-id="${n.id}">编辑</button>`})}
      function editor(id=null){state.editorId=id;const n=state.notes.find(n=>n.id===id);openOverlay(id?'编辑想法':'记录想法',`<div class="reading-date">${id?n.date.replaceAll('-',' / '):'2026 / 10 / 23'}</div><textarea id="note-editor" class="editor" aria-label="想法正文" placeholder="此刻，想记下什么？">${esc(n?.text||'')}</textarea><p class="subtle">${n?'# '+esc(n.tag):'先写下来，稍后再整理。'}</p>`,{sheet:false,kind:'editor',action:'<button class="header-action" style="color:var(--orange)" data-action="save-note">保存</button>'});setTimeout(()=>app.querySelector('#note-editor')?.focus(),100)}
      function saveNote(){const input=app.querySelector('#note-editor');if(!input)return;const text=input.value.trim();if(!text){toast('先写一点内容吧');input.focus();return}let n=state.notes.find(n=>n.id===state.editorId);if(n){n.text=text;if(['n3','n4'].includes(n.id)){state.hiddenDiscovery=true;state.context=false}}else{n={id:'new-'+Date.now(),date:'2026-10-23',time:'09:41',tag:'日常',text};state.notes.unshift(n)}state.arrived=n.id;state.filter='';state.search='';state.screen='thoughts';state.editorId=null;render();toast('已留下这条想法');setTimeout(()=>state.arrived=null,650)}
      function eventsFor(d){const notes=state.notes.filter(n=>n.date===d);const events=notes.map(n=>({type:'thought',time:n.time,n}));if(state.scenario==='rich'){if(d==='2026-10-23')events.push({type:'finance',time:'12:18',title:'午餐',value:'¥32.00'});if(d==='2026-10-22')events.push({type:'habit',time:'18:40',title:'散步',value:'20 分钟'})}return events.sort((a,b)=>a.time.localeCompare(b.time))}
      function gallery(){const d=state.galleryDate;const title=state.scale==='week'?'这一周':state.scale==='month'?'十月':dateName(d);return `${header('记忆长廊',`<button class="header-action" data-action="gallery-insight">洞察</button>`)}<button class="growth-strip" data-action="growth"><span>已留下 <b>${dayCount()}</b> 天记录</span><span>我的积累 ›</span></button><div class="scroll" id="gallery-scroll"><div class="gallery-head"><div class="date-line">${state.scale==='week'?'2026 年 10 月 19 日 — 25 日':state.scale==='month'?'2026 年':d==='2026-10-23'?'2026 年 10 月 23 日 · 星期五':`${d.slice(0,4)} 年 ${shortDate(d)}`}</div><div class="row"><h1 class="page-title">${title}</h1>${d!=='2026-10-23'?'<button class="text-link" data-action="today">回到今天</button>':''}</div><div class="scale-tabs" aria-label="回看时间尺度">${[['day','日'],['week','周'],['month','月'],['timeline','时间轴']].map(([k,v])=>`<button class="${state.scale===k?'active':''}" aria-pressed="${state.scale===k}" data-action="scale" data-scale="${k}">${v}</button>`).join('')}</div></div>${state.scale==='week'?week():state.scale==='month'?month():state.scale==='timeline'?timeline(d):day(d)}</div>`}
      function day(d){const events=eventsFor(d);if(events.length)return `<div class="day-events">${events.map(e=>e.type==='thought'?`<article class="event"><div class="event-meta"><span>${e.time} · 想法</span><span>原文</span></div><button class="event-open" data-action="note" data-id="${e.n.id}"><div class="note-body">${esc(e.n.text)}</div>${e.n.photo?`<img class="note-photo" src="${photo}" alt="蓝天与白云的演示照片">`:''}</button><div class="event-foot"># ${esc(e.n.tag)}</div></article>`:`<article class="event"><div class="event-meta"><span>${e.time} · ${e.type==='finance'?'记账':'习惯'}</span></div><button class="event-open row" data-action="${e.type==='finance'?'receipt':'habit-detail'}"><span class="event-title">${e.title}</span><span>${e.value}</span></button></article>`).join('')}</div>`;
        if(!state.notes.length)return `<div class="empty" style="padding-top:20px"><h2>生活慢慢写，<br>这里慢慢有内容。</h2><p>记下的想法、账目和习惯，<br>会按日期留在这里。</p><button class="primary" data-action="new-note">留下一条想法</button></div>`;
        const last=[...state.notes].filter(n=>n.date<d).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0]||[...state.notes].sort((a,b)=>b.date.localeCompare(a.date))[0];
        return `<div class="today-empty"><p>${d==='2026-10-23'?'今天还没有留下记录。':'这天没有留下记录。'}</p><button class="text-link" data-action="new-note">记下此刻 ＋</button></div><section class="recent"><div class="eyebrow">最近留下的一段</div><div class="recent-date">${shortDate(last.date)}</div><button class="preview" data-action="focus-day" data-date="${last.date}">${last.photo?`<img class="note-photo" src="${photo}" alt="蓝天中舒展的白云，演示照片">`:''}<div class="note-body">${esc(last.text)}</div><div class="text-link">回到这一天 →</div></button></section>`
      }
      function timeline(d){
        const events=eventsFor(d);
        if(!events.length)return day(d);
        return `<div class="time-flow"><div class="eyebrow">按记录时间排列</div>${events.map(e=>`<div class="time-event"><time>${e.time}</time><div class="time-track"><span class="time-dot"></span><button class="event-open" data-action="${e.type==='thought'?'note':e.type==='finance'?'receipt':'habit-detail'}" ${e.type==='thought'?`data-id="${e.n.id}"`:''}><div class="subtle">${e.type==='thought'?'想法':e.type==='finance'?'记账':'习惯'}</div><p style="margin-top:7px;line-height:1.85;font-size:16px">${e.type==='thought'?esc(e.n.text):esc(e.title+' · '+e.value)}</p></button></div></div>`).join('')}<div class="subtle" style="padding:4px 0 22px 68px">这一天留下的痕迹</div></div>`
      }
      function week(){const days=Array.from({length:7},(_,i)=>19+i);return `<div class="week-grid">${days.map((d,i)=>`<button data-action="week-day" data-date="2026-10-${d}" class="${state.galleryDate==='2026-10-'+d?'selected':''} ${d>23?'future':''}" ${d>23?'disabled':''} aria-label="10月${d}日"><small>${['一','二','三','四','五','六','日'][i]}</small>${d}${eventsFor('2026-10-'+d).length?'<i></i>':''}</button>`).join('')}</div><div class="recent"><div class="eyebrow">${shortDate(state.galleryDate)} · ${eventsFor(state.galleryDate).length} 段记录</div></div>${day(state.galleryDate)}`}
      function month(){return `<div class="month-grid">${['一','二','三','四','五','六','日'].map(w=>`<span class="weekday">${w}</span>`).join('')}${'<span></span>'.repeat(3)}${Array.from({length:31},(_,i)=>{const n=i+1;const d='2026-10-'+String(n).padStart(2,'0');return `<button class="${eventsFor(d).length?'recorded':''} ${n===23?'today':''}" data-action="focus-day" data-date="${d}" ${n>23?'disabled':''} aria-label="10月${n}日，${eventsFor(d).length}段记录">${n}</button>`}).join('')}</div><div class="month-legend">雾蓝日期留下了记录 · 橙框是今天</div><div class="recent"><div class="eyebrow">这个月 · ${dayCount()} 天留下记录</div><p class="explanation">点开一个日期，回到那天写下的内容。</p></div>`}
      function growth(){openOverlay('我的积累',`<div class="eyebrow">每一次记录，都算数</div><div class="growth-big">${dayCount()}<small>天</small></div><p class="subtle">根据现有记录统计</p><div style="margin-top:30px"><div class="metric-row"><span>留下想法</span><span><b>${state.notes.length}</b> 条</span></div>${state.scenario==='rich'?'<div class="metric-row"><span>记账天数</span><span><b>1</b> 天</span></div><div class="metric-row"><span>习惯记录</span><span><b>1</b> 天</span></div>':''}</div><div class="line"></div><div class="eyebrow">走过的起点</div>${state.notes.length?`<div class="milestone"><p>留下第一条想法</p><span class="subtle">${[...state.notes].sort((a,b)=>a.date.localeCompare(b.date))[0].date.replaceAll('-',' / ')}</span></div>`:'<p class="subtle">第一条记录，会成为积累的起点。</p>'}`,{sheet:false})}
      function ai(){return `${header('HoloAI','<button class="header-action" data-action="ai-settings">设置</button>')}<div class="scroll chat-scroll" id="chat-scroll">${state.scenario==='rich'?'<div class="chat-date">今天 · 12:18</div><div class="user-message">午饭 32 元，记在餐饮。</div><div class="assistant-message">记下了。<div class="receipt"><div class="row"><span>午餐</span><span class="amount">−32.00</span></div><div class="subtle">人民币 · 餐饮 · 今天</div><button data-action="receipt">查看这笔账 →</button></div></div>':`<div class="chat-welcome"><h2>${state.scenario==='empty'?'从一句话开始。':'有什么想记下的？'}</h2><p>记一笔花费，留一个念头，<br>也可以聊聊正在做的事。</p></div>`}${state.chat.map(m=>`<div class="user-message">${esc(m)}</div>`).join('')}</div><div class="chat-bottom"><div class="capabilities"><button data-action="analysis">深度分析</button>${canDiscover()?`<button class="discovery ${state.discoveryRead?'read':''}" data-action="discovery">一个发现</button>`:''}<button data-action="replay">周期回放</button><button data-action="goal">规划目标</button></div>${state.context?'<div class="context-line"><span>关于这个发现 · 仅带入 2 段依据</span><button data-action="clear-context" aria-label="移除发现上下文">×</button></div>':''}<div class="composer"><textarea id="chat-input" rows="1" placeholder="说说此刻的想法…" aria-label="对 Holo 说"></textarea><button class="send" data-action="send" aria-label="发送消息">↑</button></div></div>`}
      function discovery(){if(!canDiscover()){toast('当前没有可展示的发现');return}state.discoveryRead=true;app.querySelector('.discovery')?.classList.add('read');openOverlay('记录里的一个发现',`<h2 class="sheet-title">这两次重新开始，<br>你都把第一步变轻了。</h2><p class="explanation">恢复运动时，你先出门走了十分钟；重新开始阅读时，你放下了每天读完一章的要求。这两段记录有相似之处，但还不能说明这种方式一直对你有效。</p><button class="evidence-toggle" data-action="evidence" aria-expanded="false"><span>看看依据 · 2 段记录</span><span>⌄</span></button><div id="discovery-evidence" hidden>${['n4','n3'].map(id=>{const n=state.notes.find(n=>n.id===id);return `<button class="evidence-row" data-action="note" data-id="${n.id}"><div class="subtle">${shortDate(n.date)} · 想法 ↗</div><p class="quote">${esc(n.text)}</p></button>`}).join('')}</div><div class="feedback-row"><button class="${state.liked?'chosen':''}" data-action="like">${state.liked?'已收到你的反馈':'有点像'}</button><button data-action="dislike">不太准确</button></div><button class="primary" data-action="discuss">聊聊这个</button><button class="manage-link" data-action="discovery-settings">管理一个发现</button>`,{kind:'discovery'})}
      function settings(){openOverlay('HoloAI 设置',`<div class="eyebrow">自动理解</div><div class="settings-row"><div><div>一个发现</div><p>${state.discovery?(canDiscover()?'有一个发现，可以重读':'有足够依据时再呈现'):'已关闭'}</p></div><input class="switch" id="discovery-switch" type="checkbox" role="switch" aria-label="开启一个发现" ${state.discovery?'checked':''}></div><p class="notice">开启后，从你允许的记录里寻找具体的联系。没有足够依据时，保持安静。</p>${state.discovery?`<button class="scope-button" data-action="permissions">允许来源 <span class="subtle">${esc(state.sources.join('、'))}</span> ›</button>`:''}<button class="scope-button" data-action="privacy">数据如何处理 ›</button><button class="scope-button" data-action="hidden">已隐藏的发现 <span class="subtle">${state.hiddenDiscovery?1:0}</span> ›</button><div class="line"></div><div class="eyebrow">关于你</div><button class="scope-button" data-action="profile-settings">个人档案 ›</button><button class="scope-button" data-action="memory-settings">长期记忆 ›</button><div class="line"></div><div class="eyebrow">自动处理</div><button class="scope-button" data-action="organize-settings">想法智能整理 ›</button><button class="scope-button" data-action="replay-settings">周期回放 ›</button>`,{sheet:false,kind:'settings'})}
      function permissions(){openOverlay('允许 Holo 看哪些记录？',`<p class="explanation">为了准备发现，必要的记录片段会经 Holo 后端交给第三方 AI 处理。你可以随时关闭；关闭不会删除原始记录。</p>${['想法','任务','习惯'].map(s=>`<label class="permission-option"><span>${s}</span><input type="checkbox" name="source" value="${s}" ${state.discovery&&state.sources.includes(s)?'checked':''}></label>`).join('')}<p class="notice">选择至少一类来源。是否有发现，取决于记录是否有足够依据。</p><button class="primary" data-action="enable-discovery">同意并开启</button>`,{kind:'permissions'})}
      function disableDiscovery(){readDraft();state.discovery=false;state.context=false;render();settings();toast('已关闭，原始记录保留')}
      function receipt(){openOverlay('账目详情',`<div class="eyebrow">2026 / 10 / 23　12:18</div><h2 class="sheet-title">午餐</h2><div class="growth-big" style="font-size:49px">−32.00<small>元</small></div><div class="metric-row"><span class="subtle">分类</span><span>餐饮</span></div><div class="metric-row"><span class="subtle">备注</span><span>午饭</span></div><div class="metric-row"><span class="subtle">记录方式</span><span>HoloAI 对话</span></div><p class="notice">这是一笔原型演示账目。</p>`,{sheet:false})}
      function existingFeature(kind){if(kind==='analysis'){openOverlay('深度分析',`<h2 class="sheet-title">想从哪一部分开始？</h2><button class="scope-button" data-action="analysis-result" data-domain="想法">最近的想法 ›</button><button class="scope-button" data-action="analysis-result" data-domain="财务">已记录的花费 ›</button><p class="notice">基于你选择的范围展开，结果可以回到原始记录核对。</p>`)}else if(kind==='replay'){openOverlay('周期回放',`<h2 class="sheet-title">回看一段生活。</h2>${[['day','今天'],['week','这一周'],['month','这个月']].map(([s,t])=>`<button class="scope-button" data-action="open-replay" data-scale="${s}">${t} ›</button>`).join('')}`)}else{openOverlay('规划目标',`<h2 class="sheet-title">最近想开始什么？</h2><input class="field" id="goal-input" aria-label="目标名称" placeholder="例如：整理一个作品集项目"><button class="primary" data-action="goal-preview">看看第一步</button>`)} }
      function resetScenario(value){state.scenario=value;state.notes=value==='rich'?seedNotes.map(n=>({...n})):value==='sparse'?[{...seedNotes[1]}]:[];state.filter='';state.search='';state.searchOpen=false;state.galleryDate='2026-10-23';state.scale='day';state.discovery=value==='rich';state.discoveryRead=false;state.hiddenDiscovery=false;state.liked=false;state.sources=value==='rich'?['想法']:[];state.chat=[];state.context=false;state.draft='';render()}
      root.addEventListener('change',e=>{if(e.target.id==='holo-scenario')resetScenario(e.target.value);if(e.target.id==='discovery-switch'){if(e.target.checked){e.target.checked=false;permissions()}else disableDiscovery()}});
      root.addEventListener('input',e=>{if(e.target.id==='note-search'){const p=e.target.selectionStart;state.search=e.target.value;render();const el=app.querySelector('#note-search');el.focus();el.setSelectionRange(p,p)}if(e.target.id==='chat-input')state.draft=e.target.value});
      root.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
      function send(){readDraft();if(!state.draft.trim()){toast('先写一句话吧');return}state.chat.push(state.draft.trim());state.draft='';state.context=false;render();const sc=app.querySelector('#chat-scroll');sc.scrollTop=sc.scrollHeight;toast('已演示发送；这里不会生成真实 AI 回答')}
      root.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b||!root.contains(b))return;
        if(b.dataset.screen){switchScreen(b.dataset.screen);return}
        const a=b.dataset.action;
        switch(a){
          case 'theme':state.theme=state.theme==='light'?'dark':'light';root.dataset.theme=state.theme;b.textContent=state.theme==='light'?'切换深色':'切换浅色';break;
          case 'home':openOverlay('返回 Holo',`<div class="eyebrow">前往</div><button class="scope-button" data-action="go-screen" data-screen-target="thoughts">想法 ›</button><button class="scope-button" data-action="go-screen" data-screen-target="gallery">记忆长廊 ›</button><button class="scope-button" data-action="go-screen" data-screen-target="ai">HoloAI ›</button><p class="notice">首页保留现有光球与导航。本次原型展示这三个页面。</p>`);break;
          case 'go-screen':switchScreen(b.dataset.screenTarget);break;
          case 'scope':scope();break;
          case 'search':state.searchOpen=!state.searchOpen;if(!state.searchOpen)state.search='';render();app.querySelector('#note-search')?.focus();break;
          case 'tag':case 'pick-tag':state.filter=b.dataset.tag;state.screen='thoughts';render();break;
          case 'clear-filter':state.filter='';state.search='';render();break;
          case 'note':openNote(b.dataset.id);break;
          case 'new-note':editor();break;
          case 'edit-note':editor(b.dataset.id);break;
          case 'save-note':saveNote();break;
          case 'discard-editor':app.querySelectorAll('[data-kind="discard"],[data-kind="editor"]').forEach(x=>x.remove());state.editorId=null;break;
          case 'close':closeOverlay();break;
          case 'growth':growth();break;
          case 'scale':state.scale=b.dataset.scale;render();break;
          case 'today':state.galleryDate='2026-10-23';render();break;
          case 'focus-day':state.galleryDate=b.dataset.date;state.scale='day';render();break;
          case 'week-day':state.galleryDate=b.dataset.date;render();break;
          case 'gallery-insight':openOverlay('洞察',`<h2 class="sheet-title">从记录里，慢慢认识自己。</h2><p class="explanation">想读最近准备好的发现，可以去 HoloAI 看看。</p><button class="primary" data-action="go-screen" data-screen-target="ai">前往 HoloAI</button>`);break;
          case 'habit-detail':openOverlay('这次散步',`<div class="eyebrow">2026 / 10 / 22　18:40</div><div class="growth-big">20<small>分钟</small></div><p class="explanation">下班后多走了一站路。</p><button class="text-link" data-action="note" data-id="n2">看看当天留下的想法 →</button>`);break;
          case 'receipt':receipt();break;
          case 'ai-settings':case 'discovery-settings':settings();break;
          case 'discovery':discovery();break;
          case 'evidence':{const el=app.querySelector('#discovery-evidence');el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));b.lastElementChild.textContent=el.hidden?'⌄':'⌃';break}
          case 'like':state.liked=true;b.textContent='已收到你的反馈';b.classList.add('chosen');break;
          case 'dislike':readDraft();state.hiddenDiscovery=true;render();openOverlay('已收起这条发现',`<p class="explanation">愿意的话，可以告诉 Holo 哪部分不合适。</p>${['依据不对','理解不对','现在不适用','不想看这类'].map(t=>`<button class="scope-button" data-action="feedback-reason">${t}</button>`).join('')}<button class="manage-link" data-action="close">暂时不说</button>`);break;
          case 'feedback-reason':closeOverlay();toast('已记下这次反馈');break;
          case 'discuss':readDraft();if(state.draft.trim()){openOverlay('保留正在写的内容？','<p class="explanation">输入框里还有未发送的文字。</p><button class="primary" data-action="keep-draft">保留原草稿</button><button class="manage-link" data-action="replace-draft">替换为发现讨论</button>')}else discuss();break;
          case 'keep-draft':render();break;
          case 'replace-draft':discuss();break;
          case 'clear-context':readDraft();state.context=false;render();break;
          case 'send':send();break;
          case 'permissions':permissions();break;
          case 'enable-discovery':{const list=[...app.querySelectorAll('input[name="source"]:checked')].map(i=>i.value);if(!list.length){toast('请至少选择一类记录');break}readDraft();state.sources=list;state.discovery=true;render();settings();toast('设置已更新，仅用于本次演示');break}
          case 'privacy':openOverlay('数据如何处理','<p class="explanation">“一个发现”只理解你明确允许的来源。必要片段会经 Holo 后端交给第三方 AI。</p><p class="explanation">你可以查看发现的依据，也可以关闭自动理解。关闭后停止新的处理，并清除本功能的派生内容；原始记录保留。</p><p class="notice">本原型只演示界面，不读取或发送真实生活记录。</p>');break;
          case 'hidden':openOverlay('已隐藏的发现',state.hiddenDiscovery?'<p class="explanation">你已收起 1 条发现。</p><p class="notice">恢复偏好后，允许未来有新依据时再次理解；不会直接恢复旧发现。</p><button class="primary" data-action="restore-preference">恢复这类偏好</button>':'<p class="explanation">目前没有隐藏记录。</p>');break;
          case 'restore-preference':b.disabled=true;b.textContent='偏好已恢复';toast('等待新的依据，旧发现仍保持收起');break;
          case 'profile-settings':openOverlay('个人档案','<label for="nickname" class="subtle">希望 Holo 怎么称呼你</label><input class="field" id="nickname" placeholder="你的昵称"><button class="primary" data-action="save-setting">保存</button>');break;
          case 'memory-settings':openOverlay('长期记忆','<label class="settings-row"><span>自动形成记忆</span><input class="switch" role="switch" type="checkbox" checked></label><label class="settings-row"><span>记忆辅助回答</span><input class="switch" role="switch" type="checkbox" checked></label><p class="notice">这些设置与“一个发现”分别控制。</p>');break;
          case 'organize-settings':openOverlay('想法智能整理','<label class="settings-row"><span>自动整理想法</span><input class="switch" role="switch" type="checkbox" checked></label><p class="notice">帮助整理主题和相关想法，原文始终保留。</p>');break;
          case 'replay-settings':openOverlay('周期回放','<label class="settings-row"><span>自动生成每周观察</span><input class="switch" role="switch" type="checkbox" checked></label><label class="settings-row"><span>每周提醒</span><input class="switch" role="switch" type="checkbox"></label>');break;
          case 'save-setting':closeOverlay();toast('已保存本次演示设置');break;
          case 'analysis':case 'replay':case 'goal':existingFeature(a);break;
          case 'analysis-result':openOverlay('范围预览',`<h2 class="sheet-title">${esc(b.dataset.domain)} · 最近 7 天</h2><p class="explanation">${state.notes.length?'将从这个范围内的已记录内容开始，结果保留原始来源供核对。':'这个范围内还没有足够记录。可以先留下一些内容。'}</p><p class="notice">本轮仅评审入口和层级，沿用现有深度分析流程。</p>`);break;
          case 'open-replay':state.screen='gallery';state.scale=b.dataset.scale;state.galleryDate='2026-10-23';render();break;
          case 'goal-preview':{const t=app.querySelector('#goal-input').value.trim();if(!t){toast('先写下想开始的事');break}openOverlay('带入对话',`<p class="explanation">${esc(t)}</p><button class="primary" data-action="goal-draft" data-goal="${esc(t)}">到对话中继续</button>`);break}
          case 'goal-draft':state.draft='我想开始：'+b.dataset.goal;render();break;
        }
      });
      function discuss(){state.draft='我想聊聊这两次重新开始。';state.context=true;state.screen='ai';render();app.querySelector('#chat-input')?.focus()}
      render();
    })();
  </script>
</div>
