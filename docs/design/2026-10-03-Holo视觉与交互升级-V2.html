ontent:space-around;padding:7px}.home-nav button{font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:1}.home-nav .center{width:56px;height:56px;background:#f46d38;color:#fff;border-radius:50%;flex:0 0 56px}.arc-text{position:absolute;width:170px;height:170px;left:11px;top:11px;fill:#ffffffe0;pointer-events:none}.home-small-arc{position:absolute;width:350px;height:350px;left:calc(50% - 175px);top:205px;pointer-events:none;animation:spin 120s linear infinite}.home-small-arc svg{width:100%;height:100%;overflow:visible}.home-small-arc circle.dot{animation:pulse 2s ease-in-out infinite alternate}.habit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.habit{margin:0}.habit .habit-head{display:flex;justify-content:space-between;align-items:center}.habit h3{font-size:17px;margin-top:12px}.week-dots{display:flex;gap:8px;margin:14px 0}.week-dots i{width:7px;height:7px;background:var(--inset);border:1px solid var(--border);border-radius:50%}.week-dots i.hit{background:var(--action);border:0}.habit .check{color:var(--action)}.habit button{width:100%;font-size:13px}.ai-header{display:flex;gap:8px;align-items:center;margin:16px 0;font-size:15px}.user-bubble{background:var(--inset);border-radius:16px;padding:12px 14px;max-width:85%;margin:18px 0 24px auto;font-size:17px}.chat-input{display:flex;gap:4px;align-items:center;margin-top:28px}.chat-input input{min-width:0;width:100%;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 12px;color:var(--text);font-size:17px}.chat-input button{min-width:44px;color:var(--action)}.thought-content{font-size:17px;line-height:1.9;margin:18px 0}.photo{height:170px;background:#d9d0b9;position:relative;overflow:hidden;border-radius:10px}.photo:before{content:"";position:absolute;width:270px;height:220px;border-radius:50%;background:#879a86;top:90px;left:-90px;transform:rotate(-20deg)}.photo:after{content:"";position:absolute;width:220px;height:170px;border-radius:50%;background:#52786d;top:100px;right:-20px}.chapter{border-top:1px solid var(--border);margin-top:24px;padding-top:20px}.chapter h3{font-size:28px;font-weight:500;margin:0 0 16px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0}.calendar-grid button{padding:2px;border-radius:8px;font-size:13px;min-height:38px}.calendar-grid .focus{background:var(--action);color:var(--on-action)}.error{border-left:2px solid #dc2626;padding:12px;font-size:15px;color:var(--secondary);margin-top:16px}.skeleton{height:15px;background:var(--inset);border-radius:4px;margin:14px 0}.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--action);border-radius:50%;display:inline-block;animation:spin 1s linear infinite}.avatar{width:48px;height:48px;border-radius:50%;background:var(--inset);display:flex;align-items:center;justify-content:center;color:var(--action)}.divider{height:1px;background:var(--border);margin:20px 0}

<div class="board"><aside class="sidebar"><div><div class="eyebrow">Design study / V2</div><div class="wordmark">Holo</div><p>保留品牌光球。<br>让内容清晰，让操作连贯。</p></div><nav id="navigation" aria-label="页面选择"></nav><p>本页使用虚构演示数据。<br>操作只改变当前原型，不写入 App。</p></aside>
<main class="stage"><div class="stage-title"><h1 id="page-title">首页</h1><span>视觉与交互 · 2026.10</span></div><div class="phone"><div class="status"><span>09:41</span><span>••• ━</span></div><div class="screen" id="screen"></div><div id="toast" aria-live="polite"></div></div><div class="footnote">光球在原型中展示品牌结构与节奏，原生代码保留现有参数。此处不能证明原生手势、性能或保存流程已通过验收。</div></main>
<aside class="inspector"><div class="control"><label for="theme">外观</label><select id="theme"><option value="light">浅色模式</option><option value="dark">深色模式</option></select></div><div class="control"><label for="size">文字大小</label><select id="size"><option value="1">默认</option><option value="1.18">较大</option><option value="1.45">辅助功能大字体</option></select></div><div class="control"><label for="state">内容状态</label><select id="state"><option value="ready">正常内容</option><option value="empty">没有内容</option><option value="loading">正在读取</option><option value="error">读取失败</option><option value="pending">等待确认</option></select></div><div class="control"><label for="motion">动态效果</label><select id="motion"><option value="normal">品牌原有动态</option><option value="reduced">减少动态效果</option></select></div><div class="notes"><h3>这一页的设计重点</h3><p id="design-note"></p><div class="swatches"><span class="swatch" style="background:var(--bg)"></span><span class="swatch" style="background:var(--surface)"></span><span class="swatch" style="background:var(--action)"></span><span class="swatch" style="background:#f46d38"></span></div><p>业务界面使用语义颜色，首页球体保持品牌橙与原有渐变。</p><p id="interaction-note"></p></div></aside></div>
<script>
const pages=[['home','首页'],['today','今天'],['chat','对话'],['tasks','任务'],['habits','习惯'],['finance','财务'],['health','健康'],['thoughts','想法'],['memory','记忆长廊'],['personal','个人']];
const notes={home:'光球、五角入口与底部三个入口保留。外围界面清楚、安静，品牌动态集中在原有光球。',today:'只突出一个主行动。安排用连续列表，正在推进的事与生活概览退到次级。',chat:'Holo 回复开放阅读，待确认与已保存结果清楚区分。语音、图片和停止操作持续可达。',tasks:'任务以行动内容为核心，完成后平稳补位，并给出三秒撤回入口。',habits:'中性背景、局部习惯色和完成勾选。保留快速记录，避免整墙高饱和色。',finance:'数字、时间、趋势与明细按层级呈现。普通支出不做红色警报。',health:'实际数据、变化和来源依次呈现。缺少数据与零值明确区分。',thoughts:'正文和照片优先，时间与标签作为次级信息。内容本身提供个人气质。',memory:'以日期串联生活记录，切换日周月仍保持同一天的上下文。',personal:'先呈现用户与个人内容，会员入口保持可达并退为次级。'};
let page='home',state='ready',scale='日',focus=3,completed=new Set(),saved=false,undoTimer=null,lastTask=null,habitDone=new Set(),theme='light';
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const chevron=icon('chevron');
function header(title,extra=''){return `<div class="page-header"><button onclick="go('home')" aria-label="返回首页">${icon('back')}</button><h2>${title}</h2>${extra}</div>`}
function chart(){return `<svg class="chart" viewBox="0 0 320 145" role="img" aria-label="演示趋势图"><path d="M0 120H320M0 75H320M0 30H320" fill="none" stroke="var(--border)" stroke-width=".5"/><path d="M8 100 50 88 93 98 135 53 180 70 224 44 268 49 312 19" fill="none" stroke="currentColor" stroke-width="2"/><g fill="var(--secondary)" font-size="11"><text x="8" y="141">周一</text><text x="145" y="141">周四</text><text x="290" y="141">周日</text></g></svg>`}
function row(title,sub='',trailing='',kind=''){return `<div class="row"><div class="glyph">${icon(kind||'task')}</div><div class="copy"><div class="body">${title}</div><div class="meta">${sub}</div></div>${trailing}</div>`}
function orbit(size,width,progress,opacity,cls=''){return `<div class="progress-orbit ${cls}" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-width}" fill="none" stroke="#fff" stroke-opacity="${opacity*.15}" stroke-width="${width}"/><circle cx="${size/2}" cy="${size/2}" r="${size/2-width}" fill="none" stroke="#fff" stroke-opacity="${opacity}" stroke-width="${width}" pathLength="100" stroke-dasharray="${progress} 100" transform="rotate(-90 ${size/2} ${size/2})"/></svg></div>`}
function home(){let modules=[['task','tasks','任务'],['finance','finance','财务'],['habit','habits','习惯'],['health','health','健康'],['thought','thoughts','想法']];return `<div class="home"><div class="brand-cloud"></div><div class="brand-cloud purple"></div><div class="brand-cloud blue"></div><div class="home-small-arc"><svg viewBox="0 0 350 350"><circle cx="175" cy="175" r="174" stroke="#c084fc" opacity=".12" stroke-dasharray="327 1090" fill="none"/><circle class="dot" cx="175" cy="1" r="3" fill="#c084fc" opacity=".4"/></svg></div><div class="home-content"><div class="home-header"><div><div class="meta">Holo</div><h2>早上好，东林</h2></div><button onclick="go('personal')" aria-label="个人与设置">${icon('settings')}</button></div><div class="schedule">14:00 · 项目周会</div><div class="orbit-stage"><div class="outer-orbit"></div><button class="sphere-button" onclick="go('today')" aria-label="今天，3项安排">${orbit(104,3.5,65,.55)}${orbit(75,2.8,70,.38,'mid')}${orbit(49,2.2,40,.26,'inner')}<div class="core-pulse"></div><svg class="arc-text" viewBox="0 0 170 170"><defs><path id="caption-path" d="M 32 133 Q 85 183 138 133"/></defs><text font-size="10.5" text-anchor="middle"><textPath href="#caption-path" startOffset="50%">今天有 3 项安排</textPath></text></svg></button>${modules.map(([cls,key,name])=>`<button class="home-module ${cls}" onclick="go('${key}')"><span class="glyph">${icon(cls)}</span>${name}</button>`).join('')}</div><div class="home-nav"><button onclick="go('personal')">${icon('person')}个人</button><button class="center" onclick="go('chat')" aria-label="对话">${icon('chat')}</button><button onclick="go('memory')">${icon('book')}记忆长廊</button></div></div></div>`}
function taskRow(id,title,time){const done=completed.has(id);return `<div class="row ${done?'done':''}"><button onclick="finishTask('${id}')" aria-label="${done?'撤回完成':'完成'}${title}">${done?icon('check'):'○'}</button><div class="copy"><div class="body">${title}</div><div class="meta">${time}</div></div></div>`}
function today(){return `<div class="page">${header('今天')}<div class="meta">10月3日 · 星期六</div><div class="card"><div class="kicker">接下来值得推进</div><h3>把周会材料整理好</h3><p class="support">来自「完成本周项目汇报」<br>离会议还有两小时，可以先整理关键进展。</p><div class="actions"><button class="action" onclick="go('tasks')">查看任务</button><button onclick="go('tasks')">先看其他事</button></div></div><button class="secondary" onclick="go('chat')">帮我理一理</button><div class="section">今天的安排</div>${taskRow('meeting','项目周会','14:00—15:00')}${taskRow('doc','整理汇报材料','今天')}${taskRow('walk','出去散步','18:00')}<div class="section">正在推进</div>${row('完成本周项目汇报','下一步 · 整理关键进展',chevron)}<div class="section">生活概览</div><div class="support">今天记了两笔账，散步已经记录。</div></div>`}
function transaction(){return `<div class="card"><div class="meta">${saved?'已记入财务':'支出待确认'}</div><h3>午餐</h3><div class="amount-large">−¥38.00</div><p class="meta">餐饮 · 今天 · 微信</p>${saved?'<button onclick="go(\'finance\')" class="secondary">查看明细</button>':`<div class="actions"><button class="secondary" onclick="saved=false;go('chat')">取消</button><button class="action" onclick="saveRecord(this)">确认记录</button></div>`}</div>`}
function chat(){return `<div class="page">${header('对话')}<div class="user-bubble">午餐花了38元，用微信付的。</div><div class="ai-header"><span class="glyph">${icon('chat')}</span><b>Holo</b><span class="chip">AI</span></div><p class="body">整理好了，请确认这笔记录。</p>${transaction()}<div class="support">记录保存后可以随时查看和修改。</div><div class="chat-input"><input id="message" aria-label="告诉Holo发生了什么" placeholder="告诉 Holo 发生了什么…"><button aria-label="图片识别记账" onclick="demoNotice('原生图片入口保留')">${icon('photo')}</button><button aria-label="语音输入" onclick="demoNotice('原生语音入口保留')">${icon('mic')}</button><button aria-label="发送消息" onclick="demoNotice('原型不发送消息')">${icon('send')}</button></div></div>`}
function tasks(){return `<div class="page">${header('任务')}<div class="segmented"><button class="selected">今天</button><button onclick="demoNotice('原生清单筛选保留')">清单</button><button onclick="demoNotice('原生筛选保留')">全部</button></div><div class="section">接下来</div>${taskRow('doc','整理汇报材料','今天 · 工作')}${taskRow('mail','回复合作邮件','今天 · 工作')}${taskRow('read','读完一章书','今晚 · 阅读')}<div class="section">正在推进</div>${row('完成本周项目汇报','已有 2 项行动完成',chevron)}<p class="meta">点击圆圈体验完成与三秒撤回。</p></div>`}
function habits(){let items=[['walk','散步','今日已记录','habit'],['water','喝水','3 / 8 杯','health'],['read','阅读','本周 4 天','book'],['weight','体重','最近 62.4 kg','person']];return `<div class="page">${header('习惯')}<div class="support">今天按自己的节奏。</div><div class="section">日常记录</div><div class="habit-grid">${items.map(([id,name,sub,glyph])=>`<div class="card habit"><div class="habit-head"><span class="glyph">${icon(glyph)}</span><span class="check">${habitDone.has(id)?icon('check'):''}</span></div><h3>${name}</h3><div class="meta">${habitDone.has(id)?'今天已记录':sub}</div><div class="week-dots">${Array.from({length:7},(_,i)=>`<i class="${i<4?'hit':''}"></i>`).join('')}</div><button class="secondary" onclick="habitDone.add('${id}');render()">${id==='water'?'+1':id==='weight'?'记录数值':'记录'}</button></div>`).join('')}</div><div class="section">本周痕迹</div><div class="support">你在四天里留下了阅读记录。</div></div>`}
function finance(){return `<div class="page">${header('财务')}<div class="meta">2026年10月</div><div class="section">本月支出</div><div class="amount-large">¥2,386.50</div><p class="support">收入 ¥8,000.00 · 较上月同期少12%</p><div class="card"><div class="meta">本周支出趋势</div>${chart()}</div><div class="section">今天</div>${row('午餐','12:16 · 微信','<span class="amount">−¥38.00</span>','finance')}${row('咖啡','09:08 · 微信','<span class="amount">−¥22.00</span>','finance')}${row('地铁','08:32 · 支付宝','<span class="amount">−¥4.00</span>','finance')}<div class="actions"><button class="action" onclick="go('chat')">记一笔</button><button class="secondary" onclick="demoNotice('原生统计页签保留')">统计</button></div></div>`}
function health(){return `<div class="page">${header('健康')}<div class="meta">今天 · 10月3日</div><div class="section">昨晚的睡眠</div><div class="amount-large">7小时42分</div><p class="support">最近七天平均 7小时18分</p><div class="card"><div class="meta">睡眠时长 · 最近七天</div>${chart()}</div>${row('步数','今天已同步','<span class="amount">6,284</span>','habit')}${row('运动','今天已同步','<span class="amount">32分钟</span>','health')}${row('身体状态','静息心率 · HRV · 呼吸频率',chevron,'health')}<p class="meta">数据来源：Apple 健康<br>本页为虚构数据，不提供健康判断。</p></div>`}
function thoughts(){return `<div class="page">${header('想法',`<button onclick="demoNotice('原生搜索保留')" aria-label="搜索想法">⌕</button>`)}<div class="card"><div class="meta">今天 · 16:32</div><div class="thought-content">出去走了走。<br>很多事不用今天就想出答案，先把眼前的一小步做好。</div><div class="photo" role="img" aria-label="原型绘制的山间景色示意"></div><div class="actions"><span class="chip">生活</span><span class="chip">慢下来</span></div></div><div class="card"><div class="meta">昨天 · 21:08</div><div class="thought-content">今天的汇报终于整理好了，关键是先写出三个要点。</div><div class="meta">工作 · 1个关联任务</div></div></div>`}
function memory(){return `<div class="page">${header('记忆长廊')}<div class="segmented">${['日','周','月'].map(x=>`<button class="${scale===x?'selected':''}" onclick="scale='${x}';render()">${x}</button>`).join('')}</div><div class="actions"><button onclick="focus=Math.max(1,focus-1);render()">‹</button><span class="body">10月${focus}日</span><button onclick="focus=Math.min(31,focus+1);render()">›</button></div>${scale==='日'?`<div class="chapter"><h3>10月${focus}日</h3><div class="meta">留下了 4 条生活记录</div>${row('午餐 ¥38.00','12:16 · 财务','', 'finance')}${row('散步','17:32 · 习惯','', 'habit')}<div class="thought-content">很多事不用今天就想出答案。</div><div class="photo" role="img" aria-label="景色示意"></div></div>`:scale==='周'?`<div class="section">这一周</div>${Array.from({length:7},(_,i)=>`<div class="row"><button onclick="focus=${i+1};scale='日';render()">10月${i+1}日</button><div class="copy"><div class="support">${i===focus-1?'当前选中的一天':'工作 · 记录 · 生活'}</div></div>${chevron}</div>`).join('')}`:`<div class="section">2026年10月</div><div class="calendar-grid">${Array.from({length:31},(_,i)=>`<button class="${focus===i+1?'focus':''}" onclick="focus=${i+1};render()">${i+1}</button>`).join('')}</div><p class="support">选中10月${focus}日。切回日视图继续查看。</p>`}</div>`}
function personal(){return `<div class="page">${header('个人')}<div class="row"><div class="avatar">${icon('person')}</div><div class="copy"><h3 style="margin:0">东林</h3><div class="meta">记录生活，慢慢推进。</div></div></div><div class="section">我正在做的事</div>${row('完成本周项目汇报','下一步 · 整理关键进展',chevron)}${row('建立阅读节奏','最近有4天留下了记录',chevron,'book')}<div class="section">我的生活档案</div><button style="width:100%;text-align:left" onclick="go('memory')">${row('长期记忆','查看与确认 Holo 对你的理解',chevron,'book')}</button><button style="width:100%;text-align:left" onclick="go('thoughts')">${row('我的想法','保存自己的文字与照片',chevron,'thought')}</button><div class="section">设置</div>${row('外观与显示','跟随系统',chevron,'settings')}<div class="card" style="margin-top:24px"><div class="body">Holo Plus</div><p class="meta">会员状态与权益在原生页面完整保留。</p><button class="secondary" onclick="demoNotice('原型不发起购买')">查看会员权益</button></div></div>`}
const renders={home,today,chat,tasks,habits,finance,health,thoughts,memory,personal};
function genericState(){let name=pages.find(x=>x[0]===page)[1];if(state==='empty')return `<div class="page">${header(name)}<div style="padding:48px 0"><h3>这里还没有记录</h3><p class="support">从一条记录开始，慢慢留下自己的生活。</p><button class="action" onclick="go('chat')">记录一件事</button></div></div>`;if(state==='loading')return `<div class="page">${header(name)}<p class="support"><span class="spinner"></span> 正在读取记录…</p><div class="card"><div class="skeleton"></div><div class="skeleton" style="width:65%"></div></div></div>`;if(state==='error')return `<div class="page">${header(name)}<div class="error">暂时读不到记录。你的内容不会因此被删除。<div class="actions"><button class="secondary" onclick="state='ready';document.querySelector('#state').value=state;render()">重试演示</button></div></div></div>`;return `<div class="page">${header(name)}<p class="support">这条记录需要你确认。</p>${transaction()}</div>`}
function render(){document.querySelector('#navigation').innerHTML=pages.map(([key,name],i)=>`<button class="${page===key?'active':''}" ${page===key?'aria-current="page"':''} onclick="go('${key}')"><span class="num">${String(i+1).padStart(2,'0')}</span>${name}</button>`).join('');document.querySelector('#page-title').textContent=pages.find(x=>x[0]===page)[1];document.querySelector('#screen').innerHTML=page==='home'||state==='ready'?renders[page]():genericState();document.querySelector('#design-note').textContent=notes[page];document.querySelector('#interaction-note').textContent=page==='tasks'||page==='today'?'点击完成圆圈，三秒内可撤回。演示状态不写入App。':page==='memory'?'切换日、周、月，选中日期会保持。':page==='chat'?'确认演示记录后，待确认结果变为已记入财务。':'左侧切换页面；上方控件可检查状态与字号。';}
function go(key){page=key;state='ready';document.querySelector('#state').value=state;render();document.querySelector('#screen').scrollTop=0}
function finishTask(id){if(completed.has(id)){completed.delete(id);if(lastTask===id){clearTimeout(undoTimer);document.querySelector('#toast').innerHTML=''}render();return}if(undoTimer)clearTimeout(undoTimer);completed.add(id);lastTask=id;render();document.querySelector('#toast').innerHTML=`<div class="toast"><span>已勾选 · 演示撤回窗口</span><button onclick="undoTask()">撤回</button></div>`;undoTimer=setTimeout(()=>{document.querySelector('#toast').innerHTML='';lastTask=null},3000)}
function undoTask(){clearTimeout(undoTimer);if(lastTask)completed.delete(lastTask);lastTask=null;document.querySelector('#toast').innerHTML='';render()}
function saveRecord(button){button.disabled=true;button.textContent='正在记录…';setTimeout(()=>{saved=true;render()},600)}
function demoNotice(message){document.querySelector('#toast').innerHTML=`<div class="toast"><span>${message}</span><button onclick="document.querySelector('#toast').innerHTML=''">知道了</button></div>`}
document.querySelector('#theme').addEventListener('change',e=>{theme=e.target.value;document.body.classList.toggle('dark',theme==='dark')});document.querySelector('#size').addEventListener('change',e=>document.documentElement.style.setProperty('--font-scale',e.target.value));document.querySelector('#state').addEventListener('change',e=>{state=e.target.value;if(state==='pending')saved=false;render()});document.querySelector('#motion').addEventListener('change',e=>document.body.classList.toggle('reduce-motion',e.target.value==='reduced'));render();
</script></body></html>
