  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const icon = name => '<svg class="ico" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
      const escapeHTML = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
      const tasks = [
        {id:'signup', title:'提交活动报名', meta:'今晚 21:00 截止', reason:'今晚到期，先把这件要紧的事保留。'},
        {id:'flight', title:'预订旅行机票', meta:'10 月 10 日截止 · 旅行筹备', reason:'今天只推进已有步骤：查看两个合适航班。'},
        {id:'materials', title:'整理旅行资料', meta:'无截止日期 · 旅行筹备', reason:'今天先放下，资料仍留在旅行事项里。'},
        {id:'photos', title:'整理照片', meta:'无截止日期', reason:'没有近期截止，今天可以先放下。'}
      ];
      const scenarios = {
        time:{input:'突然加班，只剩半小时。帮我理一理今天，先做什么？', keep:['signup','flight'], title:'先保留要紧的，其他放一放。', summary:'先完成报名，有余力再看两个航班。两件整理任务今天先放下。', caption:'时间不够时，保留期限，减少今天主动推进的事。'},
        light:{input:'今天很累，想早点休息。帮我保留要紧的事情，其他先放一放。', keep:['signup'], title:'今天先保留这一件。', summary:'报名今晚截止，先保留。旅行和整理今天先放下，原来的任务都还在。', caption:'负担太重时，可以只保留一件事，不自动把其他任务塞到明天。'},
        resume:{input:'这几天都没打开，旅行准备做到哪里了？帮我看看今天怎么接着来。', keep:['signup','flight'], title:'从停下的地方，接着来。', summary:'旅行已经确认了出行日期，接下来是查看候选航班。先照顾今晚的报名，再从这一小步继续。', caption:'中断以后沿用原任务和步骤，不重新生成一整套待办。'}
      };
      const initial = scenario => ({scenario, route:'home', modal:null, text:'', selected:tasks.map(t=>t.id), draft:[], completed:[], flightStepDone:false, adopted:false, previousSelected:tasks.map(t=>t.id), previousAdopted:false, receipt:'', activeTask:'signup', generation:0});
      let state = initial('time');
      let theme = 'light';
      let toastTimer;
      let focusBeforeModal;
      const storageKey = 'holo-today-relief-demo-v1';
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && scenarios[saved.scenario]) {
          state = initial(saved.scenario);
          for (const key of ['selected','previousSelected','completed']) if (Array.isArray(saved[key])) state[key] = [...new Set(saved[key].filter(id=>tasks.some(t=>t.id===id)))];
          for (const key of ['flightStepDone','adopted','previousAdopted']) state[key] = saved[key] === true;
        }
      } catch (_) { /* 原型存储不可用时，照常从示例开始。 */ }
      const doneForToday = id => id === 'flight' ? state.flightStepDone : state.completed.includes(id);
      const taskById = id => tasks.find(t=>t.id===id);
      const pendingSelected = () => state.selected.map(taskById).filter(t=>t&&!doneForToday(t.id));
      function persist() {
        try { const {scenario, selected, previousSelected, completed, flightStepDone, adopted, previousAdopted} = state; localStorage.setItem(storageKey, JSON.stringify({scenario,selected,previousSelected,completed,flightStepDone,adopted,previousAdopted})); } catch (_) { /* 演示仍可继续。 */ }
      }
      function toast(message) { clearTimeout(toastTimer); $('toast').textContent=message; $('toast').hidden=false; toastTimer=setTimeout(()=>{$('toast').hidden=true;},2200); }
      function dismissToast(){ clearTimeout(toastTimer); $('toast').hidden=true; }
      function action(name, label, className='primary', task='') { return '<button type="button" class="'+className+'" data-act="'+name+'"'+(task?' data-task="'+task+'"':'')+'>'+label+'</button>'; }
      function taskRow(t, held=false) {
        const done = doneForToday(t.id);
        const sub = t.id==='flight'&&state.adopted ? (done?'今天已推进一步 · 机票尚未预订':'今天只推进：查看两个合适航班') : t.meta;
        return '<div class="task-row"><span class="row-circle'+(done?' complete':'')+'" aria-hidden="true">'+(done?'✓':'')+'</span><div class="task-copy"><div class="title">'+t.title+'</div><div class="sub">'+sub+'</div></div>'+(held?action('readd','加入','text-button',t.id):action('task',icon('arrow'), 'row-open',t.id).replace('<button ','<button aria-label="查看'+t.title+'" '))+'</div>';
      }
      function renderToday() {
        const focus = pendingSelected()[0];
        const held = tasks.filter(t=>!state.selected.includes(t.id)&&!doneForToday(t.id));
        const selected = state.selected.map(taskById).filter(Boolean);
        let html = '<header class="app-bar"><strong>今天</strong><span class="date-text">10 月 3 日 · 周六</span>'+action('home',icon('close'),'icon-button').replace('<button ','<button aria-label="关闭今天，返回首页" ')+'</header><div class="screen-content">';
        if(state.receipt) html+='<div class="notice"><span>'+escapeHTML(state.receipt)+'</span>'+(state.adopted?action('undo','撤销安排','text-button'):'')+'</div>';
        html+='<div class="focus-card">';
        if(focus){ html+='<div class="kicker">'+icon(focus.id==='signup'?'clock':'task')+(focus.id==='signup'?'现在需要关注':'现在最值得推进')+'</div><h2 class="focus-title">'+focus.title+'</h2><p class="hint'+(focus.id==='signup'?' risk':'')+'">'+(focus.id==='flight'&&state.adopted?'先看两个合适航班，有余力再继续。':focus.meta)+'</p>'+action('task',focus.id==='flight'?'继续这一步':'查看任务','primary',focus.id); }
        else html+='<div class="kicker">按自己的节奏</div><h2 class="focus-title">今天先推进到这里。</h2><p class="hint">已有进度会保留，可以下次接着来。</p>';
        html+='</div>'+action('input',icon('wind')+'帮我理一理','relief-entry');
        html+='<section class="section"><div class="section-head"><h3>'+(state.adopted?'今天选择推进':'今天的安排')+'</h3><small>'+selected.length+' 件</small></div><div class="list">'+selected.map(t=>taskRow(t)).join('')+'</div></section>';
        if(!state.selected.includes('signup')&&!state.completed.includes('signup')) html+='<section class="section"><div class="section-head"><h3>固定安排与截止</h3></div><div class="list">'+taskRow(tasks[0])+'</div></section>';
        if(held.length) html+='<details class="held"><summary>今天先放下 · '+held.length+' 件　⌄</summary><div class="list">'+held.map(t=>taskRow(t,true)).join('')+'</div></details>';
        html+='<section class="section"><div class="section-head"><h3>正在推进</h3><small>查看全部</small></div><div class="matter-row"><span class="matter-icon">'+icon('plane')+'</span><div class="task-copy"><div style="font-size:13px;font-weight:500">旅行筹备</div><div class="hint">机票 10 月 10 日截止</div></div>'+action('task',icon('arrow'),'row-open','flight').replace('<button ','<button aria-label="查看旅行筹备的机票任务" ')+'</div></section>';
        html+='<section class="section"><div class="section-head"><h3>保持状态</h3></div><div class="quiet-strip"><span>习惯 · 今天 2 / 3</span><span>步数 · 8,240</span></div></section><section class="section"><div class="section-head"><h3>今日概况</h3></div><p class="hint">今天支出 ¥86.50</p></section></div>';
        $('today-screen').innerHTML=html;
      }
      function sheetHead(label) { return '<div class="sheet-grabber" aria-hidden="true"></div><div class="sheet-top"><span class="word">'+icon('spark')+label+'</span>'+action('close-modal',icon('close'),'icon-button').replace('<button ','<button aria-label="关闭弹层" ')+'</div>'; }
      function renderInput() {
        $('sheet').innerHTML=sheetHead('和 Holo 理一理')+'<div class="sheet-scroll"><h2 id="sheet-heading">今天怎么安排<br>更合适？</h2><p class="sheet-description">说说现在的情况。Holo 会结合已有安排，帮你保留要紧的事情。</p><div class="input-area"><label for="situation" class="hint" style="display:block;margin-bottom:5px">现在的情况</label><textarea id="situation" maxlength="500" placeholder="例如：突然加班，今晚只剩半小时……">'+escapeHTML(state.text)+'</textarea><div class="input-under"><span>文字或语音都可以</span>'+action('voice',icon('mic'),'voice-example').replace('<button ','<button aria-label="填入模拟语音转写" ')+'</div></div><div class="quick-phrases">'+action('phrase-time','时间不够了','')+action('phrase-light','今天想轻一点','')+action('phrase-resume','想接着上次做','')+'</div><div class="context-preview"><div class="context-label">结合你已有的安排</div><div class="context-line">'+icon('clock')+'活动报名 · 今晚 21:00 截止</div><div class="context-line">'+icon('plane')+'旅行机票 · 已有具体下一步</div></div></div><div class="sheet-footer">'+action('generate','帮我理一理')+'<p class="footer-note">查看建议时，原来的任务和安排保持不变。</p></div>';
      }
      function renderLoading(){ $('sheet').innerHTML=sheetHead('正在整理')+'<div class="sheet-scroll"><h2 id="sheet-heading">把今天理清楚。</h2><div class="loading-body"><span class="loader" aria-hidden="true"></span><p role="status">正在结合你的安排整理……</p></div></div><div class="sheet-footer">'+action('close-modal','先保留原安排','review-secondary')+'</div>'; }
      function reviewRow(t, keep){
        const locked=t.id==='signup';
        return '<div class="change-row"><span class="'+(keep?'check-mark':'held-mark')+'" aria-hidden="true">'+(keep?'✓':'−')+'</span><div class="task-copy"><div class="title">'+t.title+'</div><div class="reason">'+(keep?(t.id==='flight'?'只推进已有步骤：查看两个合适航班':locked?'今晚 21:00 截止，先保留。':'保留在今天，按自己的节奏推进。'):'留在原事项或清单，不自动移到明天。')+'</div>'+(t.id==='flight'?'<span class="pill">原截止：10 月 10 日</span>':'')+'</div>'+(locked?'<span class="pill" style="margin-top:4px">期限保留</span>':action(keep?'defer':'keep',keep?'先放下':'保留','',t.id))+'</div>';
      }
      function renderReview(){
        const scenario=scenarios[state.scenario];
        const open=tasks.filter(t=>!doneForToday(t.id));
        const kept=open.filter(t=>state.draft.includes(t.id));
        const held=open.filter(t=>!state.draft.includes(t.id));
        const originalSuggestion=kept.length===scenario.keep.length&&scenario.keep.every(id=>state.draft.includes(id));
        const title=originalSuggestion?scenario.title:kept.length?'今天保留 '+kept.length+' 件，按自己的节奏。':'今天先推进到这里。';
        const summary=originalSuggestion?scenario.summary:(kept.length?'今天保留'+kept.map(t=>'「'+t.title+'」').join('、')+'。':'今天先不增加要推进的事，已有进度会保留。')+(held.length?'另外 '+held.length+' 件今天先放下，原来的任务和截止日期都还在。':'原来的截止日期保持不变。');
        let html=sheetHead('今天的调整')+'<div class="sheet-scroll"><h2 id="sheet-heading">'+title+'</h2><div class="suggestion-intro">'+summary+'</div>';
        if(kept.length) html+='<div class="group-label"><h3>今天保留</h3><small>'+kept.length+' 件</small></div><div class="change-group">'+kept.map(t=>reviewRow(t,true)).join('')+'</div>';
        if(held.length) html+='<div class="group-label"><h3>今天先放下</h3><small>'+held.length+' 件</small></div><div class="change-group">'+held.map(t=>reviewRow(t,false)).join('')+'</div>';
        html+='<div class="constraint-note">'+icon('lock')+'<span>原截止日期保留。完成机票的一步，不等于已经预订机票。</span></div><details class="basis"><summary>为什么这样安排　⌄</summary><p>依据：你刚才表达的当前情况、报名今晚到期，以及旅行已有的步骤。报名耗时未核实，不承诺半小时能全部完成。</p></details></div><div class="sheet-footer">'+action('adopt','采用这个安排')+action('input','再说一句','review-secondary')+'</div>';
        $('sheet').innerHTML=html;
      }
      function renderTask(){
        const t=taskById(state.activeTask)||tasks[0];
        let html=sheetHead('原任务')+'<div class="sheet-scroll"><h2 id="sheet-heading">'+t.title+'</h2><p class="sheet-description">'+t.meta+'</p>';
        if(t.id==='flight'){
          html+='<div class="task-result">任务结果：确认并购买旅行机票。<br>当前状态：尚未预订。</div><div class="kicker">'+(state.flightStepDone?'今天已经推进一步':'接着上次的进度')+'</div><div class="current-step"><strong>'+(state.flightStepDone?'下一步：比较候选航班':'查看两个合适航班')+'</strong><p class="hint" style="margin-top:7px">'+(state.flightStepDone?'今天可以停在这里，下次从这一步继续。':'找到两个候选并记下时间，做到这里就完成这一步。')+'</p></div><ol class="step-list"><li>已完成：确认出行日期</li><li>'+(state.flightStepDone?'已完成：':'待推进：')+'查看两个合适航班</li><li>比较价格与时间</li><li>确认并购买机票</li></ol></div><div class="sheet-footer">'+action(state.flightStepDone?'close-modal':'complete-step',state.flightStepDone?'回到今天':'这步好了')+'<p class="footer-note">这一步的进度已保留，机票尚未预订。</p></div>';
        } else {
          const done=state.completed.includes(t.id);
          html+='<div class="task-result">'+(done?'这件事已经完成。':'按原任务要求完成后，再确认完成。')+'</div></div><div class="sheet-footer">'+action(done?'close-modal':'complete-task',done?'回到今天':'我已完成这件事','primary',t.id)+'</div>';
        }
        $('sheet').innerHTML=html;
      }
      function render(){
        document.documentElement.dataset.theme=theme;
        document.querySelector('[data-act="theme"]').textContent=theme==='light'?'切换深色':'切换浅色';
        document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scenario===state.scenario)));
        $('home-screen').hidden=state.route!=='home';
        $('today-screen').hidden=state.route==='home';
        $('home-screen').inert=state.route!=='home'||!!state.modal;
        $('today-screen').inert=state.route==='home'||!!state.modal;
        const unfinished=tasks.filter(t=>!state.completed.includes(t.id)).length;
        $('home-reminder-copy').textContent='有 '+unfinished+' 个任务待完成';
        $('orb-caption').textContent=state.adopted?'今天先推进'+pendingSelected().length+'件事':'今天有'+pendingSelected().length+'项安排';
        if(state.route==='today') renderToday();
        $('sheet-mask').hidden=!state.modal;
        if(state.modal==='input') renderInput();
        if(state.modal==='loading') renderLoading();
        if(state.modal==='review') renderReview();
        if(state.modal==='task') renderTask();
        const captions={input:'说一句当前情况，或点一个快捷表达。原型将展示对应情境的模拟建议。',loading:'正在演示整理过程，可以随时取消。',review:'看看要保留什么、放下什么；可以逐项调整，再一次采用。',task:'继续原任务。机票只完成一步时，整个预订任务仍未完成。'};
        $('step-caption').textContent=state.modal?captions[state.modal]:(state.route==='home'?'首页沿用原结构。点击中间的光球，进入「今天」。':state.adopted?'采用后仍在原来的「今天」。试着完成报名，再推进机票一步。':'整理入口位于「今天」内，首页不用增加任何卡片或按钮。');
      }
      function openModal(kind){ dismissToast(); focusBeforeModal=document.activeElement; state.modal=kind; render(); const first=$('sheet').querySelector(kind==='input'?'textarea':'button'); if(first) first.focus({preventScroll:true}); }
      function closeModal(){ state.generation++; state.modal=null; render(); const target=focusBeforeModal&&focusBeforeModal.isConnected?focusBeforeModal:$('today-screen').querySelector('[data-act="input"]'); if(target) target.focus({preventScroll:true}); }
      function selectScenario(id){ dismissToast(); const generation=state.generation+1; state=initial(id); state.generation=generation; persist(); render(); }
      document.addEventListener('click',event=>{
        const scenario=event.target.closest('[data-scenario]');
        if(scenario){ selectScenario(scenario.dataset.scenario); return; }
        const button=event.target.closest('[data-act]');
        if(!button) return;
        const act=button.dataset.act;
        if(act==='theme'){ theme=theme==='light'?'dark':'light'; render(); return; }
        if(act==='reset'){ selectScenario(state.scenario); return; }
        if(act==='unrelated'){ toast('这个入口保留原位置；本原型只演示今天减负。'); return; }
        if(act==='home'){ state.generation++; state.modal=null; state.route='home'; render(); return; }
        if(act==='today'){ state.route='today'; render(); return; }
        if(act==='ai'){ state.route='today'; state.text=scenarios[state.scenario].input; openModal('input'); toast('AI 对话也可以进入同一整理流程。'); return; }
        if(act==='input'){ if(!state.text) state.text=scenarios[state.scenario].input; openModal('input'); return; }
        if(act==='close-modal'){ closeModal(); return; }
        if(act==='voice'){ state.text=scenarios[state.scenario].input; renderInput(); toast('已填入模拟语音转写，没有调用麦克风。'); return; }
        if(act.startsWith('phrase-')){ const id=act==='phrase-time'?'time':act==='phrase-light'?'light':'resume'; state.scenario=id; state.text=scenarios[id].input; render(); return; }
        if(act==='generate'){
          state.text=$('situation').value.trim();
          if(!state.text){ $('situation').setAttribute('aria-invalid','true'); $('situation').focus(); toast('先说一句当前情况。'); return; }
          state.draft=scenarios[state.scenario].keep.filter(id=>!doneForToday(id));
          state.modal='loading'; const token=++state.generation; render();
          setTimeout(()=>{ if(state.generation!==token||state.modal!=='loading') return; state.modal='review'; render(); $('sheet').querySelector('button').focus({preventScroll:true}); },550);
          return;
        }
        if(act==='keep'||act==='defer'){
          const id=button.dataset.task;
          if(id==='signup') return;
          state.draft=act==='keep'?[...new Set([...state.draft,id])]:state.draft.filter(x=>x!==id);
          renderReview(); return;
        }
        if(act==='adopt'){
          const nextSelected=tasks.filter(t=>doneForToday(t.id)||state.draft.includes(t.id)).map(t=>t.id);
          if(nextSelected.length===state.selected.length&&nextSelected.every(id=>state.selected.includes(id))){ closeModal(); toast('按原来的安排继续，今天没有新增调整。'); return; }
          state.previousSelected=[...state.selected]; state.previousAdopted=state.adopted;
          state.selected=nextSelected;
          state.adopted=true; const held=tasks.filter(t=>!state.selected.includes(t.id)&&!doneForToday(t.id)).length;
          state.receipt='已更新今天，'+held+' 件事今天先放下。'; state.modal=null; persist(); render(); $('today-screen').scrollTop=0; return;
        }
        if(act==='undo'){ state.selected=[...state.previousSelected]; state.adopted=state.previousAdopted; state.receipt='已恢复上次的今日安排，完成进度保留。'; persist(); render(); return; }
        if(act==='readd'){ const id=button.dataset.task; if(!state.selected.includes(id)) state.selected.push(id); state.receipt='已将「'+taskById(id).title+'」重新加入今天。'; persist(); render(); return; }
        if(act==='task'){ state.activeTask=button.dataset.task; openModal('task'); return; }
        if(act==='complete-task'){
          const id=button.dataset.task;
          if(!state.completed.includes(id))state.completed.push(id);
          state.receipt='已完成「'+taskById(id).title+'」。'; state.modal=null; persist(); render(); return;
        }
        if(act==='complete-step'){ state.flightStepDone=true; state.receipt='机票已推进一步，预订任务仍未完成。'; persist(); render(); return; }
      });
      document.addEventListener('input',event=>{ if(event.target.id==='situation'){ state.text=event.target.value.slice(0,500); event.target.removeAttribute('aria-invalid'); } });
      $('sheet-mask').addEventListener('click',event=>{ if(event.target===$('sheet-mask')) closeModal(); });
      document.addEventListener('keydown',event=>{
        if(!state.modal)return;
        if(event.key==='Escape'){ event.preventDefault(); closeModal(); return; }
        if(event.key==='Tab'){
          const controls=Array.from($('sheet').querySelectorAll('button:not([disabled]),textarea,input,summary')).filter(el=>el.getClientRects().length>0);
          if(!controls.length)return;
          const first=controls[0],last=controls[controls.length-1];
          if(event.shiftKey&&document.activeElement===first){ event.preventDefault(); last.focus(); }
          if(!event.shiftKey&&document.activeElement===last){ event.preventDefault(); first.focus(); }
        }
      });
      render();
    })();
  </script>
</body>
</html>
