on);padding:4px 0;min-height:44px;text-align:left;font-size:13px}.footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:7px}.title{font-size:27px;line-height:1.35;font-weight:600;letter-spacing:-.5px;margin:4px 0 10px}.sub{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 20px}.section-title{font-size:16px;margin:23px 0 9px;font-weight:600}.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;margin:12px 0}.card.soft{background:var(--inset);border:0}.card-title{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.card p{margin:8px 0 0;color:var(--muted);font-size:13px}.tag{font-size:10px;font-weight:400;white-space:nowrap;color:var(--muted);background:var(--inset);border-radius:5px;padding:3px 6px}.tag.green{background:#edf5ef;color:var(--green)}.tag.blue{background:#edf3f7;color:var(--blue)}.tag.orange{background:#fff0e4;color:#9e400a}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .info{min-width:0;flex:1}.row small{display:block;color:var(--muted);font-size:12px}.row strong{font-weight:550;font-size:14px}.circle-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;background:var(--inset);color:var(--action);flex-shrink:0;font-size:18px}.row-action{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 10px;font-size:12px;flex-shrink:0}.row-action.done{background:#edf5ef;color:var(--green);border-color:transparent}.field{margin:18px 0}.field label{font-size:13px;display:block;margin-bottom:6px;font-weight:550}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:12px;min-height:48px}.field textarea{resize:vertical;min-height:110px}.field small{col p:18px;display:flex;gap:18px;align-items:center;color:var(--muted);font-size:12px}.journey-bottom strong{color:var(--text);font-weight:500}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);border:1px solid var(--line);padding:13px 20px;border-radius:12px;background:#333;color:white;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;font-size:13px;z-index:20}.toast.show{opacity:1;transform:translateX(-50%)}dialog{width:min(380px,calc(100vw - 28px));border:1px solid var(--line);border-radius:22px;padding:23px;background:var(--bg);color:var(--text);box-shadow:0 20px 70px #0002;max-height:85vh}dialog::backdrop{background:#1e191944;backdrop-filter:blur(3px)}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheet-head h3{font-size:19px;margin:0}.sheet-head button{background:none;border:0;font-size:22px}.sheet-note{font-size:12px;color:var(--muted);margin:10px 0}.error{color:#b42318;font-size:12px;min-height:22px}.badge-block{display:flex;gap:6px;flex-wrap:wrap}.success-mark{width:54px;height:54px;background:#edf5ef;color:var(--green);border-radius:50%;font-size:25px;display:grid;place-items:center;margin:5px 0 18px}.notes-toggle{display:none}.screen .primary:active{transform:scale(.99)}

<body>
<div class="wrap">
<header class="mast"><div class="logo">Holo<i></i></div><div class="meta">目标 × 日常行动 · 交互提案 01</div><button class="plain" data-action="reset">重新体验</button></header>
<div class="intro"><div><h1>一个目标，连接每一天。</h1><p>从「我想减肥」出发，看一份计划怎样落到习惯、任务和财务，再把日常记录带回目标。</p></div><div class="legend"><span><i class="dot"></i>结果</span><span><i class="dot green"></i>行动</span><span><i class="dot blue"></i>限制</span></div></div>
<div class="branchbar" id="source-branches" aria-label="原型用户状态"></div>
<main class="layout">
<aside><div class="rail-label">用户旅程 / 点击切换</div><nav class="journey" id="journey" aria-label="用户旅程"></nav><div class="rail-note">从第一步开始体验；也可以直接跳到任意一步查看。<br>计划确认后的页面使用两周后的示例记录。</div><div class="scenario"><div class="rail-label">反馈场景 / 第 4、6 步</div><div id="scenarios"></div></div></aside>
<section class="device" aria-label="手机交互原型"><div class="screen"><div class="status"><span>9:41</span><span>▰ ▰▰ ▱</span></div><div class="appbar"><button class="icon-btn" data-action="back" aria-label="返回上一步">‹</button><b id="app-title">目标</b><button class="icon-btn" data-action="help" aria-label="查看原型说明">⋯</button></div><div class="appbody" id="app" aria-live="polite"></div><div class="appfooter" id="footer"></div></div></section>
<aside class="context" id="context"></aside>
</main>
<div class="journey-bottom"><strong>闭环的关键</strong><span>目标确定方向 → 原模块承接执行 → 记录回到目标 → 复盘调整原计划</span><span>可点击原型 · 全部为示例数据 · 不会操作真实账户</span></div>
</div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><h3 id="sheet-title"></h3><button data-action="close" aria-label="关闭弹窗">×</button></div><div id="sheet-content"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const phases=[['说出愿望','从一句话开始'],['一起想清楚','补齐关键事实'],['确认计划','一次关联多个模块'],['目标总览','结果、行动、限制'],['日常执行','在原模块记录'],['每周复盘','理解偏离与进展'],['确认调整','让建议真的生效']];
const descriptions=[
 {title:'先接住愿望，再组织行动。',lead:'用户不必先理解任务、习惯、预算的区别。先说想改变什么，Holo 再把愿望翻译成一份能开始的计划。',intent:'入口保持轻量。支持直接输入，也提供一个能立即体验的示例。',interaction:'点「一起制定计划」，进入最多三个关键问题。',rule:'这一步只收集意图；不会提前创建习惯或预算。',try:'保留默认愿望，点底部按钮，顺着走一遍。',nodes:['一句愿望','目标共创']},
 {title:'只问会改变计划的问题。',lead:'先确定什么算成功，再了解现实约束。先匹配与体重指标兼容的现有习惯：有则建议复用，无则在计划确认时新建。',intent:'只在用户允许使用的范围内匹配相关习惯；名称、数值类型、单位与测量口径一致才可建议关联。多个候选让用户选择，不擅自转移已有目标归属。',interaction:'填写目标数值；选择执行节奏和预算范围。可以返回上一题修改。',rule:'「按时上床」来自自报，「按时入睡」来自健康主睡眠记录。时点由用户确认；睡眠时长不代替入睡时间。缺记录不计失败。',try:'切换上方「没有体重习惯」，体验不先建习惯、也不强制先测量的创建流程。',nodes:['起点与结果','可承担行动','可选限制']},
 {title:'让一份计划直接落地。',lead:'先让用户看懂每项设置的用途，再一次确认。可以删掉不想执行的建议，或者调整预算。',intent:'按「达到什么 / 怎么做 / 控制什么」组织，而非按模块堆表单。',interaction:'勾选保留的项目，点击「调整」修改额度。确认后查看目标总览。',rule:'体重按需关联或新建；奶茶预算展示 ¥150 → 新额度，不重复创建，也不静默覆盖。',try:'取消早睡，或取消金额预算；后续页面会同步隐藏这些项目。',nodes:['目标','习惯','任务','分类预算']},
 {title:'一眼看出，进展发生在哪里。',lead:'目标页分别展示真实结果、执行情况和限制状态。行动完成率不会直接变成减肥进度。',intent:'首屏先给克制的判断，再展示结果。用户能查看来源，也能进入日常记录。',interaction:'点「看记录来源」查看依据；点「去记录今天」切换到原模块。',rule:'缺少近期测量时，明确暂不能判断结果；已有记录仍保留。',try:'切换左侧「缺少近期体重」或「行动完成、结果未改善」，比较首屏结论。',nodes:['体重 → 结果','打卡 → 行动','记账 → 限制']},
 {title:'每天记录一次，就够了。',lead:'目标创建出来的设置出现在习惯、任务和财务里。用户在熟悉的地方执行，目标自动跟随更新。',intent:'原模块显示「来自减肥目标」，给行动一个明确的理由。',interaction:'健身 +1、早睡打卡、记录体重或奶茶杯数；切到财务添加消费。',rule:'记账只更新金额。奶茶杯数独立记录；两者不能互相代填。',try:'添加一笔 ¥18 的消费，再回目标查看；杯数不会自动增加。',nodes:['习惯 / 任务 / 财务','同一条原始记录','目标自动读取']},
 {title:'复盘不是再给一份报表。',lead:'把本周事实变成一个可行动的判断。执行不足时，先理解阻力；执行足够但结果未改善时，重新审视方案。',intent:'结论 → 事实 → 一个调整建议。避免一天一次催促，也避免一次波动就判失败。',interaction:'切换三种反馈场景；选择现实阻力，生成一份具体调整预览。',rule:'不给因果承诺，不把旧体重当作当前结果，也不自动修改计划。',try:'正常场景选择「时间不好安排」，下一步把运动安排到具体日子。',nodes:['本周证据','理解阻力','一项调整']},
 {title:'最后一步，要改到原计划里。',lead:'建议变成明确的修改前后差异。用户确认后，原模块里的设置同步更新，并保留计划版本。',intent:'先展示改变哪一项、影响什么，再确认。历史记录不被重写。',interaction:'点「确认更新计划」，回到目标查看新安排；也可保留原计划。',rule:'未确认不修改。预算、任务和习惯各自遵守已有的数据与归属规则。',try:'确认后进入「日常执行」，核对新任务或新记录提醒是否出现。',nodes:['修改预览','用户确认','原模块更新']}
];

 $('app').innerHTML=[welcome,questions,plan,dashboard,daily,review,adjustment][s.step]();footer();
}
function scenarioButtons(){return [['normal','正常记录 · 有行动缺口'],['missing','缺少近期体重'],['stalled','行动完成 · 结果未改善']].map(([id,t])=>`<button class="plain ${s.scenario===id?'active':''}" data-action="scenario" data-scenario="${id}">${t}</button>`).join('');}
function welcome(){return `<div class="eyebrow">一个新的开始 · 9月28日</div><div class="title">你想让生活，<br>发生什么变化？</div><p class="sub">先说一个愿望。我们一起把它变成<br>能开始、能观察、能调整的计划。</p><div class="field"><label for="wish">我想……</label><textarea id="wish" data-field="wish">${esc(s.wish)}</textarea></div><div class="card soft"><div class="card-title">这次，我们一起做三件事</div><div class="timeline"><div class="timeline-item">确定一个能观察的结果<small>知道什么算「做到了」</small></div><div class="timeline-item">安排适合你的行动<small>习惯、任务和预算各司其职</small></div><div class="timeline-item">从日常记录里看进展<small>不需要每天重复汇报</small></div></div></div><p class="sub" style="font-size:12px">示例：减肥目标。接下来的数字可以修改。</p>`;}
function weightEmpty(){return s.habitMode!=='existing'&&!s.weightRecorded;}
function habitMatchCard(){if(s.habitMode==='new')return `<div class="card"><div class="card-title">一起建一个「体重记录」习惯 ${tag('计划中新建','orange')}</div><p>尚未找到合适的体重记录习惯。<br>确认计划时一起创建，无需先离开这里。</p></div>`;return `<div class="card"><div class="card-title">已有「体重」习惯 ${tag('建议关联','green')}</div><p>${s.habitMode==='empty'?'目前还没有测量记录；可以先启用计划。':'最近记录 78 kg · 9月28日'}<br>确认后关联它，不重复创建。</p></div>`;}
function weightCard(){if(weightEmpty())return `<div class="card"><div class="card-title">${s.deferBaseline?'等待首次测量':'等待下一次测量'} ${tag('结果待观察')}</div><p>${s.deferBaseline?'起点还未建立。首次测量会作为本次目标起点。':'已确认起点 '+fmt(s.baseline)+' kg，尚无后续测量。'}<br>目标 ${fmt(s.target)} kg。行动可以先开始，结果暂不计算。</p><button class="link-btn" data-action="weight">记录一次体重 →</button><button class="link-btn" data-action="sources">看记录来源 →</button></div>`;return '' ;}
const sleepSamples=[['10/5晚','23:10'],['10/6晚','00:20'],['10/7晚','23:25'],['10/8晚',null],['10/9晚','23:05'],['10/10晚','23:50'],['10/11晚',null]];
function nightMinute(time){const [h,m]=time.split(':').map(Number);const minutes=h*60+m;return minutes<720?minutes+1440:minutes;}
function sleepStats(){const known=sleepSamples.filter(x=>x[1]);const passed=known.filter(x=>nightMinute(x[1])<=nightMinute(s.bedtime)).length;return {known:known.length,passed,late:known.length-passed,missing:7-known.length};}
function sleepName(){return '不晚于 '+s.bedtime+(s.sleepSource==='health'?' 入睡':' 上床');}
function sleepFact(){const h=sleepStats();return s.sleepSource==='health'?`<div class="factline"><span>按时入睡 · 健康记录</span><strong>${h.passed}/${h.known} 晚有记录</strong></div><p>规则：主睡眠入睡时间不晚于 ${s.bedtime}。<br>${h.late} 晚超过约定 · ${h.missing} 晚缺记录，不计失败。</p>`:`<div class="factline"><span>按时上床 · 自报</span><strong>已打卡 ${s.sleep} 晚</strong></div><p>约定：不晚于 ${s.bedtime} 上床准备睡觉。<br>本周 ${7-s.sleep} 晚未记录，不代表没有做到。</p>`;}
function sleepChoices(){return `<div class="section-title">这次怎样观察作息？</div><label class="choice"><input type="radio" name="sleepSource" data-field="sleepSource" value="self" ${s.sleepSource==='self'?'checked':''}>自己记录按时上床<small>按约定时间上床并准备睡觉；不等于已经入睡。</small></label><label class="choice"><input type="radio" name="sleepSource" data-field="sleepSource" value="health" ${s.sleepSource==='health'?'checked':''}>关联健康中的入睡记录<small>已有主睡眠入睡记录：近 7 晚覆盖 5 晚。关联后自动观察，不重复打卡。</small></label>`;}
function sleepEvidence(){if(s.sleepSource==='self')return `<div class="row"><div class="info"><strong>作息 · 习惯自报打卡</strong><small>不晚于 ${s.bedtime} 上床准备睡觉。已记录 ${s.sleep} 晚，${7-s.sleep} 晚未记录。无法由此得知实际入睡时间。</small></div></div>`;return `<div class="row"><div class="info"><strong>作息 · 健康主睡眠记录</strong><small>按各晚主睡眠的首次入睡时间判断；跨午夜仍归同一晚。阈值为不晚于 ${s.bedtime}。</small></div></div>`+sleepSamples.map(([day,time])=>`<div class="factline"><span>${day}</span><span>${time?time+' · '+(nightMinute(time)<=nightMinute(s.bedtime)?'按约定入睡':'超过约定'):'缺记录 · 不计失败'}</span></div>`).join('');}
function questions(){const headers=['什么变化，会让你觉得达成了？','什么样的节奏，你能坚持？','有没有想一起控制的消费？'];let fields='';if(s.q===0)fields=`<div class="chat">先把「减肥」变成一个能观察的结果。我们以体重作为这次的主要指标。</div>${habitMatchCard()}<label class="choice"><input type="checkbox" data-action="defer-baseline" ${s.deferBaseline?'checked':''}>现在还不知道体重，稍后记录<small>可以先开始行动；首次测量后建立起点。</small></label><div class="inline-fields">${field('起点 / kg','baseline',s.deferBaseline?'':s.baseline,'number','step="0.1" min="1" placeholder="首次测量后建立" '+(s.deferBaseline?'disabled':''))}${field('目标 / kg','target',s.target,'number','step="0.1" min="1"')}</div>${field('希望什么时候回顾结果','deadline',s.deadline,'date')}<p class="sub" style="font-size:12px">默认数字是演示设置；目标值与期限以你的确认为准。</p>`;
 if(s.q===1)fields=`<div class="chat">不用一次改变所有事情。先选你愿意投入的运动节奏，再定义什么算早睡。</div><label class="choice"><input type="radio" name="freq" data-field="freq" value="3" ${s.freq===3?'checked':''}>每周运动 3 次<small>用周频习惯追踪，时间可以灵活安排</small></label><label class="choice"><input type="radio" name="freq" data-field="freq" value="2" ${s.freq===2?'checked':''}>先从每周运动 2 次开始<small>降低启动负担，复盘时再调整</small></label>${sleepChoices()}${field(s.sleepSource==='health'?'主睡眠最晚入睡时间':'最晚上床准备睡觉的时间','bedtime',s.bedtime,'time')}<div class="card soft"><p style="margin:0">${s.sleepSource==='health'?'这里观察健康记录中的实际入睡时间。缺记录时保留未知，不自动改成自报。':'这里记录的是你自报的上床行为，不能据此断言实际入睡。'}作息和体重结果分别观察。</p></div>`;
 if(s.q===2)fields=`<div class="chat">奶茶的杯数和花费可以分别控制。你也可以在下一页取消其中一项。</div><div class="inline-fields">${field('每月最多 / 杯','teaLimit',s.teaLimit,'number','min="0" step="1"')}${field('每月金额 / 元','budget',s.budget,'number','min="1" step="1"')}</div><div class="field"><label for="scope">对应的记账范围</label><select id="scope" disabled><option>日常账本 → 奶茶</option></select><small>按「奶茶」分类统计，不包含整个餐饮或宵夜分类。</small></div><div class="card"><div class="card-title">已有分类预算 ${tag('修改预览','blue')}</div><p>当前每月 ¥150；拟调整为 ¥${fmt(s.budget)}。<br>下一步确认后才生效。</p></div><div class="card soft"><p style="margin:0">一次消费可能买了多杯。记账金额不会自动变成喝奶茶的杯数。</p></div>`;
 return `<div class="eyebrow">关键问题 ${s.q+1} / 3</div><div class="title" style="font-size:25px">${headers[s.q]}</div><div class="ai-label"><span class="ai-mark">✦</span>HoloAI · 一起想清楚</div>${fields}<div class="error" id="question-error"></div>${s.q>0?btn('← 上一个问题','question-back','link-btn'):''}`;}
function option(key,title,detail,badge){return `<div class="selectrow"><input id="opt-${key}" type="checkbox" data-option="${key}" ${s.opts[key]?'checked':''}><label for="opt-${key}">${title}<small>${detail}</small></label>${tag(badge,key==='budget'?'blue':'')}</div>`;}
function plan(){return `<div class="eyebrow">计划预览 · 尚待确认</div><div class="title">一起把愿望，<br>落到每一天。</div><p class="sub">保留你愿意做的部分。<br>一次确认，所选设置一起生效。</p><div class="section-title">01 · 我要达到什么</div><div class="card"><div class="card-title">${s.deferBaseline?'体重目标 '+fmt(s.target)+' kg':'体重 '+fmt(s.baseline)+' → '+fmt(s.target)+' kg'} ${tag('主要结果','orange')}</div><p>${esc(s.deadline)} 回顾目标结果<br>${s.habitMode==='new'?'新建「体重记录」数值习惯 · 测量类':'关联已有「体重」数值习惯，不重复创建'}。${s.deferBaseline?'<br>首次测量后建立起点，当前不计算结果进度。':''}</p><button class="link-btn" data-action="edit-goal">修改结果与期限</button></div><div class="section-title">02 · 我准备怎么做</div><div class="card">${option('exercise','每周运动 '+s.freq+' 次','周频习惯 · 不限定每天打卡','新建')}${option('sleep',sleepName(),s.sleepSource==='health'?'观察规则 · 自动读健康主睡眠记录，不建重复打卡':'打卡习惯 · 自报上床准备睡觉',''+(s.sleepSource==='health'?'关联健康':'新建'))}${option('prep','准备替代饮品','一次性任务 · 帮助开始行动','新建')}</div><div class="section-title">03 · 我要控制什么</div><div class="card">${option('tea','奶茶每月最多 '+s.teaLimit+' 杯','数值习惯 · 记录实际喝的杯数','新建')}${option('budget','奶茶每月最多 ¥'+fmt(s.budget),'日常账本 / 奶茶 · 原额度 ¥150','修改')}<button class="link-btn" data-action="edit-budget">调整杯数与预算</button></div><div class="card soft"><div class="card-title">每周日，一起回顾</div><p>看行动是否跟上，体重是否有变化。<br>不会用打卡率代替减肥进度。</p></div>`;}
function evaluation(){if(weightEmpty())return {title:'行动可以开始，结果等待测量。',body:s.deferBaseline?'体重习惯已准备好。记录首次测量后建立起点，再持续观察变化。':'起点已确认，暂时没有后续测量。可以评价行动，但还不能评价结果。',warn:true};if(s.habitMode!=='existing'&&s.weightRecorded)return {title:'测量已记录，继续观察结果。',body:'现有测量还不足以判断阶段趋势。行动与限制继续分别查看。',warn:false};if(s.scenario==='missing')return {title:'行动有记录，结果还需要一次测量。',body:'最近体重记录停留在 10月1日。可以看执行情况，暂不判断当前减重趋势。',warn:true};if(s.scenario==='stalled')return {title:'行动跟上了，结果仍需观察与复核。',body:'最近两周体重测量未见明显下降。先复核记录与方案假设，不直接增加运动量。',warn:true};if(s.current>=s.baseline)return {title:'当前测量还未显示减重进展。',body:'先继续按约定观察，回顾执行与测量情况。单次变化不等于计划失效。',warn:true};return {title:s.opts.exercise&&s.exercise<s.freq?'体重有变化，运动还差一点。':'已记录的行动在推进，继续观察结果。',body:s.opts.exercise&&s.exercise<s.freq?`本周运动 ${s.exercise}/${s.freq} 次。结果与行动分开看，下次复盘再决定是否调整。`:'近期体重比起点降低。一次波动不判失败，持续记录后再回顾。',warn:false};}
function currentWeight(){return s.scenario==='stalled'?77.9:s.current;}
function summary(){const e=evaluation();return `<div class="answer ${e.warn?'warn':''}"><strong>${e.title}</strong><p>${e.body}</p></div>`;}
function chart(){if(s.habitMode!=='existing')return '<p>新的记录来源暂未形成趋势；继续记录后再回顾。</p>';const missing=s.scenario==='missing';const vals=missing?[78,77.9]:s.scenario==='stalled'?[78,77.9,78,77.8,77.9,77.9]:[78,77.9,77.8,77.7,77.9,s.current];const lo=Math.min(...vals)-.15,hi=Math.max(...vals)+.15;const points=vals.map((v,i)=>[10+i*290/(vals.length-1),14+(hi-v)/(hi-lo)*60]);return `<svg class="spark" viewBox="0 0 310 88" role="img" aria-label="${missing?'截至10月1日的历史体重，近期缺记录':'示例体重测量变化，不作为完成时间预测'}"><path d="M10 74H300" stroke="#e9e4da"/><polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${points.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#fdfcf8" stroke="#ea580c" stroke-width="1.5"/>`).join('')}</svg><div class="sparktext"><span>9月28日</span><span>${missing?'10月1日 · 历史记录':'10月11日'}</span></div>`;}
function dashboard(){const w=currentWeight(),missing=s.scenario==='missing';return `<div class="eyebrow">${s.completed?'已完成':s.updated?'计划 V'+s.revision+' · 已更新':'示例回访 · 第14天'} · 10月11日</div><div class="title">轻一点，<br>也更有精力。</div>${summary()}<div class="section-title">结果 · 体重</div>${weightEmpty()?weightCard():`<div class="card"><div class="card-title">${missing?'上次测量':'当前测量'} ${tag(missing?'需要更新':'来自数值习惯',missing?'':'orange')}</div><div class="metric" style="margin-top:10px">${fmt(missing?77.9:w)}<em>kg</em></div><div class="metric-target">起点 ${fmt(s.baseline)} kg · 目标 ${fmt(s.target)} kg</div>${chart()}<div class="factline"><span class="muted">${missing?'不能用旧值判断当前趋势':w<=s.baseline?'比起点降低 '+fmt(s.baseline-w)+' kg':'比起点增加 '+fmt(w-s.baseline)+' kg'}</span></div><p>${missing?'最后记录：10月1日':esc(s.weightNote)}</p><button class="link-btn" data-action="sources">看记录来源 →</button>${w<=s.target&&!missing&&!s.completed?btn('核对并确认目标完成','complete','secondary'):''}</div>`}${s.opts.exercise||s.opts.sleep||s.opts.prep?'<div class="section-title">行动 · 本周 10/5—10/11</div><div class="card">'+(s.opts.exercise?`<div class="factline"><span>运动</span><strong>${s.exercise} / ${s.freq} 次</strong></div><div class="progress green"><span style="width:${pct(s.exercise,s.freq)}%"></span></div>${s.scheduled?'<p>下周已安排：'+['周二','周四','周六'].slice(0,s.freq).join('、')+'</p>':''}${s.nextFreq?'<p>下周起：每周运动 '+s.nextFreq+' 次 · 本周仍按原计划回顾</p>':''}`:'')+(s.opts.sleep?`<div class="factline"><span>${s.sleepSource==='health'?'按时入睡 · 健康记录':'按时上床 · 自报'}</span><strong>${s.sleepSource==='health'?sleepStats().passed+'/'+sleepStats().known+' 晚有记录':'已打卡 '+s.sleep+' 晚'}</strong></div><p>${s.sleepSource==='health'?'不晚于 '+s.bedtime+' 入睡 · '+sleepStats().missing+' 晚缺记录':'不晚于 '+s.bedtime+' 上床 · '+(7-s.sleep)+' 晚未记录'}，不计失败。</p>`:'')+(s.opts.prep?`<div class="factline"><span>准备替代饮品</span><span class="${s.prepDone?'good':'muted'}">${s.prepDone?'已完成':'待完成'}</span></div>`:'')+'</div>':''}${s.opts.tea||s.opts.budget?'<div class="section-title">限制 · 10月</div><div class="card">'+(s.opts.tea?`<div class="factline"><span>已记录奶茶</span><strong>${s.tea} / ${s.teaLimit} 杯</strong></div>`:'')+(s.opts.budget?`<div class="factline"><span>奶茶已记支出</span><strong>¥${fmt(s.spent)} / ${fmt(s.budget)}</strong></div><div class="progress blue"><span style="width:${pct(s.spent,s.budget)}%"></span></div><p>${s.spent>s.budget?'已记支出超出预算 ¥'+fmt(s.spent-s.budget):'预算剩余 ¥'+fmt(s.budget-s.spent)} · 日常账本 / 奶茶</p>`:'')+'</div>':''}<button class="link-btn" data-action="review">本周复盘 →</button>`;}
function daily(){let content='';if(s.tab==='habits')content=`<p class="sub">在习惯里记录，目标会自动读取。<br>不用回目标再填一遍。</p><div class="row"><div class="circle-icon">↗</div><div class="info"><strong>记录体重</strong><small>${weightEmpty()?'尚未测量 · 先记录一次':s.scenario==='missing'?'上次测量：10月1日':fmt(currentWeight())+' kg · 最近测量'}</small><div class="origin">为「减肥目标」提供结果</div>${s.remindWeight?'<small>每周日提醒记录</small>':''}</div><button class="row-action" data-action="weight">记录</button></div>${s.opts.exercise?`<div class="row"><div class="circle-icon">↟</div><div class="info"><strong>每周运动 ${s.freq} 次</strong><small>本周 ${s.exercise}/${s.freq} 次${s.nextFreq?' · 下周目标 '+s.nextFreq+' 次':''}</small><div class="origin">来自减肥目标 · 行动</div></div><button class="row-action ${s.exercise>=s.freq?'done':''}" data-action="exercise">+1 次</button></div>`:''}${s.opts.sleep?`<div class="row"><div class="circle-icon">☾</div><div class="info"><strong>${sleepName()}</strong><small>${s.sleepSource==='health'?'健康记录 · '+sleepStats().passed+'/'+sleepStats().known+' 晚有记录':'自报打卡 · 本周 '+s.sleep+' 晚'}</small><div class="origin">来自减肥目标 · 行动</div></div><button class="row-action ${s.todaySleep?'done':''}" data-action="${s.sleepSource==='health'?'sleep-details':'sleep'}">${s.sleepSource==='health'?'看记录':s.todaySleep?'已打卡':'打卡'}</button></div>`:''}${s.opts.tea?`<div class="row"><div class="circle-icon">◡</div><div class="info"><strong>奶茶杯数</strong><small>本月已记录 ${s.tea} 杯 · 上限 ${s.teaLimit} 杯</small><div class="origin">来自减肥目标 · 限制</div></div><button class="row-action" data-action="tea">记录</button></div>`:''}<div class="card soft"><p style="margin:0">体重是结果来源；运动是行动记录。它们不会混成一个完成率。</p></div>`;
 if(s.tab==='tasks')content=`<p class="sub">长期规则留在习惯里。<br>这里承接需要完成的一次具体行动。</p>${s.opts.prep?`<div class="row"><button class="check ${s.prepDone?'done':''}" data-action="prep" aria-label="${s.prepDone?'撤销':'完成'}准备替代饮品">${s.prepDone?'✓':'○'}</button><div class="info"><strong>准备替代饮品</strong><small>今天 · 一次性准备</small><div class="origin">来自减肥目标</div></div></div>`:''}${s.scheduled?['周二','周四','周六'].slice(0,s.freq).map((d,i)=>`<div class="row"><button class="check ${s.sessionsDone?.[i]?'done':''}" data-action="session" data-index="${i}" aria-label="${d}运动任务">${s.sessionsDone?.[i]?'✓':'○'}</button><div class="info"><strong>${d}运动</strong><small>下周安排 · ${s.sessionsDone?.[i]?'已完成（演示）':'待执行'}</small><div class="origin">来自计划 V${s.revision}</div></div></div>`).join(''):''}${s.reviewCheck?'<div class="row"><button class="check" data-action="review-check" aria-label="完成方案复核">'+(s.reviewCheckDone?'✓':'○')+'</button><div class="info"><strong>复核测量记录与执行方案</strong><small>下周 · '+(s.reviewCheckDone?'已完成':'待完成')+'</small><div class="origin">来自每周复盘</div></div></div>':''}${!s.opts.prep&&!s.scheduled&&!s.reviewCheck?'<div class="card soft"><p>这份计划暂时没有一次性任务。持续行动在习惯里执行。</p></div>':''}<div class="card soft"><p style="margin:0">完成准备工作不会算成一次健身，也不会直接增加结果进度。下周任务的记录按下周统计。</p></div>`;
 if(s.tab==='finance')content=`<p class="sub">记账金额自动进入预算统计。<br>不会把交易笔数当成奶茶杯数。</p>${s.opts.budget?`<div class="card"><div class="card-title">奶茶 · 10月 ${tag('目标关联','blue')}</div><div class="metric" style="font-size:32px;margin-top:14px">¥${fmt(s.spent)}<em>/ ${fmt(s.budget)}</em></div><div class="progress blue"><span style="width:${pct(s.spent,s.budget)}%"></span></div><p>${s.spent>s.budget?'已超过额度':'预算剩余 ¥'+fmt(s.budget-s.spent)}<br>日常账本 / 奶茶</p></div>`:'<div class="card soft"><p>你没有启用奶茶金额预算。仍可以正常记账，目标不评价这一项限制。</p></div>'}<div class="section-title">最近支出</div>${s.expenseAdded.slice().reverse().map(e=>`<div class="row"><div class="info"><strong>${esc(e.note)}</strong><small>10月11日 · 奶茶</small></div><span>−¥${fmt(e.amount)}</span></div>`).join('')}<div class="row"><div class="info"><strong>奶茶消费</strong><small>10月9日 · 示例历史支出</small></div><span>−¥24</span></div><div class="card soft"><p style="margin:0">本月已有 ¥72 示例支出。数据只表示已记账部分，不能证明全部消费都已记录。</p></div>${btn('＋ 记一笔奶茶消费','expense','secondary')}`;
 return `<div class="eyebrow">10月11日 · 星期日</div><div class="title">今天，做一点就好。</div><div class="tabs" role="tablist" aria-label="日常模块">${[['habits','习惯'],['tasks','任务'],['finance','财务']].map(([id,t])=>`<button role="tab" aria-selected="${s.tab===id}" data-action="tab" data-tab="${id}" class="${s.tab===id?'active':''}">${t}</button>`).join('')}</div>${content}`;}
function reviewAction(){if(weightEmpty()||s.scenario==='missing'||!s.opts.exercise)return {kind:'measure',title:'先把体重观测接回来',before:'体重习惯 · 没有固定记录提醒',after:'体重习惯 · 每周日提醒记录',why:'先补足近期观测，再判断结果是否偏离。',button:'看看记录提醒怎么改 →'};if(s.scenario==='stalled')return {kind:'recheck',title:'加一次方案复核，不自动加码',before:'尚未安排体重记录与方案复核',after:'新增任务：复核测量记录与执行方案',why:'已有行动记录不能证明行动有效，先核对测量条件和方案假设。',button:'看看方案复核任务 →'};if(s.blocker==='heavy')return {kind:'lighter',title:'先降低一点执行负担',before:'每周运动 '+s.freq+' 次',after:'每周运动 '+Math.max(1,s.freq-1)+' 次',why:'你反馈当前计划过重。先试一个较轻节奏，下周复盘，不承诺结果会更快。',button:'看看频率怎么调整 →'};return {kind:'schedule',title:'先给运动留出具体时间',before:'每周运动 '+s.freq+' 次 · 时间未安排',after:'保持每周 '+s.freq+' 次 · 增加具体日程任务',why:'你反馈时间难安排。先解决安排问题，保留原频率。',button:'看看下周怎么安排 →'};}
function review(){const a=reviewAction();return `<div class="eyebrow">周复盘 · 10/5—10/11</div><div class="title">这周，<br>什么值得继续？</div>${summary()}<div class="section-title">判断来自这些事实</div><div class="card">${weightEmpty()?'<div class="factline"><span>体重</span><span>尚无后续测量，结果待观察</span></div>':s.scenario==='missing'?'<div class="factline"><span>体重</span><span>近期缺少测量</span></div>':`<div class="factline"><span>体重观测</span><span>${s.scenario==='stalled'?'近两周未见明显下降':'最新 '+fmt(s.current)+' kg'}</span></div>`}${s.opts.exercise?`<div class="factline"><span>本周运动</span><strong>${s.exercise}/${s.freq} 次</strong></div>`:''}${s.opts.sleep?sleepFact():''}${s.opts.budget?`<div class="factline"><span>本月奶茶已记支出</span><span>¥${fmt(s.spent)}/${fmt(s.budget)}</span></div>`:''}<button class="link-btn" data-action="sources">查看事实与范围</button></div>${s.scenario==='normal'?`<div class="section-title">执行时，最难的是什么？</div><label class="choice"><input type="radio" name="blocker" data-field="blocker" value="time" ${s.blocker==='time'?'checked':''}>时间不好安排<small>想做，但总找不到稳定的时间</small></label><label class="choice"><input type="radio" name="blocker" data-field="blocker" value="heavy" ${s.blocker==='heavy'?'checked':''}>现在的计划有点重<small>先调整到更容易开始的节奏</small></label>`:''}<div class="card soft"><div class="card-title">${a.title}</div><p>${a.why}</p></div><p class="sub" style="font-size:12px">本周行动与本月预算分别展示。不因它们同期变化，就断言某项行为导致减重。</p>`;}
function adjustment(){const a=s.updated?s.lastAdjustment:reviewAction();return `<div class="eyebrow">计划调整 · V${s.revision} ${s.updated?'已生效':'→ V'+(s.revision+1)}</div>${s.updated?'<div class="success-mark">✓</div>':''}<div class="title">${s.updated?'计划已更新。':'只改这一件，<br>下周再看。'}</div><p class="sub">${s.updated?'记录继续留在原模块，目标会读取同一份数据。':a.why}</p><div class="card"><div class="eyebrow">修改前</div><p style="margin-bottom:18px">${a.before}</p><div class="eyebrow" style="color:var(--action)">修改后</div><div style="font-size:16px;font-weight:550;margin:8px 0">${a.after}</div>${a.kind==='schedule'?'<p>下周安排：'+['周二','周四','周六'].slice(0,s.freq).join('、')+'。<br>每次任务完成后，按同一次执行更新当周习惯次数。</p>':''}</div><div class="section-title">会影响哪里</div><div class="row"><div class="circle-icon">↗</div><div class="info"><strong>${a.kind==='measure'?'体重习惯':a.kind==='lighter'?'运动习惯':'任务模块'}</strong><small>${a.kind==='measure'?'新增记录提醒':a.kind==='lighter'?'更新周目标次数':'新增具体执行任务'}</small></div>${tag(s.updated?'已更新':'待确认',s.updated?'green':'')}</div><div class="card soft"><div class="card-title">历史留着，下一步更清楚。</div><p>过去的记录保留。修改后的规则从下周开始，下一次复盘为 10月18日。</p></div>${s.updated?`<div class="timeline"><div class="timeline-item">计划 V${s.revision} 已保存<small>用户确认 · 10月11日</small></div><div class="timeline-item">下次复盘 · 10月18日<small>观察新安排的执行情况</small></div></div>`:''}`;}
function openSheet(title,html){$('sheet-title').textContent=title;$('sheet-content').innerHTML=html;$('sheet').showModal();}
function closeSheet(){$('sheet').close();}
function readNumber(id,min,max=Infinity){const el=$(id);if(!el)return null;const raw=el.value.trim(),v=Number(raw);return raw&&Number.isFinite(v)&&v>=min&&v<=max?v:null;}
function validateQuestion(){if(s.q===0&&((!s.deferBaseline&&(!(s.baseline>0)||s.target>=s.baseline))||!(s.target>0)||!/^\d{4}-\d{2}-\d{2}$/.test(s.deadline))){$('question-error').textContent='请填写有效的起点、较低的目标值和日期。';return false;}if(s.q===1&&!/^\d{2}:\d{2}$/.test(s.bedtime)){ $('question-error').textContent='请确定具体的早睡时间。';return false;}if(s.q===2&&(!(s.budget>0)||!Number.isInteger(s.teaLimit)||s.teaLimit<0)){ $('question-error').textContent='金额需大于零，杯数需为零或正整数。';return false;}return true;}
function sources(){openSheet('这次判断，依据什么？',`<p class="sheet-note">全部为演示记录，可在原模块修改。目标只读取这些事实。</p><div class="row"><div class="info"><strong>结果 · 体重习惯</strong><small>${weightEmpty()?(s.habitMode==='new'?'本次计划新建体重习惯；尚未测量':'已关联体重习惯；尚未测量'):s.scenario==='missing'?'最后记录 10月1日 · 近期缺观测':s.scenario==='stalled'?'近两周测量未见明显下降':'最新 '+fmt(s.current)+' kg · '+esc(s.weightNote)}</small></div></div>${s.opts.exercise||s.opts.sleep?`<div class="row"><div class="info"><strong>行动 · 习惯记录</strong><small>10/5—10/11<br>${s.opts.exercise?'运动 '+s.exercise+'/'+s.freq+' 次':''}</small></div></div>`:''}${s.opts.sleep?sleepEvidence():''}${s.opts.tea?`<div class="row"><div class="info"><strong>限制 · 奶茶数值习惯</strong><small>10月已记录 ${s.tea} 杯；没有记录不代表零杯。</small></div></div>`:''}${s.opts.budget?`<div class="row"><div class="info"><strong>限制 · 分类预算</strong><small>10月 · 日常账本 / 奶茶<br>已记支出 ¥${fmt(s.spent)} · 预算 ¥${fmt(s.budget)}</small></div></div>`:''}<p class="sheet-note">体重趋势、执行情况和消费限制分别判断；没有合成减肥完成率，也没有据此作因果判断。</p>`+btn('明白了','close'));}
function apply(){if(s.updated){go(3);return;}const a=reviewAction();s.lastAdjustment={...a};if(a.kind==='measure')s.remindWeight=true;if(a.kind==='recheck')s.reviewCheck=true;if(a.kind==='lighter'){s.nextFreq=Math.max(1,s.freq-1);}if(a.kind==='schedule')s.scheduled=true;s.revision++;s.updated=true;render();toast('示例计划 V'+s.revision+' 已更新，下周生效');}
function handleAction(action,el){switch(action){
 case 'habit-mode':{const mode=el.dataset.mode;s=initial();s.habitMode=mode;s.deferBaseline=mode!=='existing';s.baseline=s.deferBaseline?'':78;s.q=0;go(1);toast('已切换创建情境；计划尚未保存');break;}
 case 'defer-baseline':s.deferBaseline=el.checked;if(s.deferBaseline)s.baseline='';render();break;
 case 'goto':go(Number(el.dataset.step));break;
 case 'reset':s=initial();if($('sheet').open)closeSheet();render();toast('已回到旅程起点');break;
 case 'back':if(s.step===1&&s.q>0){s.q--;render();}else go(s.step-1);break;
 case 'help':openSheet('原型怎么体验？','<p class="sheet-note">这是用户动线提案，不会写入真实 Holo 数据。先顺着底部按钮走，也可以用左侧步骤直接跳转。</p><p class="sheet-note">计划确认后的页面模拟两周后回访。第 4、6 步可以切换三种反馈场景。</p>'+btn('开始体验','close'));break;
 case 'start':if(!s.wish.trim()){toast('先写下一个愿望');break;}s.q=0;go(1);break;
 case 'question-next':if(!validateQuestion())break;if(s.q<2){s.q++;render();$('app').scrollTop=0;}else go(2);break;
 case 'question-back':s.q=Math.max(0,s.q-1);render();break;
 case 'activate':s.activated=true;go(3);toast('示例计划已启用 · 现在看看两周后的回访');break;
 case 'daily':go(4);break;case 'dashboard':go(3);break;case 'review':go(5);break;case 'adjust':s.updated=false;go(6);break;case 'apply':apply();break;case 'keep':go(3);toast('保留现有计划');break;
 case 'tab':s.tab=el.dataset.tab;render();break;
 case 'scenario':s.scenario=el.dataset.scenario;s.exercise=s.scenario==='stalled'?s.freq:2;s.sleep=s.scenario==='stalled'?7:4;s.updated=false;s.todaySleep=false;go(s.step===5||s.step===6?5:3);toast('已切换示例场景');break;
 case 'sleep-details':openSheet('作息的来源与达标规则',sleepEvidence()+btn('明白了','close'));break;
 case 'sources':sources();break;case 'close':closeSheet();break;
 case 'exercise':s.exercise++;render();toast('运动已记录，目标同步读取');break;
 case 'review-check':s.reviewCheckDone=!s.reviewCheckDone;render();toast('方案复核任务状态已更新');break;
 case 'sleep':if(s.sleepSource==='health'){toast('当前读取健康记录，不重复打卡');break;}if(s.sleep>=7&&!s.todaySleep){toast('本周七晚已记录，无需重复打卡');break;}s.todaySleep=!s.todaySleep;s.sleep+=s.todaySleep?1:-1;render();toast(s.todaySleep?'早睡打卡已记录':'已撤销本次打卡');break;
 case 'prep':s.prepDone=!s.prepDone;render();toast(s.prepDone?'准备任务已完成；运动次数不变':'已撤销任务完成');break;
 case 'session':s.sessionsDone??={};s.sessionsDone[el.dataset.index]=!s.sessionsDone[el.dataset.index];render();toast('下周执行已记录一次，按下周统计；不计入本周');break;
 case 'weight':openSheet('记录体重',field('今天的测量 / kg','sheet-weight',weightEmpty()?'':currentWeight(),'number','min="1" max="500" step="0.1"')+'<p class="sheet-note">写入「体重」数值习惯，目标读取这条测量；同日测量取最新值。</p><div class="error" id="sheet-error"></div>'+btn('保存体重记录','save-weight'));break;
 case 'save-weight':{const v=readNumber('sheet-weight',1,500);if(v===null){$('sheet-error').textContent='请填写有效的体重数值。';break;}if(s.deferBaseline){s.baseline=v;s.deferBaseline=false;}s.current=v;s.scenario='normal';s.weightRecorded=true;s.weightNote='10月11日 · 刚刚记录';closeSheet();render();toast('已记录 '+fmt(v)+' kg，结果来源已更新');break;}
 case 'tea':openSheet('记录奶茶杯数',field('今天喝了多少 / 杯','sheet-tea',0,'number','min="0" max="50" step="1"')+'<p class="sheet-note">填 0 表示今天明确没有喝；关闭弹窗则保持未记录。杯数不会修改记账金额。</p><div class="error" id="sheet-error"></div>'+btn('保存今天的记录','save-tea'));break;
 case 'save-tea':{const v=readNumber('sheet-tea',0,50);if(v===null||!Number.isInteger(v)){$('sheet-error').textContent='请填写零或正整数。';break;}s.tea+=v;closeSheet();render();toast(v===0?'已记录今天未喝奶茶；金额不变':'杯数已更新；记账金额不变');break;}
 case 'expense':openSheet('记一笔奶茶消费',field('金额 / 元','sheet-expense',18,'number','min="0.01" step="0.01"')+field('备注','sheet-note','奶茶消费','text')+'<p class="sheet-note">分类：日常账本 / 奶茶。保存后只更新支出金额，不自动记录饮用杯数。</p><div class="error" id="sheet-error"></div>'+btn('保存支出','save-expense'));break;
 case 'save-expense':{const v=readNumber('sheet-expense',.01,100000);if(v===null){$('sheet-error').textContent='请填写有效金额。';break;}s.spent=Math.round((s.spent+v)*100)/100;s.expenseAdded.push({amount:v,note:$('sheet-note').value.trim()||'奶茶消费'});closeSheet();render();toast('已记支出 ¥'+fmt(v)+'；杯数保持不变');break;}
 case 'edit-budget':openSheet('调整奶茶限制',field('每月最多 / 杯','sheet-limit',s.teaLimit,'number','min="0" step="1"')+field('每月预算 / 元','sheet-budget',s.budget,'number','min="1" step="1"')+'<p class="sheet-note">已有预算 ¥150。这里修改计划预览，启用计划时才一起应用。</p><div class="error" id="sheet-error"></div>'+btn('保存到计划预览','save-budget'));break;
 case 'save-budget':{const limit=readNumber('sheet-limit',0),budget=readNumber('sheet-budget',1);if(limit===null||!Number.isInteger(limit)||budget===null){$('sheet-error').textContent='杯数需为零或正整数，金额需大于零。';break;}s.teaLimit=limit;s.budget=budget;closeSheet();render();toast('计划预览已更新');break;}
 case 'edit-goal':s.q=0;go(1);break;
 case 'complete':openSheet('确认目标完成',`<p class="sheet-note">最新测量 ${fmt(currentWeight())} kg 已达到你设定的 ${fmt(s.target)} kg。请确认这是否符合你的成功标准。</p><p class="sheet-note">确认后结束目标；保留习惯、任务、预算及历史记录。</p>`+btn('确认完成目标','save-complete'));break;
 case 'save-complete':s.completed=true;closeSheet();render();toast('示例目标已完成，原始记录保留');break;
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el.dataset.action,el);});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.field||el.dataset.field.startsWith('sheet-'))return;const key=el.dataset.field;s[key]=['target','baseline','freq','teaLimit','budget'].includes(key)?Number(el.value):el.value;});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.option){s.opts[el.dataset.option]=el.checked;render();}else if(el.dataset.field){const key=el.dataset.field;s[key]=['target','baseline','freq','teaLimit','budget'].includes(key)?Number(el.value):el.value;if(key==='blocker'||key==='sleepSource')render();}});
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet')){const rect=$('sheet').getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeSheet();}});
render();
</script>
</body>
</html>
