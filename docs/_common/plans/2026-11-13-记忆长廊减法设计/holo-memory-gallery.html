<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>记忆长廊 · Holo 交互原型</title>
<style>
:root {
  --paper: #fdfcf8; --surface: #fff; --inset: #f7f1ea; --ink: #333; --quiet: #6e6e6e;
  --rule: #e9e4da; --orange: #ea580c; --accent-ink: #a74219; --tint: #fae8dc;
  --desk: #ede8df; --shadow: #39220e26; --screen-edge: #292622; --warning: #93450a;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --serif: "New York", "Songti SC", "Noto Serif CJK SC", "SimSun", Georgia, serif;
  font-family: var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e0e10; --surface: #2c2c2e; --inset: #232324; --ink: #f5f5f5; --quiet: #a8a8a8;
    --rule: #48484a; --orange: #ff8a5c; --accent-ink: #ffab85; --tint: #4a2b22;
    --desk: #201e1b; --shadow: #0006; --screen-edge: #090909; --warning: #ffbe6a;
  }
}
:root[data-theme="dark"] {
  --paper: #0e0e10; --surface: #2c2c2e; --inset: #232324; --ink: #f5f5f5; --quiet: #a8a8a8;
  --rule: #48484a; --orange: #ff8a5c; --accent-ink: #ffab85; --tint: #4a2b22;
  --desk: #201e1b; --shadow: #0006; --screen-edge: #090909; --warning: #ffbe6a;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--desk); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; padding: 0; background: none; min-height: 44px; }
button:disabled { cursor: default; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
h1, h2, h3, p, figure { margin: 0; }
img { display: block; max-width: 100%; }
svg { display: block; flex: none; width: 18px; height: 18px; }
.stage { max-width: 1170px; min-height: 100svh; margin: 0 auto; padding: 36px 64px; display: grid;
  grid-template-columns: minmax(270px, 430px) minmax(310px, 416px); gap: clamp(48px, 8vw, 116px); align-items: center; justify-content: center; }
.review { max-width: 390px; }
.wordmark { display: flex; align-items: center; gap: 10px; font-size: .875rem; font-weight: 650; }
.wordmark strong { font-family: Georgia, serif; font-size: 1.4rem; font-weight: 500; }
.wordmark span { color: var(--quiet); font-size: .8125rem; font-weight: 450; border-left: 1px solid var(--rule); padding-left: 10px; }
.sun { width: 17px; height: 17px; border: 1px solid var(--orange); border-radius: 50%; display: grid; place-items: center; }
.sun::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
.review h1 { font: 750 clamp(3rem, 5.4vw, 4.7rem)/1.07 var(--serif); letter-spacing: -.075em; margin: 38px 0 18px; }
.review .thesis { font-size: 1.06rem; line-height: 1.8; color: var(--quiet); }
.review-actions { margin-top: 36px; border-top: 1px solid var(--rule); }
.scenario { width: 100%; text-align: left; display: grid; grid-template-columns: 25px 1fr auto; align-items: center;
  gap: 12px; border-bottom: 1px solid var(--rule); min-height: 56px; padding: 7px 5px; }
.scenario > svg:last-child { width: 15px; }
.scenario:hover, .scenario[aria-pressed="true"] { color: var(--accent-ink); }
.scenario[aria-pressed="true"] .scenario-title { font-weight: 670; }
.scenario-title { font-size: .9375rem; }
.review-foot { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sample-label { font-size: .8125rem; color: var(--quiet); }
.review-foot select { font-size: .8125rem; min-height: 44px; max-width: 135px; border: 0; background: none; color: var(--quiet); }
.theme { display: flex; align-items: center; gap: 6px; font-size: .8125rem; color: var(--quiet); }
.theme svg { width: 15px; height: 15px; }
.device { position: relative; height: min(850px, calc(100svh - 72px)); min-height: 665px; display: flex; flex-direction: column;
  overflow: hidden; background: var(--paper); border-radius: 43px; border: 8px solid var(--screen-edge);
  box-shadow: 0 28px 64px -26px var(--shadow), 0 3px 9px var(--shadow); isolation: isolate; }
.statusbar { height: 42px; flex: 0 0 42px; display: flex; justify-content: space-between; align-items: end;
  padding: 0 26px 6px; font-size: .8125rem; font-weight: 680; }
.status-symbols { display: flex; gap: 6px; align-items: center; }
.status-symbols svg { width: 16px; height: 15px; }
.camera { position: absolute; width: 102px; height: 27px; background: var(--screen-edge); border-radius: 18px; top: 7px; left: 50%; transform: translateX(-50%); }
.appnav { min-height: 53px; flex: 0 0 auto; display: grid; grid-template-columns: minmax(44px, 1fr) minmax(0, max-content) minmax(max-content, 1fr); align-items: center; border-bottom: 1px solid var(--rule); padding: 4px 12px; }
.appnav h2 { font: 700 1.15rem/1.25 var(--serif); text-align: center; overflow-wrap: anywhere; }
.appnav button, .dialog-head button { display: inline-flex; align-items: center; gap: 6px; }
.back { justify-self: start; width: 44px; justify-content: center; }
.date-action { justify-self: end; padding: 0 5px; color: var(--accent-ink); font-size: .8125rem; white-space: nowrap; }
.date-action svg { width: 16px; height: 16px; }
.scroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.gallery { padding: 0 20px 55px; }
.chapter { padding-top: 24px; }
.chapter + .chapter { padding-top: 34px; }
.month { display: flex; gap: 12px; align-items: baseline; padding: 6px 0 11px; border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 1; background: var(--paper); }
.month h3 { font: 700 2rem/1.2 var(--serif); letter-spacing: -.06em; }
.month .year { font: 400 1.125rem/1 Georgia, serif; color: var(--quiet); }
.day { display: grid; grid-template-columns: 46px minmax(0, 1fr); column-gap: 14px; scroll-margin-top: 16px; }
.day-marker { position: relative; padding-top: 22px; border-right: 1px solid var(--rule); }
.day-marker::after { content: ""; position: absolute; right: -3px; top: 35px; width: 5px; height: 5px; border-radius: 50%; background: var(--quiet); }
.day.today .day-marker::after, .day.is-target .day-marker::after { background: var(--orange); box-shadow: 0 0 0 3px var(--tint); }
.day-number { display: block; font: 400 1.875rem/.98 Georgia, var(--serif); letter-spacing: -.065em; color: var(--ink); }
.day.today .day-number, .day.is-target .day-number { color: var(--accent-ink); }
.day-label { display: block; color: var(--quiet); font-size: .75rem; line-height: 1.35; margin-top: 5px; }
.day-content { padding: 18px 0 14px; min-width: 0; }
.day + .day .day-content { border-top: 1px solid var(--rule); }
.lead, .record { display: block; width: 100%; text-align: left; }
.lead img { width: 100%; height: auto; aspect-ratio: 1.88; object-fit: cover; border-radius: 9px; background: var(--inset); }
.lead-headline { display: block; font: 700 1.25rem/1.48 var(--serif); margin-top: 4px; overflow-wrap: anywhere; }
.lead img + .lead-headline { margin-top: 11px; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; color: var(--quiet); font-size: .75rem; line-height: 1.55; }
.lead .meta { margin-top: 4px; }
.meta svg { width: 13px; height: 13px; }
.lead:hover .lead-headline, .record:hover .record-title { color: var(--accent-ink); }
.record { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 9px; align-items: center; min-height: 54px; padding: 5px 0; }
.record-icon { display: grid; place-items: center; background: var(--inset); width: 30px; height: 30px; border-radius: 9px; color: var(--accent-ink); }
.record-icon svg { width: 15px; height: 15px; }
.record-title { display: block; font-size: .9375rem; line-height: 1.4; font-weight: 560; overflow-wrap: anywhere; }
.record-value { color: var(--ink); font-size: .875rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.record-value svg { color: var(--quiet); width: 14px; height: 14px; }
.extras { display: grid; margin-top: 8px; }
.extras .record { border-top: 1px solid var(--rule); }
.expand { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-ink); font-size: .8125rem; margin-top: 2px; }
.expand svg { width: 14px; height: 14px; }
.expand[aria-expanded="true"] svg { transform: rotate(180deg); }
.chosen-empty { min-height: 88px; padding-top: 8px; font-size: .9375rem; color: var(--quiet); line-height: 1.5; }
.chosen-empty button { display: block; font-size: .8125rem; color: var(--accent-ink); }
.end { text-align: center; padding: 25px 0 4px; color: var(--quiet); font-size: .8125rem; }
.homebar { height: 22px; flex: 0 0 22px; display: grid; place-items: center; border-top: 1px solid color-mix(in srgb, var(--rule), transparent 55%); }
.homebar::before { content: ""; width: 112px; height: 4px; border-radius: 99px; background: var(--ink); }
.recent { position: absolute; right: 16px; bottom: 32px; display: inline-flex; gap: 5px; align-items: center; padding: 0 12px; border-radius: 99px;
  background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 3px 13px var(--shadow); font-size: .8125rem; color: var(--accent-ink); }
.recent svg { width: 14px; height: 14px; }
.state { padding: 52px 4px 0; }
.state > svg { color: var(--accent-ink); width: 29px; height: 29px; margin-bottom: 18px; }
.state h3, .entry h3 { font: 700 1.625rem/1.4 var(--serif); }
.state p, .entry p { font-size: .9375rem; color: var(--quiet); line-height: 1.65; margin-top: 8px; }
.state button, .entry button, .sheet-button { color: var(--accent-ink); padding: 0 14px; border: 1px solid var(--rule); background: var(--inset); border-radius: 12px; margin-top: 17px; font-size: .9375rem; }
.notice { display: flex; gap: 9px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); color: var(--quiet); font-size: .8125rem; }
.notice svg { color: var(--warning); width: 15px; height: 15px; }
.notice button { margin-left: auto; color: var(--accent-ink); flex-shrink: 0; }
.entry { padding: 64px 24px; }
.entry button { display: inline-flex; align-items: center; gap: 10px; }
dialog { position: fixed; inset: auto auto var(--sheet-bottom, 0px) var(--sheet-left, 0px); width: var(--sheet-width, 100%); max-width: none;
  max-height: var(--sheet-height, 93%); margin: 0; padding: 0 20px 30px; border: 0;
  border-radius: 24px 24px var(--clip-radius, 0px) var(--clip-radius, 0px); background: var(--paper); color: var(--ink); box-shadow: 0 -8px 40px var(--shadow); overflow: auto; }
dialog::backdrop { background: #19151060; clip-path: inset(var(--clip-top, 0px) var(--clip-right, 0px) var(--sheet-bottom, 0px) var(--sheet-left, 0px) round var(--clip-radius, 0px)); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 0 9px; border-bottom: 1px solid var(--rule); }
.dialog-head h3 { font: 700 1.25rem/1.4 var(--serif); }
.dialog-head button { color: var(--accent-ink); font-size: .875rem; }
.calendar-controls { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.calendar-controls .step { display: grid; place-items: center; width: 44px; }
.calendar-controls .step:disabled { opacity: .38; }
.month-choice { display: flex; align-items: center; gap: 4px; }
.month-choice button { display: flex; align-items: center; gap: 6px; font: 700 1.0625rem/1.4 var(--serif); }
.month-choice select { min-height: 44px; padding: 0 4px; border: 1px solid var(--rule); border-radius: 8px; background: var(--inset); font-size: .875rem; }
.month-choice svg { width: 13px; height: 13px; }
.weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
.weekdays { color: var(--quiet); font-size: .75rem; padding: 6px 0; }
.days button { display: grid; grid-template-rows: 18px 5px; align-content: center; justify-items: center; gap: 3px;
  min-height: 44px; border-radius: 10px; font-size: .875rem; font-variant-numeric: tabular-nums; }
.days button:disabled { opacity: .35; }
.days button:not(:disabled):hover, .days button[aria-current="date"] { background: var(--inset); }
.days button[data-count]:not([data-count="0"]) { font-weight: 660; }
.days button[data-count]:not([data-count="0"])::after, .key-dot { content: ""; width: 5px; height: 5px; background: var(--orange); border-radius: 50%; }
.calendar-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; color: var(--quiet); font-size: .75rem; }
.calendar-foot span { display: inline-flex; align-items: center; gap: 7px; }
.calendar-foot button { color: var(--accent-ink); font-size: .8125rem; }
.source { padding-top: 16px; }
.source h4 { margin: 6px 0; font: 700 1.375rem/1.45 var(--serif); }
.source p { line-height: 1.7; overflow-wrap: anywhere; }
.source img { width: 100%; border-radius: 12px; margin-top: 13px; }
.source-amount { margin: 7px 0; font: 400 1.9rem/1.2 Georgia, var(--serif); }
.source-note { display: block; margin-top: 15px; color: var(--quiet); font-size: .8125rem; }
.composer textarea { resize: vertical; display: block; width: 100%; min-height: 126px; margin-top: 16px; border: 1px solid var(--rule);
  border-radius: 12px; background: var(--inset); padding: 12px; line-height: 1.65; }
.composer button:disabled { opacity: .45; }
.live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (min-width: 711px) and (max-height: 752px) {
  .stage { padding-top: 22px; padding-bottom: 22px; }
  .device { height: max(650px, calc(100svh - 44px)); min-height: 650px; }
}
@media (max-width: 710px) {
  .stage { display: flex; flex-direction: column; align-items: stretch; padding: 0; gap: 0; min-height: 100svh; }
  .device { order: -1; width: 100%; height: 100svh; min-height: 490px; border: 0; border-radius: 0; box-shadow: none; }
  .statusbar, .homebar, .camera { display: none; }
  .appnav { min-height: calc(54px + env(safe-area-inset-top)); padding-top: calc(4px + env(safe-area-inset-top)); }
  .gallery { max-width: 520px; margin: 0 auto; }
  .review { max-width: 520px; width: 100%; margin: auto; padding: 24px 20px; }
  .review h1, .review .thesis { display: none; }
  .review-actions { margin-top: 14px; }
  .recent { bottom: max(12px, env(safe-area-inset-bottom)); }
}
@media (max-width: 365px) {
  .day { grid-template-columns: 40px minmax(0, 1fr); gap: 11px; }
  dialog { padding-left: 6px; padding-right: 6px; }
}
</style>
</head>
<body>
<main class="stage">
  <aside class="review" aria-label="原型场景">
    <div class="wordmark"><i class="sun" aria-hidden="true"></i><strong>Holo</strong><span>设计原型</span></div>
    <h1>记忆长廊</h1>
    <p class="thesis">沿着日期，回到那一天。</p>
    <div class="review-actions">
      <button class="scenario" type="button" data-mode="normal" aria-pressed="true"><i data-icon="book"></i><span class="scenario-title">浏览长廊</span><i data-icon="arrow-right"></i></button>
      <button class="scenario" type="button" data-mode="date" aria-pressed="false"><i data-icon="calendar"></i><span class="scenario-title">找一个日期</span><i data-icon="arrow-right"></i></button>
      <button class="scenario" type="button" data-mode="sparse" aria-pressed="false"><i data-icon="wallet"></i><span class="scenario-title">只有一笔账</span><i data-icon="arrow-right"></i></button>
      <button class="scenario" type="button" data-mode="empty" aria-pressed="false"><i data-icon="pen"></i><span class="scenario-title">还没有记录</span><i data-icon="arrow-right"></i></button>
    </div>
    <div class="review-foot">
      <span class="sample-label">示例记录与照片</span>
      <select id="status-preview" aria-label="查看加载与错误状态">
        <option value="">加载与错误</option><option value="loading">首次读取</option><option value="syncing">正在同步</option><option value="partial">部分载入失败</option><option value="error">读取失败</option>
      </select>
      <button class="theme" id="theme" type="button" aria-label="切换深色模式" aria-pressed="false"><i data-icon="moon"></i><span>深色</span></button>
    </div>
  </aside>
  <section class="device" aria-label="记忆长廊预览">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><div class="status-symbols"><i data-icon="signal"></i><i data-icon="wifi"></i><i data-icon="battery"></i></div></div>
    <div class="camera" aria-hidden="true"></div>
    <nav class="appnav" aria-label="长廊导航">
      <button class="back" id="back" type="button" aria-label="返回 Holo 首页"><i data-icon="left"></i></button>
      <h2 id="app-title">记忆长廊</h2>
      <button class="date-action" id="open-date" type="button"><i data-icon="calendar"></i>找日期</button>
    </nav>
    <div class="scroll" id="scroll" tabindex="0" aria-label="按日期排列的生活记录">
      <div class="gallery" id="gallery"></div>
      <div class="entry" id="entry" hidden><h3>Holo</h3><button id="enter" type="button"><i data-icon="book"></i>记忆长廊<i data-icon="right"></i></button></div>
    </div>
    <button class="recent" id="recent" type="button" hidden><i data-icon="up"></i>回到最近</button>
    <div class="homebar" aria-hidden="true"></div>
    <div class="live" id="live" aria-live="polite"></div>

    <dialog id="date-sheet" aria-labelledby="date-title">
      <div class="dialog-head"><h3 id="date-title">找日期</h3><button type="button" data-close autofocus>关闭</button></div>
      <div class="calendar-controls">
        <button class="step" id="prev-month" type="button" aria-label="上个月"><i data-icon="left"></i></button>
        <div class="month-choice">
          <button id="month-label" type="button" aria-label="选择年月" aria-expanded="false"></button>
          <div id="month-inputs" hidden>
            <select id="year-choice" aria-label="年份"></select>
            <select id="month-choice" aria-label="月份"></select>
          </div>
        </div>
        <button class="step" id="next-month" type="button" aria-label="下个月"><i data-icon="right"></i></button>
      </div>
      <div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="days" id="days" aria-label="日期"></div>
      <div class="calendar-foot"><span><i class="key-dot" aria-hidden="true"></i>有记录</span><button id="date-recent" type="button">回到最近</button></div>
    </dialog>

    <dialog id="source-sheet" aria-labelledby="source-title">
      <div class="dialog-head"><h3 id="source-title">原记录</h3><button type="button" data-close autofocus>关闭</button></div>
      <div class="source" id="source"></div>
    </dialog>

    <dialog id="compose-sheet" aria-labelledby="compose-title">
      <div class="dialog-head"><h3 id="compose-title">写条想法</h3><button type="button" data-close>关闭</button></div>
      <form class="composer" id="composer">
        <textarea id="thought" aria-label="想法内容" placeholder="此刻想记下什么？" maxlength="320" required autofocus></textarea>
        <button class="sheet-button" id="save" type="submit" disabled>存入原型</button>
      </form>
    </dialog>
  </section>
</main>
<script>
const paths = {
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 15h2m4 0h2"/>',
  wallet: '<path d="M20 8V6a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h13a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3V7m18 6h-5v4h5"/>',
  pen: '<path d="m13 6 5 5M4 20l5-1 11-11a2 2 0 0 0-4-4L5 15Z"/>',
  task: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>',
  habit: '<path d="M20 4c0 9-3 14-9 14a5 5 0 0 1-5-5c0-6 5-9 14-9ZM4 21c3-4 5-6 9-9"/>',
  moon: '<path d="M20.9 13.3A9 9 0 0 1 10.7 3a9 9 0 1 0 10.2 10.3Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  down: '<path d="m6 9 6 6 6-6"/>', up: '<path d="m6 15 6-6 6 6"/>',
  'arrow-right': '<path d="M4 12h15m-6-6 6 6-6 6"/>',
  signal: '<path d="M3 18v-3m5 3v-6m5 6V8m5 10V4" stroke-width="2.5"/>',
  wifi: '<path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4.5 4.5 0 0 1 6 0m-3 3h.01"/>',
  battery: '<rect x="2" y="6" width="18" height="12" rx="3"/><path d="M23 10v4"/><rect x="5" y="9" width="12" height="6" rx="1" fill="currentColor" stroke="none"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>'
};
function icon(name) {

}

function positionSheets() {
  const rect = device.getBoundingClientRect();
  const edge = parseFloat(getComputedStyle(device).borderLeftWidth);
  const inset = {
    '--sheet-bottom': innerHeight - rect.bottom + edge,
    '--sheet-left': rect.left + edge,
    '--sheet-width': rect.width - 2 * edge,
    '--sheet-height': rect.height - 2 * edge - 48,
    '--clip-top': rect.top + edge,
    '--clip-right': innerWidth - rect.right + edge,
    '--clip-radius': edge ? 35 : 0
  };
  for (const [key, value] of Object.entries(inset)) {
    document.documentElement.style.setProperty(key, value + 'px');
  }
}

}
function stateMarkup() {
  if (mode === 'loading') return `<div class="state" role="status">${icon('book')}<h3>正在打开长廊</h3><p>正在读取你的记录。</p></div>`;
  if (mode === 'error') return `<div class="state" role="status">${icon('info')}<h3>暂时无法载入记录</h3><p>可以稍后再试一次。</p><button type="button" data-retry>重试</button></div>`;
  if (mode === 'syncing') return `<div class="notice" role="status">${icon('info')}<span>正在同步，已载入的记录可以继续看</span></div>`;
  if (mode === 'partial') return `<div class="notice" role="status">${icon('info')}<span>想法暂未载入</span><button type="button" data-retry>重试</button></div>`;
  return '';
}
function renderGallery() {
  const state = stateMarkup();
  if (mode === 'loading' || mode === 'error') { gallery.innerHTML = state; return; }
  const keys = Object.keys(records);
  if (!keys.length) {
    gallery.innerHTML = `<div class="state">${icon('book')}<h3>长廊还没有记录</h3><p>写下的想法、账单、打卡和完成的任务，会按日期出现在这里。</p><button type="button" data-compose>写条想法</button></div>`;
    return;
  }
  if (selected && !records[selected]) keys.push(selected);
  const grouped = new Map();
  for (const key of keys.sort().reverse()) {
    const month = key.slice(0, 7);
    if (!grouped.has(month)) grouped.set(month, []);
    grouped.get(month).push(key);
  }
  gallery.innerHTML = state + [...grouped].map(([month, days]) => {
    const [year, number] = month.split('-');
    return `<div class="chapter" data-month="${month}"><div class="month"><h3>${months[Number(number) - 1]}月</h3><span class="year">${year}</span></div>${days.map(dayMarkup).join('')}</div>`;
  }).join('') + (hasIncompleteRecords() || keys.length === 1 ? '' : '<p class="end">已到最早的记录</p>');
}
function renderRecent() {
  const mostRecent = latest();
  element('recent').hidden = isAtEntry || !mostRecent || !(scroll.scrollTop > 330 || (selected && selected !== mostRecent));
}
function showEntry(show) {
  isAtEntry = show;
  gallery.hidden = show;
  element('entry').hidden = !show;
  element('back').style.visibility = show ? 'hidden' : '';
  element('open-date').style.visibility = show || !latest() ? 'hidden' : '';
  element('app-title').textContent = show ? '首页' : '记忆长廊';
  renderRecent();
}
function setMode(next) {
  clearTimeout(retryTimer);
  for (const dialog of document.querySelectorAll('dialog[open]')) dialog.close();
  mode = next === 'date' ? 'normal' : next;
  expanded = null;
  selected = null;
  if (mode === 'sparse' || mode === 'syncing') records = { '2026-11-06': examples['2026-11-06'] };
  else if (mode === 'empty' || mode === 'error' || mode === 'loading') records = {};
  else if (mode === 'partial') {
    records = Object.fromEntries(Object.entries(examples)
      .map(([key, events]) => [key, events.filter(record => record.type !== 'thought')])
      .filter(([, events]) => events.length));
  } else records = examples;
  scenarios.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === next)));
  element('status-preview').value = ['loading', 'error', 'partial', 'syncing'].includes(next) ? next : '';
  showEntry(false);
  element('open-date').disabled = !latest();
  renderGallery();
  scroll.scrollTop = 0;
  renderRecent();
  if (next === 'date') openCalendar();
}
function renderCalendar() {
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const offset = (new Date(year, month, 1).getDay() + 6) % 7;
  const count = new Date(year, month + 1, 0).getDate();
  element('month-label').innerHTML = `${year} 年 ${month + 1} 月 ${icon('down')}`;
  element('year-choice').value = year;
  element('month-choice').innerHTML = Array.from({ length: 12 }, (_, index) =>
    `<option value="${index}" ${year === 2026 && index > 10 ? 'disabled' : ''}>${index + 1} 月</option>`
  ).join('');
  element('month-choice').value = month;
  element('prev-month').disabled = year === 2020 && month === 0;
  element('next-month').disabled = year === 2026 && month === 10;
  element('days').innerHTML = '<span aria-hidden="true"></span>'.repeat(offset) + Array.from({ length: count }, (_, index) => {
    const day = index + 1;
    const key = keyFor(year, month, day);
    const total = records[key]?.length || 0;
    return `<button type="button" data-date="${key}" data-count="${total}" aria-label="${dateText(key)}，${total ? total + ' 条记录' : hasIncompleteRecords() ? '暂无已载入记录' : '无记录'}" ${key > today ? 'disabled' : ''} ${key === today ? 'aria-current="date"' : ''}>${day}</button>`;
  }).join('');
}
function setMonthInputs(show) {
  element('month-inputs').hidden = !show;
  element('month-label').hidden = show;
  element('month-label').setAttribute('aria-expanded', String(show));
}
function openCalendar() {
  const viewportTop = scroll.getBoundingClientRect().top;
  const visibleChapter = [...gallery.querySelectorAll('.chapter')].find(chapter => chapter.getBoundingClientRect().bottom > viewportTop + 40);
  cursor = date(selected || (visibleChapter ? visibleChapter.dataset.month + '-01' : latest() || today));
  setMonthInputs(false);
  renderCalendar();
  openSheet(dateSheet);
}
function goToDay(key) {
  dateSheet.close();
  selected = key;
  expanded = records[key]?.length > 1 ? key : null;
  renderGallery();
  const target = element(`day-${key}`);
  target.focus({ preventScroll: true });
  const headerHeight = target.parentElement.querySelector('.month').offsetHeight;
  const offset = target.getBoundingClientRect().top - scroll.getBoundingClientRect().top;
  scroll.scrollTop += offset - headerHeight;
  announce(`已定位到 ${dateText(key)}`);
  renderRecent();
}
function goRecent() {
  dateSheet.close();
  selected = null;
  expanded = null;
  renderGallery();
  scroll.scrollTop = 0;
  renderRecent();
  element('open-date').focus({ preventScroll: true });
}
function openSource(id) {
  const [key, events] = Object.entries(records).find(([, events]) => events.some(record => record.id === id));
  const record = events.find(item => item.id === id);
  element('source-title').textContent = `${modules[record.type].name}原记录`;
  element('source').innerHTML = `<p class="meta">${dateText(key)} · ${record.time || '当天'}</p><h4>${escape(record.title)}</h4>
    ${record.value ? `<div class="source-amount">${record.value}</div>` : ''}
    ${record.type !== 'thought' || record.body !== record.title ? `<p>${escape(record.body)}</p>` : ''}
    ${record.image ? `<img src="${record.image}" alt="${record.alt}">` : ''}
    <span class="source-note">原型示例记录</span>`;
  openSheet(element('source-sheet'));
}

scenarios.forEach(button => button.addEventListener('click', () => {
  if (matchMedia('(max-width: 710px)').matches) window.scrollTo(0, 0);
  setMode(button.dataset.mode);
}));
element('status-preview').addEventListener('change', event => {
  setMode(event.target.value || 'normal');
  if (matchMedia('(max-width: 710px)').matches) window.scrollTo(0, 0);
});
element('theme').addEventListener('click', event => {
  const button = event.currentTarget;
  const dark = button.getAttribute('aria-pressed') === 'false';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  button.setAttribute('aria-pressed', String(dark));
  button.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
  button.innerHTML = `${icon(dark ? 'sun' : 'moon')}<span>${dark ? '浅色' : '深色'}</span>`;
});
if (matchMedia('(prefers-color-scheme: dark)').matches) {
  const button = element('theme');
  button.setAttribute('aria-pressed', 'true');
  button.setAttribute('aria-label', '切换浅色模式');
  button.innerHTML = `${icon('sun')}<span>浅色</span>`;
}
element('back').addEventListener('click', () => { showEntry(true); scroll.scrollTop = 0; element('enter').focus(); });
element('enter').addEventListener('click', () => { showEntry(false); element('back').focus(); });
element('open-date').addEventListener('click', openCalendar);
element('recent').addEventListener('click', goRecent);
element('date-recent').addEventListener('click', goRecent);
scroll.addEventListener('scroll', renderRecent, { passive: true });
document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => button.closest('dialog').close()));
element('year-choice').innerHTML = Array.from({ length: 7 }, (_, index) => `<option value="${2026 - index}">${2026 - index} 年</option>`).join('');
element('month-label').addEventListener('click', () => { setMonthInputs(true); element('year-choice').focus(); });
element('year-choice').addEventListener('change', event => {
  const year = Number(event.target.value);
  cursor = new Date(year, Math.min(cursor.getMonth(), year === 2026 ? 10 : 11), 1, 12);
  renderCalendar();
});
element('month-choice').addEventListener('change', event => {
  cursor = new Date(cursor.getFullYear(), Number(event.target.value), 1, 12);
  renderCalendar();
  setMonthInputs(false);
  element('month-label').focus();
});
function stepMonth(delta) {
  cursor = new Date(cursor.getFullYear(), cursor.getMonth() + delta, 1, 12);
  renderCalendar();
}
element('prev-month').addEventListener('click', () => stepMonth(-1));
element('next-month').addEventListener('click', () => stepMonth(1));
element('days').addEventListener('click', event => {
  const key = event.target.closest('[data-date]')?.dataset.date;
  if (key) goToDay(key);
});
function setExpanded(button, isExpanded) {
  const key = button.dataset.expand;
  const extras = element(`extras-${key}`);
  const events = records[key];
  const featured = events.find(record => record.image) || events.find(record => record.type === 'thought') || events[0];
  extras.hidden = !isExpanded;
  extras.innerHTML = isExpanded ? events.filter(record => record !== featured).map(record => recordButton(record)).join('') : '';
  button.setAttribute('aria-expanded', String(isExpanded));
  button.querySelector('span').textContent = isExpanded ? '收起当天' : `当天 ${events.length} 条记录`;
}
gallery.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.record) openSource(button.dataset.record);
  if (button.dataset.expand) {
    const key = button.dataset.expand;
    const offset = button.getBoundingClientRect().top;
    if (expanded && expanded !== key) setExpanded(gallery.querySelector(`[data-expand="${expanded}"]`), false);
    expanded = expanded === key ? null : key;
    setExpanded(button, expanded === key);
    scroll.scrollTop += button.getBoundingClientRect().top - offset;
    if (expanded) {
      const firstRecord = element(`extras-${key}`).firstElementChild;
      const overflow = firstRecord.getBoundingClientRect().bottom - scroll.getBoundingClientRect().bottom;
      if (overflow > 0) scroll.scrollTop += overflow + 10;
    }
  }
  if (button.hasAttribute('data-nearby')) {
    const before = Object.keys(records).sort().reverse().find(key => key < selected);
    const after = Object.keys(records).sort().find(key => key > selected);
    const nearest = !before ? after : !after ? before : date(selected) - date(before) <= date(after) - date(selected) ? before : after;
    goToDay(nearest);
  }
  if (button.hasAttribute('data-compose')) openSheet(element('compose-sheet'));
  if (button.hasAttribute('data-retry')) {
    const offset = scroll.scrollTop;
    const previousDay = selected;
    button.disabled = true;
    button.textContent = '正在重试…';
    retryTimer = setTimeout(() => {
      setMode('normal');
      if (previousDay) goToDay(previousDay);
      else scroll.scrollTop = offset;
      announce('记录已载入');
    }, 450);
  }
});
element('thought').addEventListener('input', event => { element('save').disabled = !event.target.value.trim(); });
element('composer').addEventListener('submit', event => {
  event.preventDefault();
  const body = element('thought').value.trim();
  if (!body) return;
  const excerpt = body.split('\n').find(line => line.trim());
  const title = excerpt.length > 42 ? excerpt.slice(0, 42) + '…' : excerpt;
  records = { [today]: [{ id: 'new-thought', type: 'thought', time: '', title, body }] };
  mode = 'normal';
  scenarios.forEach(button => button.setAttribute('aria-pressed', 'false'));
  element('thought').value = '';
  element('save').disabled = true;
  element('compose-sheet').close();
  element('open-date').disabled = false;
  showEntry(false);
  renderGallery();
  gallery.querySelector('[data-record]').focus({ preventScroll: true });
  announce('想法已存入原型');
});
setMode('normal');
</script>
</body>
</html>
