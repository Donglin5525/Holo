<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>随机漫步 · 三种动效对比</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #fdf9f1;
  --desk: #efe6d9;
  --ink: #402c23;
  --subtle: #6b5549;
  --accent: #8b4427;
  --rule: #a8775140;
  --shadow: #56371d21;
  --motion-paper: #f8eee0;
  --motion-ink: #4b3224;
  --motion-accent: #8b4427;
  --motion-edge: #b874504a;
  --motion-duration: 1.45s;
  --serif: "Songti SC", "Noto Serif CJK SC", SimSun, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #28211d; --desk: #1e1916; --ink: #fae9d6; --subtle: #cfb39e; --accent: #ffc297;
    --rule: #e0a77755; --shadow: #0005; --motion-paper: #392b23; --motion-ink: #f9e4cf;
    --motion-accent: #ffc297; --motion-edge: #f6aa7660;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--desk); font-family: var(--sans); }
main { width: min(100% - 32px, 670px); margin: auto; padding: clamp(22px, 5vh, 56px) 0 24px; }
header p { color: var(--subtle); font-size: .875rem; line-height: 1.55; margin: 0; }
header h1 { font: 700 clamp(1.75rem, 6vw, 2.6rem)/1.2 var(--serif); letter-spacing: -.065em; margin: 0 0 6px; }
.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 18px 0 12px; }
button { font: inherit; cursor: pointer; }
.controls button { min-height: 60px; color: var(--ink); text-align: center; padding: 7px 4px;
  border: 1px solid var(--rule); border-radius: 13px; background: var(--paper); }
.controls button strong { display: block; font-size: clamp(.83rem, 3.5vw, 1rem); font-weight: 650; }
.controls button small { display: block; color: var(--subtle); font-size: .72rem; margin-top: 3px; }
.controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.controls button:hover { background: var(--motion-paper); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.preview { min-height: 338px; position: relative; isolation: isolate; overflow: hidden; border: 1px solid var(--rule);
  border-radius: 18px; background: var(--paper); box-shadow: 0 8px 25px var(--shadow); }
.memory { display: grid; gap: 8px; padding: clamp(16px, 4vw, 26px); }
.memory p, .memory h2 { margin: 0; }
.memory time { display: block; color: var(--subtle); font-size: .8rem; }
.memory h2 { font: 700 2.05rem/1.2 var(--serif); letter-spacing: -.07em; }
.memory ul { list-style: none; padding: 0; margin: 2px 0 0; border-top: 1px solid var(--rule); }
.memory li { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 0;
  border-bottom: 1px solid var(--rule); font-size: .875rem; }
.memory li span { flex: none; color: var(--subtle); font-size: .75rem; }
.reading { padding: 10px 12px; border-left: 2px solid var(--accent); margin-top: 2px; background: var(--motion-paper);
  border-radius: 0 9px 9px 0; font: 600 .925rem/1.55 var(--serif); }
.reading b { display: block; color: var(--accent); margin-bottom: 2px; font: 650 .72rem/1.4 var(--sans); }
.time-travel { position: absolute; z-index: 1; inset: 0; overflow: hidden; isolation: isolate;
  background: var(--motion-paper); color: var(--motion-ink); }
.time-travel.is-landing { opacity: 0; transition: opacity .21s ease-out; }
footer { margin-top: 12px; font-size: .8125rem; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; color: var(--subtle); }
footer a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 400px) { main { width: min(100% - 24px, 670px); } }
.motion-scene { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; padding: 16px; }
.motion-label { font-size: .75rem; font-weight: 650; letter-spacing: .07em; color: var(--motion-accent); }
.motion-year { font-size: .8125rem; font-variant-numeric: tabular-nums; color: var(--motion-accent); }
.motion-date { font: 650 clamp(1.9rem, 8vw, 2.7rem)/1.25 var(--serif); letter-spacing: -.07em; white-space: nowrap; }
.motion-excerpt { max-width: 24ch; font: 600 .95rem/1.55 var(--serif); margin: 0 auto; }
.motion-stamp { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.motion-book { width: min(82%, 290px); height: min(70%, 225px); min-height: 160px; position: relative; display: grid; align-items: center;
  perspective: 880px; isolation: isolate; }
.motion-book-page, .motion-book-leaf { position: absolute; inset: 0; border-radius: 10px 18px 18px 10px; }
.motion-book-page { display: grid; align-content: center; gap: 8px; padding: 12px 16px 12px 22px;
  background: linear-gradient(90deg, var(--motion-edge), transparent 10%), var(--paper); border: 1px solid var(--motion-edge);
  box-shadow: 3px 6px 0 -2px var(--motion-paper), 5px 8px 0 -2px var(--motion-edge), 4px 10px 25px var(--shadow); }
.motion-book-page .motion-excerpt { text-align: center; }
.motion-book-leaf { z-index: 1; transform-origin: 3% 50%; transform-style: preserve-3d;
  animation: turn-memory-page var(--motion-duration) cubic-bezier(.42,.02,.24,1) both; }
.motion-book-face { position: absolute; inset: 0; border-radius: inherit; backface-visibility: hidden; display: grid; place-items: center;
  background: linear-gradient(95deg, var(--motion-edge), transparent 16%), repeating-linear-gradient(transparent 0 24px, var(--motion-edge) 25px, transparent 26px), var(--paper);
  border: 1px solid var(--motion-edge); box-shadow: 0 6px 18px var(--shadow); }
.motion-book-face .motion-stamp { background: var(--paper); padding: 12px 15px; border-radius: 8px; }
.motion-book-back { transform: rotateY(180deg); background: linear-gradient(90deg, var(--paper), var(--motion-paper)); }
@keyframes turn-memory-page {
  0%, 12% { transform: rotateY(0deg); opacity: 1; }
  65% { opacity: 1; }
  95%, 100% { transform: rotateY(-168deg); opacity: 0; }
}
.motion-light { background: var(--motion-paper); isolation: isolate; }
.motion-light::before { content: ''; position: absolute; inset: -20%; z-index: -1;
  background: radial-gradient(ellipse at 47% 45%, #ffcf858f, #e99a573b 38%, transparent 70%);
  animation: warm-memory-light var(--motion-duration) ease-out both; }
.motion-light .motion-stamp { position: absolute; inset: 0; justify-content: center; padding: 16px; }
.motion-light .motion-stamp .motion-excerpt { margin-top: 8px; }
.motion-light .motion-stamp::before { content: ''; width: 28px; height: 1px; margin-bottom: 5px; background: var(--motion-accent); opacity: .65; }
.motion-light .motion-stamp:first-child { animation: light-depart var(--motion-duration) ease-in-out both; }
.motion-light .motion-stamp:last-child { animation: light-arrive var(--motion-duration) ease-in-out both; }
@keyframes warm-memory-light { 0% { opacity: .18; transform: translate(-16%, 13%) scale(.74); } 100% { opacity: 1; transform: none; } }
@keyframes light-depart { 0%, 12% { opacity: 1; } 34%, 100% { opacity: 0; } }
@keyframes light-arrive { 0%, 30% { opacity: 0; } 67%, 100% { opacity: 1; } }
.motion-hall { --step-width: 128px; row-gap: 18px; overflow: hidden; }
.motion-hall-window { width: 100%; height: 138px; position: relative; }
.motion-hall-window::before { content: ''; position: absolute; top: 71px; left: -80px; right: -80px; height: 1px; background: var(--motion-edge); }
.motion-hall-window::after { content: ''; position: absolute; z-index: 1; top: 68px; left: calc(50% - 3px); width: 7px; height: 7px;
  border-radius: 50%; background: var(--motion-accent); box-shadow: 0 0 0 4px var(--motion-edge); }
.motion-hall-track { position: absolute; left: calc(50% - var(--step-width) / 2); display: flex;
  animation: cross-memory-hall var(--motion-duration) cubic-bezier(.34,.08,.19,1) both; }
.motion-hall-stop { flex: 0 0 var(--step-width); width: var(--step-width); display: grid; align-content: start; gap: 24px; justify-items: center; padding-top: 9px; }
.motion-hall-stop .motion-date { font-size: 1.35rem; }
.motion-hall-stop .motion-year { margin-top: -4px; }
.motion-hall-stop .motion-stamp { padding: 6px; border: 1px solid var(--motion-edge); border-radius: 11px; background: var(--paper); min-width: 100px; }
.motion-hall-stop.is-destination .motion-stamp { color: var(--motion-accent); box-shadow: 0 3px 15px var(--motion-edge); }
@keyframes cross-memory-hall {
  0%, 12% { transform: translateX(var(--hall-from, 0)); }
  91%, 100% { transform: translateX(var(--hall-to)); }
}
.time-travel.is-gentle .motion-book-leaf { animation-name: light-depart; }
.time-travel.is-gentle .motion-book-page { animation: light-arrive var(--motion-duration) ease both; }
.time-travel.is-gentle .motion-light::before { animation-name: light-arrive; }
.time-travel.is-gentle .motion-hall-track { animation: none; transform: translateX(var(--hall-to)); }
.time-travel.is-gentle .motion-hall-stop.is-destination { animation: light-arrive var(--motion-duration) ease both; }

</style>
</head>
<body>
<main>
  <header><h1>随机漫步 · 动效对比</h1><p>从 11 月 13 日回到 5 月 21 日。点任意一款播放，再点一次重播。</p></header>
  <div class="controls" role="group" aria-label="选择并播放动效">
    <button type="button" data-motion="paper" aria-pressed="false"><strong>翻开旧页</strong><small>纸页翻转</small></button>
    <button type="button" data-motion="light" aria-pressed="false"><strong>一束暖光</strong><small>光晕渐亮</small></button>
    <button type="button" data-motion="hall" aria-pressed="false"><strong>沿廊漫步</strong><small>日期滑行</small></button>
  </div>
  <section class="preview" aria-label="随机漫步预览">
    <article class="memory">
      <time datetime="2026-05-21">2026 年 · 周四</time>
      <h2>5 月 21 日</h2>
      <ul>
        <li>营养土 <span>¥16.00</span></li>
        <li>给窗台的薄荷换盆 <span>已完成</span></li>
        <li>薄荷换盆后，闻起来满手都是薄荷味。 <span>想法</span></li>
      </ul>
      <div class="reading"><b>回看一句</b>从买土到换盆，那天留下来的细节是洗完手仍闻得到的薄荷味。</div>
    </article>
    <div class="time-travel" aria-hidden="true" hidden></div>
  </section>
  <footer><span>示例记录</span><a href="holo-memory-gallery-random-walk.html">打开完整长廊原型</a></footer>
</main>
<script>
const today = '2026-11-13';
const destination = '2026-05-21';
const memoryLine = '薄荷换盆后，闻起来满手都是薄荷味。';
const date = key => new Date(key + 'T12:00:00');
const dateText = key => (date(key).getMonth() + 1) + ' 月 ' + date(key).getDate() + ' 日';
const escape = value => value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
function motionStamp(key, label, excerpt = '') {
  return `<div class="motion-stamp">
    ${label ? `<span class="motion-label">${label}</span>` : ''}
    <span class="motion-year">${date(key).getFullYear()} 年</span>
    <span class="motion-date">${dateText(key)}</span>
    ${excerpt ? `<p class="motion-excerpt">${escape(excerpt)}</p>` : ''}
  </div>`;
}

function motionMarkup(walkMotion, from, key) {
  const departure = motionStamp(from, from === today ? '今天' : '出发');
  const excerpt = memoryLine;
  if (walkMotion === 'paper') {
    return `<div class="motion-scene">
      <div class="motion-book">
        <div class="motion-book-page">${motionStamp(key, '翻到这一页', excerpt)}</div>
        <div class="motion-book-leaf"><div class="motion-book-face">${departure}</div><div class="motion-book-face motion-book-back"></div></div>
      </div>
    </div>`;
  }
  if (walkMotion === 'light') {
    return `<div class="motion-scene motion-light">${departure}${motionStamp(key, '想起那一天', excerpt)}</div>`;
  }
  const dayLength = 86400000;
  const firstDay = Date.parse(from);
  const span = Math.round((Date.parse(key) - firstDay) / dayLength);
  const steps = Math.min(4, Math.abs(span));
  const offsets = Array.from({ length: steps + 1 }, (_, index) => Math.round(span * index / steps));
  if (span > 0) offsets.reverse();
  const startIndex = offsets.indexOf(0);
  const endIndex = offsets.indexOf(span);
  const stops = offsets.map((offset, index) => {
    const stop = new Date(firstDay + offset * dayLength).toISOString().slice(0, 10);
    return `<div class="motion-hall-stop${index === endIndex ? ' is-destination' : ''}">${motionStamp(stop, '')}</div>`;
  }).join('');
  return `<div class="motion-scene motion-hall">
    <span class="motion-label">${span < 0 ? '沿长廊往回走' : '沿长廊往前走'}</span>
    <div class="motion-hall-window"><div class="motion-hall-track" style="--hall-from:${-128 * startIndex}px;--hall-to:${-128 * endIndex}px">${stops}</div></div>
  </div>`;
}


const preview = document.querySelector('.time-travel');
const buttons = [...document.querySelectorAll('[data-motion]')];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let timer;
let finishTimer;
for (const button of buttons) {
  button.addEventListener('click', () => {
    clearTimeout(timer);
    clearTimeout(finishTimer);
    const gentle = reduceMotion.matches;
    const duration = gentle ? 850 : 1450;
    for (const item of buttons) item.setAttribute('aria-pressed', String(item === button));
    preview.style.setProperty('--motion-duration', duration + 'ms');
    preview.classList.remove('is-landing');
    preview.classList.toggle('is-gentle', gentle);
    preview.innerHTML = motionMarkup(button.dataset.motion, today, destination);
    preview.hidden = false;
    timer = setTimeout(() => {
      preview.classList.add('is-landing');
      finishTimer = setTimeout(() => { preview.hidden = true; }, 220);
    }, duration);
  });
}
</script>
</body>
</html>
