<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"
  <!-- ══════════ 素三 · 留白 ══════════
       最素的一版：球几乎融入背景，只余右上一点晨光橙晕；炭灰细线与文字，品牌橙只在一枚小点。
  -->
  <defs>
    <radialGradient id="mist" cx="0.42" cy="0.36" r="0.92">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="62%" stop-color="#FAF4EB"/>
      <stop offset="100%" stop-color="#F2E7D8"/>
    </radialGradient>
    <radialGradient id="dawn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(244,109,56,.26)"/>
      <stop offset="100%" stop-color="rgba(244,109,56,0)"/>
    </radialGradient>
    <path id="arcSu3" d="M 49.7 151.2 A 72 72 0 0 0 142.3 151.2" fill="none"/>
  </defs>
  <style>
    .s1 { animation: rot 46s linear infinite; transform-origin: 96px 96px; }
    .s2 { animation: rot 34s linear infinite reverse; transform-origin: 96px 96px; }
    .s3 { animation: rot 26s linear infinite; transform-origin: 96px 96px; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .dot { animation: breathe 3.2s ease-in-out infinite; transform-origin: 96px 96px; }
    @keyframes breathe { 0%,100% { opacity: .6; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.04); } }
  </style>

  <!-- 球：近乎消失的米白，靠极轻的边缘收暗确认轮廓 -->
  <circle cx="96" cy="96" r="88" fill="url(#mist)"/>
  <circle cx="96" cy="96" r="88" fill="none" stroke="rgba(90,78,64,.10)" stroke-width="1"/>
  <!-- 晨光：右上一点橙晕渐入，像光从页面外照进来 -->
  <circle cx="128" cy="52" r="40" fill="url(#dawn)"/>

  <!-- 三环：炭灰细线 -->
  <g class="s1">
    <circle cx="96" cy="96" r="52" fill="none" stroke="rgba(74,64,54,.12)" stroke-width="2"/>
    <circle cx="96" cy="96" r="52" fill="none" stroke="rgba(74,64,54,.42)" stroke-width="2"
            stroke-linecap="round" stroke-dasharray="202.6 326.7" transform="rotate(-90 96 96)"/>
  </g>
  <g class="s2">
    <circle cx="96" cy="96" r="37.5" fill="none" stroke="rgba(74,64,54,.10)" stroke-width="1.6"/>
    <circle cx="96" cy="96" r="37.5" fill="none" stroke="rgba(74,64,54,.34)" stroke-width="1.6"
            stroke-linecap="round" stroke-dasharray="105.8 235.6" transform="rotate(-90 96 96)"/>
  </g>
  <g class="s3">
    <circle cx="96" cy="96" r="24.5" fill="none" stroke="rgba(74,64,54,.08)" stroke-width="1.3"/>
    <circle cx="96" cy="96" r="24.5" fill="none" stroke="rgba(74,64,54,.26)" stroke-width="1.3"
            stroke-linecap="round" stroke-dasharray="123.2 154" transform="rotate(-90 96 96)"/>
  </g>

  <!-- 唯一的品牌橙：中心一小点 -->
  <circle class="dot" cx="96" cy="96" r="5.5" fill="#F46D38"/>
  <circle class="dot" cx="96" cy="96" r="9" fill="none" stroke="rgba(244,109,56,.30)" stroke-width="1"/>

  <!-- 铭文：炭灰 -->
  <text font-size="10.5" fill="rgba(84,72,60,.85)" letter-spacing="3"
        font-family="PingFang SC, sans-serif" font-weight="400">
    <textPath href="#arcSu3" startOffset="50%" text-anchor="middle">今天有3项安排</textPath>
  </text>
</svg>
