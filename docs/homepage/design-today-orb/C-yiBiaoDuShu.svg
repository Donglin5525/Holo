<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"
<style>
  .spin1 { animation: rot 46s linear infinite; transform-origin: 96px 96px; }
  .spin2 { animation: rot 34s linear infinite reverse; transform-origin: 96px 96px; }
  .spin3 { animation: rot 26s linear infinite; transform-origin: 96px 96px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 96px 96px; }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
</style>

          <defs>
            <linearGradient id="ballC" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FED7AA"/>
              <stop offset="52%" stop-color="#F46D38"/>
              <stop offset="100%" stop-color="#EA580C"/>
            </linearGradient>
            <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,255,255,.75)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
          </defs>
          <circle cx="96" cy="96" r="88" fill="url(#ballC)"/>
          <ellipse cx="74" cy="52" rx="46" ry="30" fill="rgba(255,255,255,.30)"/>
          <g class="spin1">
            <circle cx="96" cy="96" r="52" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6.5"/>
            <circle cx="96" cy="96" r="52" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="6.5"
                    stroke-linecap="round" stroke-dasharray="202.6 326.7" transform="rotate(-90 96 96)"/>
            <circle cx="96" cy="44" r="4.6" fill="#fff"/>
          </g>
          <g class="spin2">
            <circle cx="96" cy="96" r="37.5" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="5"/>
            <circle cx="96" cy="96" r="37.5" fill="none" stroke="rgba(255,255,255,.62)" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="105.8 235.6" transform="rotate(-90 96 96)"/>
            <circle cx="96" cy="58.5" r="3.6" fill="rgba(255,255,255,.75)"/>
          </g>
          <g class="spin3">
            <circle cx="96" cy="96" r="24.5" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/>
            <circle cx="96" cy="96" r="24.5" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="4"
                    stroke-linecap="round" stroke-dasharray="123.2 154" transform="rotate(-90 96 96)"/>
          </g>
          <!-- ★ 仪表读数：中心光晕化作数字的底光，整句话浓缩成一个安静的读数 -->
          <circle class="pulse" cx="96" cy="96" r="26" fill="url(#glowC)"/>
          <text x="96" y="99" text-anchor="middle" font-size="22" font-weight="700"
                fill="#fff" font-family="SF Pro Rounded, DIN Alternate, PingFang SC, sans-serif">3</text>
          <text x="96" y="112" text-anchor="middle" font-size="7.5" letter-spacing="2"
                fill="rgba(255,255,255,.72)" font-family="PingFang SC, sans-serif">项安排</text>
        
</svg>