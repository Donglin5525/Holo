function shell(title,body){return `<div class="sheet-inner"><div class="sheet-grab"></div><div class="sheet-header">${state.sheetStack.length?`<button class="icon-button" data-action="sheetBack" aria-label="返回上一层">${icon('back')}</button>`:''}<h2 id="sheetTitle">${title}</h2><button class="icon-button" data-action="closeSheet" aria-label="关闭">${icon('close')}</button></div>${state.pending?'<div class="sheet-undo"><span>正在确认完成 · 三秒内可撤回</span><button data-action="undoCompletion">撤回</button></div>':''}<div class="sheet-scroll">${body}</div></div>`}
function actionButton(action,id,text,symbol){return `<button class="quick-action" data-action="${action}" data-id="${esc(id)}">${icon(symbol)}${text}${icon('right','chevron')}</button>`}
function draftControls(s,allowUnknown=true){return `<label class="form-label">这件事对你重要吗？</label><div class="choice-grid"><button class="choice-button ${s.importance==='important'?'selected':''}" data-action="draftImportance" data-value="important" type="button">重要<small>值得投入时间和精力</small></button><button class="choice-button ${s.importance==='notImportant'?'selected':''}" data-action="draftImportance" data-value="notImportant" type="button">不重要<small>影响较小，可简化处理</small></button></div>${allowUnknown?`<button class="text-button" data-action="draftImportance" data-value="unknown" type="button">${s.importance==='unknown'?'✓ ':''}暂时还没判断</button>`:''}<label class="form-label">紧急程度</label><div class="segmented-choice">${[['auto','按截止日期'],['urgent','紧急'],['notUrgent','不紧急']].map(([v,t])=>`<button type="button" class="${s.urgencyMode===v?'selected':''}" data-action="draftUrgency" data-value="${v}">${t}</button>`).join('')}</div><p class="stat-footnote">${s.urgencyMode==='auto'?'按日期判断：已逾期、今天至后天到期视为紧急；无截止日期暂视为不紧急。':'手动指定：紧急程度不会随截止日期自动变化。'}</p>`}

function placementMarkup(s){const q=quadrantOf(addDraftTask(s)),info=quadrants.find(x=>x.id===q);return `${q==='unknown'?'<span class="placement-grid" aria-hidden="true">?</span>':`<span class="placement-grid" aria-hidden="true">${quadrants.map(x=>`<span class="${x.id===q?'active':''}"></span>`).join('')}</span>`}<div class="placement-copy"><div class="placement-label">将进入</div><div class="placement-line"><strong>${info?.title||'待整理'}</strong><span>${info?.type||'先记下来，之后判断轻重'}</span></div></div>`}
function urgencyExplanation(s){if(s.urgencyMode==='urgent')return '已手动指定为紧急，修改截止日期不会改变这个判断。';if(s.urgencyMode==='notUrgent')return '已手动指定为不紧急，修改截止日期不会改变这个判断。';const t=addDraftTask(s);if(t.dueDate==null)return '未设截止日期，目前按不紧急判断；你也可以手动指定。';return `${shortDate(t.dueDate)}到期，${urgent(t)?'按日期判断为紧急':'按日期判断为不紧急'}。`}
function captureAddDraft(){const s=state.sheet,f=$('#addForm');if(s?.type!=='add'||!f)return;s.draftTitle=f.elements.title.value;s.draftDue=f.elements.due.value;s.draftDesc=f.elements.desc.value;s.listId=f.elements.list.value||null;s.extrasOpen=$('#addExtra').open}

function openAdd(){const q=state.page==='tasks'&&quadrants.some(x=>x.id===state.quadrant)?state.quadrant:null;openSheet({type:'add',quadrant:q,listId:state.scope.startsWith('list:')?state.scope.slice(5):null,importance:q?(['q1','q2'].includes(q)?'important':'notImportant'):'unknown',urgencyMode:q?(['q1','q3'].includes(q)?'urgent':'notUrgent'):'auto',draftTitle:'',draftDue:'',draftDesc:'',extrasOpen:false})}

 else if(s.type==='detail'&&t){title='任务详情';const q=quadrants.find(q=>q.id===quadrantOf(t));body=`<h3 class="detail-title">${esc(t.title)}</h3>${t.desc?`<p class="detail-description">${esc(t.desc)}</p>`:''}${taskProperty('classify',t,'轻重缓急',`${q?.title||'待整理'}<br><small>${t.urgencyMode==='auto'?'按日期判断':'手动指定'}</small>`,'flag')}${taskProperty('due',t,'截止日期',esc(dueText(t)),'clock')}${taskProperty('schedule',t,'执行时段',t.plannedStart?`${shortDate(t.plannedStart)} ${timeText(t.plannedStart)}—${timeText(t.plannedEnd)}`:'留出一段时间','calendar')}${taskProperty('moveList',t,'所属清单',esc(listFor(t.listId).name),'folder')}${taskProperty('joinToday',t,'今日安排',t.today?'已加入 · 点击移出':'加入今天要推进的事','plus')}${t.subtasks.length?`<section class="detail-subsection"><h3>检查清单 · ${t.subtasks.filter(x=>x.done).length}/${t.subtasks.length}</h3>${t.subtasks.map(x=>`<div class="checklist-item">${icon(x.done?'check':'circle')}${esc(x.title)}</div>`).join('')}</section>`:''}${t.attachments.length?`<section class="detail-subsection"><h3>附件</h3>${t.attachments.map(name=>`<div class="attachment">${icon('file')}${esc(name)}<span style="margin-left:auto;font-size:11px">示例</span></div>`).join('')}</section>`:''}${t.legacyPriority&&t.importance==='unknown'?`<p class="stat-footnote">原优先级：${t.legacyPriority}。重要性尚需你判断。</p>`:''}<div class="sheet-actions"><button class="secondary-button" data-action="archiveTask" data-id="${esc(t.id)}">${t.archived?'恢复到待办':'归档'}</button><button class="primary-button" data-action="complete" data-id="${esc(t.id)}">${t.completed?'恢复未完成':'完成任务'}</button></div><p class="stat-footnote">${t.completedAt?'完成于 '+shortDate(t.completedAt,true)+' '+timeText(t.completedAt):'完成后有三秒撤回时间。'}</p>`}
 else if(s.type==='classify'&&t){title='调整轻重缓急';body=`<p class="sheet-lead">${esc(t.title)} · ${esc(dueText(t))}</p>${draftControls(s)}<div class="sheet-actions"><button class="primary-button" data-action="saveClassification">保存分类</button></div>`}
 else if(s.type==='triage'){title='整理轻重缓急';const task=findTask(s.queue[s.index]);if(!task){closeSheet();return}body=`<p class="triage-progress">${s.index+1} / ${s.queue.length} · 一次判断一件事</p><h3 class="triage-task">${esc(task.title)}</h3><p class="sheet-lead">${esc(dueText(task))} · ${esc(listFor(task.listId).name)}</p>${draftControls(s,false)}<div class="sheet-actions"><button class="secondary-button" data-action="triageSkip">先跳过</button><button class="primary-button" data-action="triageSave">${s.index===s.queue.length-1?'保存并结束':'保存，看下一件'}</button></div><p id="formError" class="form-error" role="alert"></p>`}
 else if(s.type==='add'){title='添加任务';const q=quadrantOf(addDraftTask(s));body=`<form id="addForm"><div class="add-fields"><label for="newTitle" class="form-label" style="margin-top:0">想做什么？</label><input class="form-input title-input" id="newTitle" name="title" placeholder="写下一件想做的事" value="${esc(s.draftTitle)}" required maxlength="160" autocomplete="off">${s.quadrant?`<p class="add-context">来自「${quadrants.find(x=>x.id===s.quadrant).title}」· 已预填分类，可自由调整</p>`:''}<label class="form-label" id="importanceLabel">重要性</label><div class="add-selection" role="group" aria-labelledby="importanceLabel">${[['important','重要'],['notImportant','不重要'],['unknown','暂未判断']].map(([v,label])=>`<button type="button" class="add-choice ${s.importance===v?'selected':''}" data-action="draftImportance" data-value="${v}" aria-pressed="${s.importance===v}">${label}</button>`).join('')}</div><label class="form-label" id="urgencyLabel">紧急程度</label><div class="add-selection" role="group" aria-labelledby="urgencyLabel">${[['auto','按截止日期'],['urgent','紧急'],['notUrgent','不紧急']].map(([v,label])=>`<button type="button" class="add-choice ${s.urgencyMode===v?'selected':''}" data-action="draftUrgency" data-value="${v}" aria-pressed="${s.urgencyMode===v}">${label}</button>`).join('')}</div><p class="add-help" id="newUrgencyHint">${urgencyExplanation(s)}</p><div class="add-date-heading"><label for="newDue" class="form-label">截止日期（可选）</label><button type="button" class="text-button" data-action="clearNewDue" id="clearNewDue" ${s.draftDue?'':'hidden'}>清除日期</button></div><input class="form-input" type="date" id="newDue" name="due" value="${s.draftDue}"><details class="add-extra" id="addExtra" ${s.extrasOpen?'open':''}><summary>清单与描述<span>${esc(listFor(s.listId).name)}</span>${icon('down')}</summary><label class="form-label" for="newList">清单</label><select class="form-input" id="newList" name="list"><option value="">收件箱</option>${lists.map(l=>`<option value="${l.id}" ${s.listId===l.id?'selected':''}>${l.name}</option>`).join('')}</select><label for="newDesc" class="form-label">描述</label><textarea class="form-input" id="newDesc" name="desc" placeholder="完成标准，或需要注意的事">${esc(s.draftDesc)}</textarea></details></div><div class="add-footer"><div class="add-result ${q}" id="newPlacement" role="status" aria-live="polite">${placementMarkup(s)}</div><button type="submit" class="primary-button">添加任务</button><p id="formError" class="form-error" role="alert"></p></div></form>`}

 else if(s.type==='due'&&t){title='修改截止日期';body=`<p class="sheet-lead">${esc(t.title)}</p><form id="dueForm"><label class="form-label" for="dueDate">截止日期</label><input class="form-input" type="date" name="date" id="dueDate" value="${t.dueDate==null?'':key(t.dueDate)}"><label class="checkbox-label"><input type="checkbox" name="allDay" id="allDay" ${t.isAllDay?'checked':''}>全天截止</label><div id="dueTimeWrap" ${t.isAllDay?'hidden':''}><label class="form-label" for="dueTime">具体时间</label><input class="form-input" type="time" name="time" id="dueTime" value="${t.dueDate==null?'18:00':timeText(t.dueDate)}"></div><p class="stat-footnote">全天任务到当天结束才算逾期。清空日期可取消截止；分类按日期判断时会同步更新。</p><div class="sheet-actions"><button class="primary-button" type="submit">保存截止日期</button></div><p id="formError" class="form-error" role="alert"></p></form>`}
 else if(s.type==='schedule'&&t){title='给这件事留出时间';body=`<p class="sheet-lead">${esc(t.title)}</p><form id="scheduleForm"><label class="form-label" for="scheduleDate">安排在哪天？</label><input class="form-input" type="date" name="date" id="scheduleDate" value="${key(t.plannedStart??NOW)}" required><div class="form-row"><div><label class="form-label" for="scheduleStart">开始时间</label><input class="form-input" type="time" id="scheduleStart" name="start" value="${timeText(t.plannedStart??at(key(NOW),16))}" required></div><div><label class="form-label" for="scheduleEnd">结束时间</label><input class="form-input" type="time" id="scheduleEnd" name="end" value="${timeText(t.plannedEnd??at(key(NOW),17))}" required></div></div><p class="stat-footnote">执行时段用于安排投入时间，截止日期单独设置。</p><div class="sheet-actions"><button class="primary-button" type="submit">保存执行时段</button></div>${t.plannedStart?`<button class="text-button" type="button" data-action="clearSchedule" data-id="${esc(t.id)}">取消这个时段</button>`:''}<p id="formError" class="form-error" role="alert"></p></form>`}
 else if(s.type==='moveList'&&t){title='放进哪个清单';body=[listFor(null),...lists].map(l=>`<button class="scope-option" data-action="setList" data-list="${l.id??'inbox'}" data-id="${esc(t.id)}">${icon('folder')}${l.name}<span class="option-count"></span>${selectMark(l.id===t.listId)}</button>`).join('')}

 else if(s.type==='search'){title='搜索任务';body=`<label class="form-label" for="searchInput" style="margin-top:0">任务名称、描述或清单</label><input id="searchInput" class="form-input" type="search" placeholder="输入关键词" value="${esc(s.term||'')}" autocomplete="off"><div id="searchResults">${searchResults(s.term||'')}</div>`}

 else if(s.type==='demoSettings'){title='原型预览设置';body=`<div class="sheet-settings"><div class="demo-control"><label for="mobileTheme">外观</label><select id="mobileTheme" class="form-input" data-control="theme"><option value="light">浅色 · 暖白</option><option value="dark">深色 · 暖灰</option></select></div><div class="demo-control"><label for="mobileFont">文字大小</label><select id="mobileFont" class="form-input" data-control="font"><option value="normal">标准字号</option><option value="large">大字号</option></select></div><div class="demo-control"><label for="mobileState">页面状态</label><select id="mobileState" class="form-input" data-control="scenario"><option value="ready">有任务</option><option value="empty">无数据</option><option value="loading">加载中</option><option value="error">加载失败</option></select></div><p class="stat-footnote">仅操作示例数据，演示日期为2026年10月6日15:30。刷新页面恢复初始状态。</p><button class="secondary-button" data-action="reset">恢复初始演示数据</button></div>`}

}

function showToast(message,undo=false){clearTimeout(state.toastTimer);const el=$('#toast');el.innerHTML=`<span>${esc(message)}</span>${undo?'<button data-action="undoCompletion">撤回</button>':''}`;el.hidden=false;if(!undo)state.toastTimer=setTimeout(()=>el.hidden=true,3000)}
function commitPending(){const p=state.pending;if(!p)return;clearTimeout(p.timer);const t=findTask(p.id);if(t){t.completed=true;t.completedAt=NOW}state.pending=null;$('#toast').hidden=true;render();if(state.sheet)renderSheet()}

 page:b=>goPage(b.dataset.page),closeSheet:()=>closeSheet(),sheetBack:()=>backSheet(),scope:()=>openSheet({type:'scope'}),setScope:b=>{state.scope=b.dataset.scope;state.quadrant=null;state.expanded.clear();closeSheet();render();$('#screen').scrollTop=0},allScope:()=>{state.scope='all';state.quadrant=null;render()},quadrant:b=>{state.quadrant=state.quadrant===b.dataset.q?null:b.dataset.q;render();$('#screen').scrollTop=0},allQuadrants:()=>{state.quadrant=null;render();$('#screen').scrollTop=0},expand:b=>{state.expanded.has(b.dataset.q)?state.expanded.delete(b.dataset.q):state.expanded.add(b.dataset.q);const top=$('#screen').scrollTop;render();$('#screen').scrollTop=top},detail:b=>openSheet({type:'detail',id:b.dataset.id},!!state.sheet),taskMenu:b=>openSheet({type:'taskMenu',id:b.dataset.id},!!state.sheet),complete:b=>toggleComplete(b.dataset.id),undoCompletion:()=>undoCompletion(),triage:()=>{state.page='tasks';render();startTriage()},draftImportance:b=>{state.sheet.importance=b.dataset.value;if(state.sheet.type==='add')updateAddFeedback();else renderSheet()},draftUrgency:b=>{state.sheet.urgencyMode=b.dataset.value;if(state.sheet.type==='add')updateAddFeedback();else renderSheet()},clearNewDue:()=>{$('#newDue').value='';captureAddDraft();updateAddFeedback()},saveClassification:()=>{const s=state.sheet,t=findTask(s.id);t.importance=s.importance;t.urgencyMode=s.urgencyMode;render();backSheet();showToast('已调整轻重缓急')},triageSave:()=>{const s=state.sheet;if(s.importance==='unknown'){errorMessage('先判断这件事是否重要，或选择“先跳过”。');return}const t=findTask(s.queue[s.index]);t.importance=s.importance;t.urgencyMode=s.urgencyMode;render();nextTriage()},triageSkip:()=>nextTriage(),classify:b=>{const t=findTask(b.dataset.id);openSheet({type:'classify',id:t.id,importance:t.importance,urgencyMode:t.urgencyMode},true)},due:b=>openSheet({type:'due',id:b.dataset.id},true),schedule:b=>openSheet({type:'schedule',id:b.dataset.id},true),moveList:b=>openSheet({type:'moveList',id:b.dataset.id},true),se document.addEventListener('change',event=>{const el=event.target;if(el.dataset.control){state[el.dataset.control]=el.value;render();if(state.sheet?.type==='demoSettings')renderSheet()}if(state.sheet?.type==='add'&&el.closest('#addForm')){captureAddDraft();updateAddFeedback();if(el.id==='newList')$('#addExtra summary span').textContent=listFor(state.sheet.listId).name}if(el.id==='allDay')$('#dueTimeWrap').hidden=el.checked;if(el.id==='reminderToggle')state.reminders=el.checked});
document.addEventListener('input',event=>{if(state.sheet?.type==='add'&&event.target.closest('#addForm')){captureAddDraft();if(event.target.id==='newDue')updateAddFeedback()}if(event.target.id==='searchInput'){state.sheet.term=event.target.value;$('#searchResults').innerHTML=searchResults(event.target.value)}});
