    const state = {scenario:'today',stack:['home'],completed:false,pending:false,pendingTimer:null,receiptTimer:null,checklist:[true,false,false],autoCompletionStep:null,returnBridge:false};
    const routes = {
      today:[['首页','中央「今天」入口'],['今天','C · 聚光焦点卡'],['任务详情','现有 sheet 入口'],['完成后回到今天','B 归档反馈，C 切下一件事']],
      tasks:[['首页','五角形「任务」入口'],['任务列表','卡片直接展示子任务'],['任务详情','完整子任务与 B 归档'],['完成后回到任务','B · 留下文字记录']],
      matter:[['首页 → 今天','中央「今天」入口'],['进行中的事','Today 内现有入口'],['事项详情','D · 真实变化拼贴'],['关联任务','现有深链进入任务详情'],['完成后回到事项','建议新增返回来源入口']]
    };
    const info = {
      home:{title:'首页：入口保留原位',tags:[['现有入口',true],['球体视觉提案',false]],body:'iPhone 仍从「今天 / 对话 / 我的」承载首页。中央球体继续打开 Today；五角形的任务入口继续打开任务模块。演示稿让球体不再承担三环进度展示，把当天发生什么交给 Today 页面。',points:['中央球体 → Today，仍是全屏展开层。','五角形「任务」→ 任务模块，默认进入今日任务。','iPad 对应侧边栏「今天 / 任务」，交互内容可复用。']},
      today:{title:'Today：C 成为焦点卡',tags:[['现有页面入口',true],['C 视觉提案',false]],body:'Today 的顶部焦点使用聚光语言，显示眼前要做的一件事，并露出下一条真实子任务；下方仍保留「进行中的事」「今天的安排」「保持状态」「今日概况」。聚光是卡片层级，不增加必须经过的新页面。',points:['点「查看任务」走现有任务详情 sheet。','点事项卡进入 Matter 详情；「全部」进入 Matter 列表。','任务完成后卡片换成下一件有依据的行动。']},
      taskList:{title:'任务：卡片里直接看到步骤',tags:[['子任务平铺现有',true],['B 完成反馈提案',false]],body:'当前 iOS 任务卡已经能平铺子任务，最多先展示五项；这里保留这种直接可见、可勾选的方式，移去迷你进度条。完成主任务时，卡片收成一条写有真实标题的记录。',points:['卡片内直接勾选子任务，点任务标题才进入详情。','最后一条子任务完成时，沿现有联动规则完成主任务。','从 Matter 深链过来时，建议显式提供「返回事项」出口。']},
      taskDetail:{title:'任务详情：完整子任务留在眼前',tags:[['子任务已内嵌现有',true],['简洁呈现提案',false],['完成与撤回提案',false]],body:'当前 iOS 任务详情本来就内嵌完整子任务。新版原型直接把它们放在标题与信息下方，可在原位勾选和撤回，不再跳到单独页面，也不重复展示进度条。完成后的 B 反馈和 3 秒撤回仍是待统一的交互提案。',points:['Today 进入 → 关闭后回 Today。','任务列表进入 → 关闭后回任务列表。','Matter 进入 → 经任务模块；返回事项需新接来源上下文。']},
      matterList:{title:'进行中的事：稳定列表入口',tags:[['现有页面',true]],body:'Today 中的「全部进行中的事」进入列表，按正在进行、已完成、已归档查看。它仍是查找事项的清晰入口，D 拼贴只出现在具体事项详情里。',points:['列表负责查找，不在列表里铺开拼贴。','进入某一事项后再看行动和变化。']},
      matterDetail:{title:'Matter：D 留下真实变化',tags:[['现有详情入口',true],['D 视觉提案',false]],body:'事项详情现有「现在最值得做」「相关内容」「最近变化」。D 将最近变化中的真实事件与关联任务做成可回看的纸片；每张纸片保留标题与来源，不能凭标题猜照片或情绪。',points:['「查看任务」使用已有的关联任务动作。','完成后需要真实回执和 MatterLink 才增加纸片。','返回事项桥接是新增导航设计，原入口仍保留。']}
    };
    function page(){return state.stack[state.stack.length-1]}
    function back(){if(state.stack.length>1){state.stack.pop();render()}}
    function push(name){state.stack.push(name);render()}
    function reset(scenario=state.scenario){clearTimeout(state.pendingTimer);clearTimeout(state.receiptTimer);state.scenario=scenario;state.stack=['home'];state.completed=false;state.pending=false;state.checklist=[true,false,false];state.autoCompletionStep=null;state.returnBridge=false;$('undo-toast').classList.remove('show');$('receipt').classList.remove('show');document.querySelectorAll('[data-scenario]').forEach(b=>b.classList.toggle('active',b.dataset.scenario===scenario));render()}
    function openTask(source){if(source==='matter'){state.stack=['home','taskList','taskDetail'];state.returnBridge=true}else{push('taskDetail');return}render()}
    function complete(autoStep=null){if(state.completed)return;state.completed=true;state.pending=true;state.autoCompletionStep=autoStep;const previous=page();if(previous==='taskDetail')state.stack.pop();if(state.returnBridge)state.stack=['home','taskList'];render();const receipt=$('receipt');receipt.classList.remove('show');void receipt.offsetWidth;receipt.classList.add('show');$('undo-toast').classList.add('show');clearTimeout(state.pendingTimer);clearTimeout(state.receiptTimer);state.receiptTimer=setTimeout(()=>receipt.classList.remove('show'),850);state.pendingTimer=setTimeout(()=>{state.pending=false;state.autoCompletionStep=null;$('undo-toast').classList.remove('show')},3000)}
    function undo(){if(!state.pending)return;clearTimeout(state.pendingTimer);clearTimeout(state.receiptTimer);state.completed=false;state.pending=false;if(state.autoCompletionStep!==null)state.checklist[state.autoCompletionStep]=false;state.autoCompletionStep=null;$('receipt').classList.remove('show');$('undo-toast').classList.remove('show');render()}
    function toggleStep(n){if(state.completed||!Number.isInteger(n)||n<0||n>=state.checklist.length)return;const wasChecked=state.checklist[n];state.checklist[n]=!wasChecked;if(!wasChecked&&state.checklist.every(Boolean)){complete(n)}else{render(true)}}
    function navigate(action){switch(action){case 'today':push('today');break;case 'tasks':push('taskList');break;case 'matter':push('matterDetail');break;case 'matter-list':push('matterList');break;case 'task-today':openTask('today');break;case 'task-tasks':openTask('tasks');break;case 'task-matter':openTask('matter');break;case 'return-matter':state.stack=['home','today','matterDetail'];state.returnBridge=false;render();break;case 'complete':complete();break;case 'back':back();break;default:if(action.startsWith('step-'))toggleStep(Number(action.slice(5)))}}
    function header(title,right=''){return `<div class="screen-head"><button class="back" data-action="back" aria-label="返回">‹</button><strong>${title}</strong><small>${right}</small></div>`}
    function bottom(){return '<div class="bottom-nav"><span><i>☀</i>今天</span><span><i>✧</i>对话</span><span><i>◯</i>我的</span></div>'}
    function nextOpenStep(){const index=state.checklist.findIndex(checked=>!checked);return index<0?'准备步骤已处理':stepTitles[index]}
    function stepButtons(){return stepTitles.map((name,i)=>`<button class="inline-step ${state.checklist[i]?'done':''}" data-action="step-${i}" aria-label="${state.checklist[i]?'取消完成':'完成'}：${name}"><span class="step-mark">${state.checklist[i]?'✓':''}</span><span class="step-title">${name}</span></button>`).join('')}
    function home(){return `<div class="home"><div class="home-header"><div><div class="hello">东林，早上好。</div><div class="date">9月18日 · 星期五</div></div><div class="home-settings">⚙</div></div><div class="home-note">今天，可以先把日本旅行的准备向前推一步。</div><div class="home-stage"><button class="feature task" data-action="tasks"><b>✓</b>任务</button><span class="feature finance"><b>¥</b>财务</span><span class="feature habit"><b>◇</b>习惯</span><span class="feature health"><b>♡</b>健康</span><span class="feature thought"><b>✎</b>想法</span><button class="home-orb" data-action="today"><b>今天</b><small>点开看看眼前的事</small></button><div class="home-caption"><strong>今天</strong>有一件事值得先做</div></div>${bottom()}</div>`}
    function today(){return `${header('今天','9月18日')}<div class="today-hero"><div class="hero-tag">C · 眼前这件事</div><h2>${state.completed?'确认住宿与交通':'整理日本旅行证件'}</h2>${state.completed?'':`<div class="today-next-step">下一步 · ${nextOpenStep()}</div>`}<p>${state.completed?'证件已经收好。下一件事已出现。':'来自：国庆去日本 · 今天可以先处理'}</p><button class="primary-light" data-action="${state.completed?'tasks':'task-today'}">${state.completed?'查看全部任务':'查看任务'}</button></div><div class="section-label">进行中的事</div><div class="card today-matter"><strong>国庆去日本</strong><small>${state.completed?'准备工作又向前走了一步':'下一步：整理日本旅行证件'}</small><button data-action="matter">查看这件事</button><button class="plain-link" data-action="matter-list">全部进行中的事 ›</button></div><div class="section-label">今天的安排</div><div class="card today-agenda"><div class="agenda-icon">${state.completed?'✓':'○'}</div><div class="agenda-copy">整理日本旅行证件<small>${state.completed?'今天已完成':'日本旅行 · 今天'}</small></div></div><div class="card today-agenda"><div class="agenda-icon">○</div><div class="agenda-copy">确认住宿与交通<small>日本旅行 · 今天</small></div></div><div class="section-label">保持状态</div><div class="card today-agenda">把日常安排留在视线里，按自己的节奏继续。</div>`}
    function taskList(){return `${header('任务','搜索 · 提醒')}${state.returnBridge?'<div class="bridge"><strong>来自「国庆去日本」</strong><p>处理完关联任务，可以回到这件事继续看变化。</p><button data-action="return-matter">返回进行中的事</button></div>':''}<div class="card task-paper-head"><b>今天这页，慢慢写。</b><p>B · 完成的任务会收进下方的今日事簿。</p></div><div class="task-filter"><span>今日</span><span>收件箱</span><span>全部</span><span>已完成</span></div><div class="section-label">接下来可以做</div>${state.completed?'':`<div class="paper-row task-with-steps"><button class="paper-open" data-action="task-tasks"><span class="circle"></span><span><strong>整理日本旅行证件</strong><small>日本旅行 · 今天</small></span><b>›</b></button><div class="task-mini-steps">${stepButtons()}</div></div>`}<div class="paper-row paper-row-muted"><span class="circle"></span><span><strong>确认住宿与交通</strong><small>日本旅行 · 今天</small></span></div><div class="section-label">今天已写下</div>${state.completed?'<div class="task-record">整理日本旅行证件 <span>成</span></div>':''}<div class="task-record">定好出发日期 <span>成</span></div><div class="module-nav"><span>统计</span><b>任务</b><span>纪念日</span><span>＋ 新增</span></div>`}
    function taskDetail(){return `<div class="sheet-backdrop"><div class="detail-sheet"><div class="handle"></div><div class="detail-head"><span>任务详情</span><button data-action="back" aria-label="关闭任务详情">×</button></div><div class="detail-label">国庆去日本 · 今天</div><h2>整理日本旅行证件</h2><div class="detail-meta"><span>◷ 截止：今天</span><span>⌁ 所属事项：国庆去日本</span></div><div class="detail-section"><strong>子任务</strong><div class="detail-steps">${stepButtons()}</div><p class="step-help">直接勾选步骤，全部完成后任务会一起归档。</p></div><div class="detail-section"><strong>备注</strong><p>护照、签证、机票和住宿确认信息。</p></div><button class="complete-button" data-action="complete">完成这件事</button></div></div>`}
    function matterList(){return `${header('进行中的事')}<h2 class="block-title">正在进行</h2><button class="matter-list-row" data-action="matter"><strong>国庆去日本</strong><small>下一步：${state.completed?'确认住宿与交通':'整理日本旅行证件'}</small></button><div class="section-label">已完成</div><p class="mini">这里保留已完成事项的回看入口。</p>`}
    function matterDetail(){return `${header('进行中的事','详情')}<div class="card matter-head"><span class="kind">正在进行 · 生活事项</span><h2>国庆去日本</h2><p>把旅行前需要做的事，慢慢准备好。</p></div><div class="section-label">现在最值得做</div><div class="card matter-action"><strong>${state.completed?'确认住宿与交通':'整理日本旅行证件'}</strong><p>${state.completed?'证件已处理，接下来核对住宿与交通。':'这是一条已关联的真实任务，可以打开继续处理。'}</p><button data-action="${state.completed?'tasks':'task-matter'}">${state.completed?'查看相关任务':'查看任务'}</button></div><div class="section-label">D · 最近变化</div><div class="collage"><div class="artifact old"><small>日本旅行</small><strong>定好出发日期</strong></div>${state.completed?'<div class="artifact new"><small>日本旅行</small><strong>整理日本旅行证件</strong></div>':''}</div><div class="section-label">相关内容</div><div class="event-line">关联任务 · 整理日本旅行证件</div><div class="event-line">最近变化 · ${state.completed?'证件任务已完成':'出发日期已确定'}</div><button class="plain-link" data-action="matter-list">查看全部进行中的事 ›</button>`}
    const views={home,today,taskList,taskDetail,matterList,matterDetail};
    function renderRoutes(){const items=routes[state.scenario];const current=page();let active=0;if(current==='today')active=state.scenario==='matter'?0:1;if(current==='taskList')active=state.scenario==='matter'?(state.completed?4:3):1;if(current==='matterList')active=1;if(current==='matterDetail')active=state.scenario==='matter'?(state.completed?4:2):2;if(current==='taskDetail')active=state.scenario==='matter'?3:2;if(state.completed&&state.scenario==='today'&&current==='today')active=3;if(state.completed&&state.scenario==='tasks'&&current==='taskList')active=3;$('route-list').innerHTML=items.map((x,i)=>`<li class="${i===active?'active':''}">${x[0]}<span class="route-sub">${x[1]}</span></li>`).join('')}
    function renderExplain(){const item=info[page()];$('explain').innerHTML=`<div class="kicker">CURRENT SCREEN · ${state.scenario.toUpperCase()}</div><h2>${item.title}</h2><div>${item.tags.map(t=>`<span class="concept-tag ${t[1]?'fact-tag':''}">${t[0]}</span>`).join('')}</div><p>${item.body}</p><div class="rule"><h3>从这里，用户会怎样走</h3><ul>${item.points.map(p=>`<li>${p}</li>`).join('')}</ul></div><p class="legend">绿色标签表示当前代码已有入口或页面形态；暖色标签表示此次拟议的新视觉或导航。示例内容为“国庆去日本”，HTML 不连接真实数据。</p><label class="motion"><input id="reduce" type="checkbox" ${document.body.classList.contains('reduced')?'checked':''}> 减少动态效果预览</label>`}
    function render(preserveScroll=false){const current=page();const scrollTop=$('app').scrollTop;$('app').innerHTML=`<div class="page-in">${views[current]()}</div>`;$('app').scrollTop=preserveScroll?scrollTop:0;renderRoutes();renderExplain()}
    $('app').addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target)navigate(target.dataset.action)});
    document.querySelectorAll('[data-scenario]').forEach(button=>button.addEventListener('click',()=>reset(button.dataset.scenario)));
    $('reset').addEventListener('click',()=>reset());$('undo').addEventListener('click',undo);
    $('explain').addEventListener('change',event=>{if(event.target.id==='reduce')document.body.classList.toggle('reduced',event.target.checked)});
    render();
  </script>
</body>
</html>
