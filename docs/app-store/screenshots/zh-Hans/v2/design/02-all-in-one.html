<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="design.css">
<style>
  .stage { display: grid; grid-template-columns: 533px 533px; grid-template-rows: 610px 610px 610px; gap: 34px; }

  .card { border-radius: 52px; padding: 46px 48px 40px; position: relative; overflow: hidden;
          box-shadow: 0 34px 64px rgba(24,34,58,.10), 0 10px 24px rgba(24,34,58,.05); }
  .card .icon { width: 96px; height: 96px; border-radius: 30px; display: flex; align-items: center; justify-content: center; }
  .card .icon svg { width: 56px; height: 56px; fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .card .name { font-size: 46px; font-weight: 600; color: #1C2639; margin-top: 28px; display: flex; align-items: center; gap: 18px; }
  .card .desc { font-size: 30px; color: #6B7484; margin-top: 12px; }

  .badge-new { font-size: 26px; font-weight: 600; color: #fff; background: #FF6B48; border-radius: 999px; padding: 6px 22px; }

  /* 任务 */
  .c-task { background: #FFF0EB; } .c-task .icon { background: rgba(255,107,72,.14); } .c-task .icon svg { stroke: #E8502E; }
  /* 习惯 */
  .c-habit { background: #EDF9F2; } .c-habit .icon { background: rgba(52,199,123,.15); } .c-habit .icon svg { stroke: #1FA563; }
  /* 财务 */
  .c-finance { background: #FFF4E6; } .c-finance .icon { background: rgba(255,159,46,.16); } .c-finance .icon svg { stroke: #E08A00; }
  /* 想法 */
  .c-thought { background: #F1EEFF; } .c-thought .icon { background: rgba(123,92,255,.13); } .c-thought .icon svg { stroke: #6A4CF0; }
  /* 记忆 */
  .c-memory { background: #FFF0E8; } .c-memory .icon { background: rgba(255,138,92,.16); } .c-memory .icon svg { stroke: #E86A34; }
  /* 健康 */
  .c-health { background: #EDF2FF; } .c-health .icon { background: rgba(74,125,255,.13); } .c-health .icon svg { stroke: #3D6BE8; }

  .mini { position: absolute; left: 48px; right: 48px; bottom: 40px; }

  /* 任务 mini：两条待办 */
  .todo-line { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .todo-box { width: 34px; height: 34px; border-radius: 11px; border: 3.5px solid #D8AC9C; }
  .todo-box.done { background: #FF6B48; border-color: #FF6B48; position: relative; }
  .todo-box.done::after { content: ""; position: absolute; left: 9px; top: 8px; width: 12px; height: 7px;
    border-left: 3.5px solid #fff; border-bottom: 3.5px solid #fff; transform: rotate(-45deg); }
  .todo-bar { height: 16px; border-radius: 8px; background: rgba(28,38,57,.14); }
  .todo-line.done .todo-bar { background: rgba(28,38,57,.24); text-decoration: line-through; }

  /* 习惯 mini：七个打卡点 */
  .week-dots { display: flex; gap: 18px; align-items: center; }
  .week-dots i { width: 38px; height: 38px; border-radius: 50%; background: #1FA563; }
  .week-dots i.off { background: rgba(31,165,99,.18); }
  .streak { font-size: 30px; color: #1FA563; font-weight: 600; margin-top: 16px; }

  /* 财务 mini：折线 */
  .trend-note { font-size: 30px; font-weight: 600; color: #E08A00; margin-top: 10px; }

  /* 想法 mini：文字条 */
  .thought-bar { height: 16px; border-radius: 8px; background: rgba(106,76,240,.22); margin-top: 18px; }
  .thought-bar.short { width: 62%; }

  /* 记忆 mini：照片堆 */
  .photo-stack { position: relative; height: 120px; }
  .photo-stack i { position: absolute; width: 150px; height: 108px; border-radius: 16px; border: 6px solid #fff;
    box-shadow: 0 10px 22px rgba(24,34,58,.16); }
  .photo-stack i.p1 { left: 0; top: 8px; background: linear-gradient(135deg,#F5C99B,#E8926A); transform: rotate(-6deg); }
  .photo-stack i.p2 { left: 130px; top: 0; background: linear-gradient(135deg,#BFD9F2,#7FA8D8); transform: rotate(2deg); z-index: 2; }
  .photo-stack i.p3 { left: 262px; top: 10px; background: linear-gradient(135deg,#D9E8C8,#9CBF7E); transform: rotate(7deg); }

  /* 健康 mini：睡眠结构条 */
  .sleep-bar { display: flex; height: 40px; border-radius: 14px; overflow: hidden; }
  .sleep-bar i { height: 100%; }
  .sleep-bar .s1 { width: 18%; background: #C9D6F5; }
  .sleep-bar .s2 { width: 34%; background: #7E97E8; }
  .sleep-bar .s3 { width: 26%; background: #4A66C9; }
  .sleep-bar .s4 { width: 22%; background: #A5B6EE; }
  .sleep-note { font-size: 30px; color: #3D6BE8; font-weight: 600; margin-top: 16px; }
</style>
</head>
<body class="accent-sunset">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
  <div class="brand">
    <div class="logo"><div class="dot"></div><div class="name">HOLO AI</div></div>
    <div class="num">02</div>
  </div>
  <div class="chip">六个模块 · 一个 App</div>
  <h1 class="headline">你的全部生活<br>装进一个 Holo</h1>
  <p class="subtitle">任务、习惯、财务、想法、记忆和健康，不用再装五个 App</p>

  <div class="stage">
    <div class="card c-task">
      <div class="icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19"/><path d="M15 24.5l6.5 6.5L34 18"/></svg></div>
      <div class="name">任务</div>
      <div class="desc">说一句就建好，截止不漏</div>
      <div class="mini">
        <div class="todo-line done"><div class="todo-box done"></div><div class="todo-bar" style="width:64%"></div></div>
        <div class="todo-line"><div class="todo-box"></div><div class="todo-bar" style="width:78%"></div></div>
      </div>
    </div>

    <div class="card c-finance">
      <div class="icon"><svg viewBox="0 0 48 48"><path d="M14 8l10 13 10-13"/><path d="M24 21v19"/><path d="M14 22h20"/><path d="M14 30h20"/></svg></div>
      <div class="name">财务</div>
      <div class="desc">记账对账，趋势清楚</div>
      <div class="mini">
        <svg viewBox="0 0 437 110" width="437" height="110" style="display:block">
          <polyline points="6,26 80,44 150,38 225,66 300,60 372,88 432,80"
            fill="none" stroke="#FF9F2E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="432" cy="80" r="9" fill="#FF9F2E"/>
        </svg>
        <div class="trend-note">较上期 ↓ 14.1%</div>
      </div>
    </div>

    <div class="card c-habit">
      <div class="icon"><svg viewBox="0 0 48 48"><path d="M40 24a16 16 0 1 1-4.7-11.3"/><path d="M37 4.5v8.6h-8.6"/></svg></div>
      <div class="name">习惯</div>
      <div class="desc">打卡补签，坚持看得见</div>
      <div class="mini">
        <div class="week-dots"><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></div>
        <div class="streak">已连续 5 天</div>
      </div>
    </div>

    <div class="card c-thought">
      <div class="icon"><svg viewBox="0 0 48 48"><path d="M24 5a14 14 0 0 1 7.5 25.8c-1.6 1.1-2.3 2.2-2.3 4.2h-10.4c0-2-.7-3.1-2.3-4.2A14 14 0 0 1 24 5z"/><path d="M19 41h10"/></svg></div>
      <div class="name">想法</div>
      <div class="desc">随手记下来，自动整理</div>
      <div class="mini">
        <div class="thought-bar" style="width:86%"></div>
        <div class="thought-bar short"></div>
      </div>
    </div>

    <div class="card c-memory">
      <div class="icon"><svg viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="31" rx="5"/><circle cx="17" cy="20" r="3.6"/><path d="M9 34l9-9 7 7 6-6 8 8"/></svg></div>
      <div class="name">记忆</div>
      <div class="desc">每天自动串成时间线</div>
      <div class="mini">
        <div class="photo-stack"><i class="p1"></i><i class="p2"></i><i class="p3"></i></div>
      </div>
    </div>

    <div class="card c-health">
      <div class="icon"><svg viewBox="0 0 48 48"><path d="M24 41S7 30.5 7 18.5A9.5 9.5 0 0 1 24 12a9.5 9.5 0 0 1 17 6.5C41 30.5 24 41 24 41z"/></svg></div>
      <div class="name">健康 <span class="badge-new">新</span></div>
      <div class="desc">睡眠、活动与体征</div>
      <div class="mini">
        <div class="sleep-bar"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></div>
        <div class="sleep-note">昨晚睡眠 7 小时 42 分</div>
      </div>
    </div>
  </div>
</body>
</html>
